// ---------------- Arrastrar y soltar una actividad a otro día ----------------
// Solo en la vista de mes y solo para actividades reales editables (ver
// draggableEvent más arriba) — mismo criterio que decide si al hacer clic se
// abre el formulario de editar o la ficha de solo lectura.
function wireCalendarDragAndDrop(container){
  container.querySelectorAll('.cal-event-draggable').forEach((btn)=>{
    btn.addEventListener('dragstart', (e)=>{
      e.dataTransfer.setData('text/plain', btn.dataset.id);
      e.dataTransfer.effectAllowed = 'move';
      btn.classList.add('dragging');
    });
    btn.addEventListener('dragend', ()=>btn.classList.remove('dragging'));
  });
  container.querySelectorAll('.cal-cell').forEach((cell)=>{
    cell.addEventListener('dragover', (e)=>{
      if(!e.dataTransfer.types.includes('text/plain')) return;
      e.preventDefault(); e.dataTransfer.dropEffect = 'move';
      cell.classList.add('drag-over');
    });
    cell.addEventListener('dragleave', (e)=>{ if(!cell.contains(e.relatedTarget)) cell.classList.remove('drag-over'); });
    cell.addEventListener('drop', async (e)=>{
      e.preventDefault();
      cell.classList.remove('drag-over');
      const id = Number(e.dataTransfer.getData('text/plain'));
      if(!id) return;
      const item = DB.events.find((ev)=>ev.id===id);
      if(!item) return;
      await moveEventToDate(item, cell.dataset.date);
    });
  });
}
async function moveEventToDate(item, newDate){
  if(!newDate || item.date===newDate) return;
  const conflicts = findConflictingActivities({ ...item, date: newDate }, item.id);
  if(conflicts.length){
    const list = conflicts.map((c)=>`• ${c.organizationName} — ${c.kind==='interview'?'ocupada por una entrevista (privada)':esc(c.title||'')} · ${fmtTime(c.startTime)}${c.endTime?' - '+fmtTime(c.endTime):''}`).join('\n');
    const ok = await confirmModal(`Al moverla al ${fmtDateHuman(newDate)} choca con otra organización:\n\n${list}\n\n¿Moverla de todas formas?`, { title:'Posible choque de horario/lugar', confirmText:'Mover de todas formas' });
    if(!ok) return;
  }
  const dc = findStakeConflicts({ ...item, date: newDate });
  if(dc.length){
    const canOverrideStake = isObispadoLeader(currentUser);
    if(!canOverrideStake){ toast(stakeConflictError(dc, newDate), 'error'); return; }
    const ok2 = await confirmModal(`🏛️ ${stakeConflictError(dc, newDate)} ¿Autorizar y moverla de todas formas como líder de Obispado?`, { title:'Choque con Estaca', confirmText:'Autorizar y mover' });
    if(!ok2) return;
  }
  item.date = newDate;
  toast(`Actividad movida al ${fmtDateHuman(newDate)}`);
  refreshAfterEventChange();
}

// ---------------- Mini calendario emergente para "Ir a fecha" ----------------
// Alternativa visual al input de fecha nativo: una grilla compacta de días,
// con su propia navegación de mes. Se abre EN EL FLUJO NORMAL de la página
// (empuja el contenido hacia abajo, igual que los paneles de
// búsqueda/notificaciones) para que nunca tape ni se corte con otro
// recuadro en celular.
function renderMiniCalPanel(){
  const panel = document.getElementById('mini-cal-panel');
  if(!panel) return;
  panel.hidden = !state.miniCalOpen;
  if(!state.miniCalOpen) return;
  const monthDate = state.miniCalMonth || new Date(state.calMonth);
  const gridStart = gridStartDate(monthDate);
  const today = new Date();
  let cells = '';
  for(let i=0;i<42;i++){
    const cellDate = new Date(gridStart); cellDate.setDate(gridStart.getDate()+i);
    const iso = toISODate(cellDate);
    const otherMonth = cellDate.getMonth() !== monthDate.getMonth();
    const isToday = isSameDay(cellDate, today);
    const hasItems = DB.events.some((e)=>e.date===iso) || DB.interviews.some((iv)=>iv.date===iso);
    cells += `<button type="button" class="mini-cal-cell ${otherMonth?'other-month':''} ${isToday?'today':''}" data-date="${iso}">${cellDate.getDate()}${hasItems?'<span class="mini-cal-dot"></span>':''}</button>`;
  }
  panel.innerHTML = `
    <div class="mini-cal-nav">
      <button type="button" class="icon-btn" id="mini-cal-prev">‹</button>
      <div class="mini-cal-label">${MONTH_LABELS[monthDate.getMonth()].charAt(0).toUpperCase()+MONTH_LABELS[monthDate.getMonth()].slice(1)} ${monthDate.getFullYear()}</div>
      <button type="button" class="icon-btn" id="mini-cal-next">›</button>
    </div>
    <div class="mini-cal-dow-row">${DOW_LABELS.map((d)=>`<div>${d.slice(0,1)}</div>`).join('')}</div>
    <div class="mini-cal-grid">${cells}</div>`;
  document.getElementById('mini-cal-prev').addEventListener('click', ()=>{
    state.miniCalMonth = addMonths(monthDate,-1);
    renderMiniCalPanel();
  });
  document.getElementById('mini-cal-next').addEventListener('click', ()=>{
    state.miniCalMonth = addMonths(monthDate,1);
    renderMiniCalPanel();
  });
  panel.querySelectorAll('.mini-cal-cell').forEach((btn)=>btn.addEventListener('click', ()=>{
    const iso = btn.dataset.date;
    const [y,m] = iso.split('-').map(Number);
    state.calMonth = new Date(y, m-1, 1);
    state.miniCalOpen = false;
    renderCalendarView();
    openDayModal(iso);
  }));
}

// Mutación directa de DB (el demo no tiene servidor/API): busca el evento
// por id, y agrega/actualiza/quita (según toque) la respuesta de la
// persona actual dentro de su .rsvps — mismo comportamiento de
// "clic de nuevo = quitar la respuesta" que POST /api/events/:id/rsvp.
function sendRsvp(eventId, response){
  const ev = DB.events.find((e)=>e.id===Number(eventId));
  if(!ev) return null;
  const rsvps = Array.isArray(ev.rsvps) ? ev.rsvps : (ev.rsvps = []);
  const idx = rsvps.findIndex((r)=>Number(r.userId)===Number(currentUser.id));
  if(response===null){
    if(idx!==-1) rsvps.splice(idx, 1);
  } else if(idx!==-1){
    rsvps[idx] = { userId:currentUser.id, response, respondedAt:new Date().toISOString() };
  } else {
    rsvps.push({ userId:currentUser.id, response, respondedAt:new Date().toISOString() });
  }
  return withOrgInfo(ev);
}

function wireRsvpButtons(item){

  if(!yesBtn || !noBtn) return;
  const handle = (response) => () => {
    const nextResponse = item.myRsvp===response ? null : response; // clic de nuevo = quitar la respuesta
    const updated = sendRsvp(item.id, nextResponse);
    if(!updated) return;
    Object.assign(item, updated);
    const box = document.querySelector('.rsvp-box');
    if(box) box.outerHTML = rsvpSectionHtml(item);
    wireRsvpButtons(item);
  };
  yesBtn.addEventListener('click', handle('yes'));
  noBtn.addEventListener('click', handle('no'));
}

// Punto 4 — Solicitud de entrevista: cualquier usuario pide una entrevista
// proponiendo fecha, hora y un motivo opcional, eligiendo entre las
// organizaciones que le corresponden según el Manual General (ver
// interviewEligibility). La solicitud le llega a cualquiera de los líderes
// de esa organización (o siempre al Obispado), quien la confirma (puede
// ajustar la fecha/hora) o la rechaza con un comentario.
// Entrevistas YA agendadas (status scheduled) para este líder específico en
// esta organización, dentro de las próximas 6 semanas — ver la misma
// función en el servidor (interview-requests.js).
const AVAILABILITY_WINDOW_DAYS = 42;
function isoDatePlusDays(days){
  const d = new Date();
  d.setHours(0,0,0,0);
  d.setDate(d.getDate()+days);
  return isoDate(d);
}
function busyRangesFor(organizationId, leaderName){
  if(!leaderName) return [];
  const todayIso = isoDatePlusDays(0);
  const limitIso = isoDatePlusDays(AVAILABILITY_WINDOW_DAYS);
  return DB.interviews
    .filter((iv)=>iv.status==='scheduled' && Number(iv.organizationId)===Number(organizationId)
      && iv.interviewerName===leaderName && iv.date>=todayIso && iv.date<=limitIso)
    .map((iv)=>({ date: iv.date, startTime: iv.startTime, endTime: iv.endTime||null }));
}
function hasSchedulingConflict(organizationId, leaderName, date, startTime, endTime){
  return busyRangesFor(organizationId, leaderName).some((b)=>b.date===date && timesOverlap(startTime, endTime, b.startTime, b.endTime));
}
function eligibleRequestOrgs(user){
  return DB.organizations
    .filter((o)=>o.allowsInterviews)
    .filter((o)=>interviewEligibility(o.name, user) === true)
    .map((o)=>{
      // El Secretario/a es líder pero no entrevista según el Manual General
      // — queda fuera de a quién se le puede pedir una entrevista.
      const interviewingLeaders = DB.users.filter((u)=>u.role==='leader' && Number(u.organizationId)===o.id && u.calling!=='Secretario');
      return {
        id: o.id, name: o.name, color: o.color,
        leaderNames: interviewingLeaders.map((u)=>u.name),
        leaders: interviewingLeaders.map((u)=>({
          id: u.id, name: u.name, isPresident: !!u.isPresident, calling: u.calling||null,
          callingLabel: callingLabel(o.name, u.calling), availability: u.interviewAvailability||[],
          busy: busyRangesFor(o.id, u.name),
        })),
      };
    });
}

// ===================== MIS ACTIVIDADES =====================
// ---------------- Exportar "Mis Actividades" a un calendario personal ----------------
// En la app real esto es un enlace de suscripción que se mantiene
// sincronizado solo; en este demo (sin servidor real que aloje el enlace) se
// ofrece como una descarga única del archivo .ics con el mismo contenido, que
// se puede importar a mano en Google Calendar, Apple Calendar u Outlook.
function icsEscapeText(str){
  return String(str||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n');
}
function icsByteLen(s){ return new TextEncoder().encode(s).length; }
function icsFoldLine(line){
  if(icsByteLen(line) <= 75) return line;
  const parts = [];
  let current = '', currentBytes = 0;
  for(const ch of line){
    const chBytes = icsByteLen(ch);
    const limit = parts.length===0 ? 75 : 74;
    if(currentBytes+chBytes > limit){ parts.push(current); current = ch; currentBytes = chBytes; }
    else { current += ch; currentBytes += chBytes; }
  }
  if(current) parts.push(current);
  return parts.map((p,i)=> i===0?p:' '+p).join('\r\n');
}
function icsFormatDateTime(dateStr, timeStr){
  const [y,m,d] = String(dateStr).split('-');
  const [hh,mm] = String(timeStr||'00:00').split(':');
  return `${y}${m}${d}T${(hh||'00').padStart(2,'0')}${(mm||'00').padStart(2,'0')}00`;
}
function icsFormatUtcStamp(){
  return new Date().toISOString().replace(/[-:]/g,'').split('.')[0]+'Z';
}
function buildIcsCalendar(items, calendarName){
  const now = icsFormatUtcStamp();
  const lines = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//OrganizaSion//Mis Actividades (demo)//ES','CALSCALE:GREGORIAN','METHOD:PUBLISH',`X-WR-CALNAME:${icsEscapeText(calendarName)}`];
  for(const it of items){
    if(!it.date || !it.startTime) continue;
    lines.push('BEGIN:VEVENT');
    lines.push(`UID:${it.kind}-${it.id}@calendario-barrio-valle-grande-demo`);
    lines.push(`DTSTAMP:${now}`);
    lines.push(`DTSTART:${icsFormatDateTime(it.date, it.startTime)}`);
    if(it.endTime) lines.push(`DTEND:${icsFormatDateTime(it.date, it.endTime)}`);
    else lines.push('DURATION:PT1H');
    lines.push(`SUMMARY:${icsEscapeText(it.summary)}`);
    if(it.location) lines.push(`LOCATION:${icsEscapeText(locationDisplay(it))}`);
    if(it.description) lines.push(`DESCRIPTION:${icsEscapeText(it.description)}`);
    if(it.organizationName) lines.push(`CATEGORIES:${icsEscapeText(it.organizationName)}`);
    lines.push('END:VEVENT');
  }
  lines.push('END:VCALENDAR');
  return lines.map(icsFoldLine).join('\r\n') + '\r\n';
}
function buildMyActivitiesIcsItems(list){
  return list.map((it) => it.kind === 'interview' ? {
    id: it.id, kind: 'interview', date: it.date, startTime: it.startTime, endTime: it.endTime,
    summary: `👤 Entrevista${it.description ? ': ' + it.description : ''}`,
    location: locationDisplay(it) || '',
    // Si se le citó junto con alguien más (matrimonio, compañerismo de
    // ministración — ver groupId), se le avisa con quién, sin exponer el
    // teléfono/email de esa otra persona — igual criterio que
    // myActivitiesItems en el servidor real (calendar.js).
    description: [
      it.interviewerName ? `Te entrevista: ${it.interviewerName}` : '',
      it.organizationName ? `Organización: ${it.organizationName}` : '',
      othersInGroup(it).length ? `Junto con: ${joinNames(othersInGroup(it))}` : '',
    ].filter(Boolean).join('\n'),
    organizationName: it.organizationName || '',
  } : {
    id: it.id, kind: 'event', date: it.date, startTime: it.startTime, endTime: it.endTime,
    summary: `${it.isMeeting ? '🔒 ' : it.isWardActivity ? '🏘️ ' : ''}${it.title}`,
    location: locationDisplay(it) || '',
    description: it.description || '',
    organizationName: it.organizationName || '',
  });
}
function downloadMyActivitiesIcs(list, personName){
  const items = buildMyActivitiesIcsItems(list);
  const ics = buildIcsCalendar(items, `Mis Actividades — ${personName}`);
  const blob = new Blob([ics], { type: 'text/calendar;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'mis-actividades.ics';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 2000);
  toast('Se descargó el archivo .ics — impórtalo en tu calendario (en este demo es una exportación única; la app real usa un enlace que se sincroniza solo)');
}

// Punto 11 — aviso (no bloqueante) de actividad en lunes por la noche: el
// Manual General reserva esa noche para la Noche de Hogar (20.7.1) — es
// puramente informativo, no impide crear o guardar la actividad.
function isMondayEveningISO(dateISO, startTime){
  if(!dateISO || !startTime) return false;
  const [y,m,d] = dateISO.split('-').map(Number);
  if(!y || !m || !d) return false;
  const isMonday = new Date(y, m-1, d).getDay() === 1;
  return isMonday && startTime >= '18:00';
}
function mondayWarningHtml(){
  return `<div class="hint-box" style="margin-top:0; border-color:#fde68a; background:#fef3c7; color:#92400e;">⚠️ Es lunes en la noche — esa noche normalmente está reservada para la Noche de Hogar (Manual General 20.7.1). Puedes seguir igual si hace falta, esto es solo un recordatorio.</div>`;
}

        ${advancedOptionsToggleHtml('ev', hasAdvancedData)}
        <div id="ev-advanced-fields" style="${hasAdvancedData ? '' : 'display:none;'}">
          ${eventTypeFieldHtml('ev', !!existing?.isMeeting)}
          ${wardActivityFieldHtml('ev', !!existing?.isWardActivity)}
          ${involvedOrgsFieldHtml('ev', involvedIds)}
          ${!isEdit ? recurrenceFieldHtml('ev') : ''}
        </div>
        <div class="field"><label>Propósito</label><select name="purpose" required>
          <option value="" disabled ${!existing?.purpose?'selected':''}>Selecciona un propósito…</option>
          ${PURPOSE_OPTIONS.map((p)=>`<option value="${p}" ${existing?.purpose===p?'selected':''}>${p}</option>`).join('')}
        </select></div>
        ${locationFieldHtml('ev', existing?.location, existing?.sala)}
        <div id="ev-conflict-warning"></div>
        <div class="field"><label>Notas adicionales (opcional)</label><textarea name="description">${esc(existing?.description||'')}</textarea></div>
        <div class="field"><label>Día</label><input type="date" name="date" required value="${existing?.date||''}" /></div>
        <div class="two-col">
          <div class="field"><label>Hora de inicio</label><input type="time" name="startTime" required value="${existing?.startTime||''}" /></div>
          <div class="field"><label>Hora de término (opcional)</label><input type="time" name="endTime" value="${existing?.endTime||''}" /></div>

      <div>${isEdit?`<button class="btn btn-danger" id="ev-delete">Eliminar</button>`:''}</div>
      <div style="display:flex; gap:8px;"><button class="btn btn-secondary" id="ev-cancel">Cancelar</button><button class="btn btn-primary" id="ev-save">${isEdit?'Guardar cambios':'Crear actividad'}</button></div>
    </div></div></div>`;
  const evGuardedClose = wireUnsavedChangesGuard(document.getElementById('ev-form'));
  document.getElementById('ev-modal-close').addEventListener('click', evGuardedClose);
  document.getElementById('ev-cancel').addEventListener('click', evGuardedClose);
  document.getElementById('ev-modal-backdrop').addEventListener('click',(e)=>{ if(e.target.id==='ev-modal-backdrop') evGuardedClose(); });
  if(isEdit) document.getElementById('ev-delete').addEventListener('click', async ()=>{
    if(!(await confirmModal('¿Eliminar esta actividad?', { title:'Eliminar actividad', confirmText:'Eliminar', danger:true }))) return;
    DB.events = DB.events.filter((e)=>e.id!==existing.id);
    closeModal(); toast('Actividad eliminada'); refreshAfterEventChange();
  });
  if(!isEdit) wireRecurrenceField('ev');
  wireAdvancedOptionsToggle('ev');

  let conflictsChecked = false;
  let stakeConflictsChecked = false; // solo puede quedar en true si el líder de Obispado ya vio el choque y confirmó
  const saveBtn = document.getElementById('ev-save');
  const resetConflictCheck = () => {
    conflictsChecked = false;
    stakeConflictsChecked = false;
    saveBtn.textContent = isEdit ? 'Guardar cambios' : 'Crear actividad';
    document.getElementById('ev-conflict-warning').innerHTML = '';
  };
  const form = document.getElementById('ev-form');
  ['date','startTime','endTime'].forEach((name)=>{ form.querySelector(`[name="${name}"]`)?.addEventListener('change', resetConflictCheck); });
  wireLocationField('ev', resetConflictCheck);
  document.getElementById('ev-location-other-field').querySelector('input').addEventListener('input', resetConflictCheck);

  // Punto 11: aviso no bloqueante si la actividad cae un lunes en la noche.
  const updateMondayWarning = () => {
    const dateVal = form.querySelector('[name="date"]').value;
    const startVal = form.querySelector('[name="startTime"]').value;
    document.getElementById('ev-monday-warning').innerHTML = isMondayEveningISO(dateVal, startVal) ? mondayWarningHtml() : '';
  };
  form.querySelector('[name="date"]').addEventListener('change', updateMondayWarning);
  form.querySelector('[name="startTime"]').addEventListener('change', updateMondayWarning);
  updateMondayWarning();

  wireSupervisingAdultsRows();

  const orgSelectEl = document.getElementById('ev-org-select');
  refreshInvolvedOrgOptions('ev', orgSelectEl.value);
  orgSelectEl.addEventListener('change', ()=>{ refreshInvolvedOrgOptions('ev', orgSelectEl.value); updateSupervisingAdultsSection(orgSelectEl.value); resetConflictCheck(); });
  document.querySelectorAll('#ev-involved-orgs input[type="checkbox"]').forEach((cb)=>cb.addEventListener('change', resetConflictCheck));
  wireWardActivityField('ev', '#ev-involved-orgs-field', resetConflictCheck);

  saveBtn.addEventListener('click', async ()=>{
    if(!form.reportValidity()) return;
    const fd = new FormData(form);
    const location = computeLocationFromForm(fd);
    if(fd.get('locationType')==='Otro' && !location){ document.getElementById('ev-error').innerHTML = '<div class="error-msg">Escribe cuál es el lugar</div>'; return; }
    const sala = computeSalaFromForm(fd, location);
    if(STANDARD_LOCATIONS.includes(location) && fd.get('salaType')==='OtraSala' && !sala){ document.getElementById('ev-error').innerHTML = '<div class="error-msg">Escribe cuál es la sala</div>'; return; }
    const body = Object.fromEntries(fd.entries());
    body.location = location; body.sala = sala;
    delete body.locationType; delete body.locationOther; delete body.salaType; delete body.salaOther;
    const orgId = Number(body.organizationId);
    const isWardActivity = document.getElementById('ev-ward-activity').checked;
    const involvedOrganizationIds = isWardActivity ? [] : normalizeInvolvedOrgIds(computeInvolvedOrgIds(fd), orgId);
    body.involvedOrganizationIds = involvedOrganizationIds;
    body.isWardActivity = isWardActivity;
    body.isMeeting = document.getElementById('ev-type-select').value === 'meeting';
    if(!canEditOrg(orgId)){ document.getElementById('ev-error').innerHTML = '<div class="error-msg">Solo el líder de la organización o un administrador puede agregar actividades aquí</div>'; return; }

    // Punto 13: adultos supervisores obligatorios (mínimo 2) para HJ/MJ/Primaria.
    const supervisingAdults = orgRequiresSupervisingAdultsClient(orgId)
      ? Array.from(document.querySelectorAll('#ev-sa-rows .sa-name-input')).map((i)=>i.value.trim()).filter(Boolean)
      : [];
    if(orgRequiresSupervisingAdultsClient(orgId) && supervisingAdults.length < 2){
      document.getElementById('ev-error').innerHTML = '<div class="error-msg">Debes registrar al menos 2 adultos supervisores</div>';
      return;
    }
    body.supervisingAdults = supervisingAdults;

    document.getElementById('ev-error').innerHTML = '';
    const canOverrideStake = isObispadoLeader(currentUser);

    if(!stakeConflictsChecked){
      const stakeConflicts = findStakeConflicts(body);
      if(stakeConflicts.length){
        document.getElementById('ev-conflict-warning').innerHTML = stakeConflictWarningHtml(stakeConflicts, canOverrideStake);
        if(canOverrideStake){
          stakeConflictsChecked = true;
          saveBtn.textContent = 'Agendar de todas formas';
        }
        return; // esperando confirmación (o bloqueado sin remedio si no puede autorizarlo)
      }
    }

    if(!conflictsChecked){
      const conflicts = findConflictingActivities(body, existing?.id);
      if(conflicts.length){
        document.getElementById('ev-conflict-warning').innerHTML = conflictWarningHtml(conflicts);
        conflictsChecked = true;
        saveBtn.textContent = 'Agendar de todas formas';
        return;
      }
    }
    document.getElementById('ev-conflict-warning').innerHTML = '';
    const dates = !isEdit ? computeRecurrenceDates('ev', body.date) : [body.date];
    // Igual que el servidor de la app real: se revisa CADA fecha de una
    // repetición, no solo la primera — si alguna choca con Estaca y no se
    // autorizó igual, se rechaza el lote completo.
    if(!isEdit && dates.length>1 && !stakeConflictsChecked){
      for(const d of dates){
        const dc = findStakeConflicts({ ...body, date: d });
        if(dc.length){
          if(canOverrideStake && await confirmModal(`🏛️ ${stakeConflictError(dc, d)} ¿Autorizar y agendar de todas formas como líder de Obispado?`, { title:'Choque con Estaca', confirmText:'Autorizar y agendar' })) continue;
          document.getElementById('ev-error').innerHTML = `<div class="error-msg">${esc(stakeConflictError(dc, d))}</div>`;
          return;
        }
      }
    }
    if(isEdit){
      Object.assign(existing, { title:body.title, description:body.description, location:body.location||'', sala:body.sala||'', date:body.date, startTime:body.startTime, endTime:body.endTime||null, organizationId:orgId, involvedOrganizationIds, isWardActivity, isMeeting: body.isMeeting, purpose: body.purpose || existing.purpose || null, supervisingAdults });
    } else {
      const recurrenceGroupId = dates.length>1 ? `rec_${nextId('events')}` : null;
      dates.forEach((d)=>{
        DB.events.push({ id: nextId('events'), title:body.title, description:body.description||'', location:body.location||'', sala:body.sala||'', date:d, startTime:body.startTime, endTime:body.endTime||null, organizationId:orgId, involvedOrganizationIds, isWardActivity, isMeeting: body.isMeeting, purpose: body.purpose || null, supervisingAdults, recurrenceGroupId, createdBy: currentUser.id, createdAt: new Date().toISOString() });
      });
    }
    closeModal(); toast(isEdit?'Actividad actualizada':(dates.length>1?`${dates.length} actividades creadas`:'Actividad creada')); refreshAfterEventChange();
  });
}

    : [{ memberName: iv.memberName, timesInterviewed: iv.timesInterviewed, lastInterviewDate: iv.lastInterviewDate }];

    const m = members[0];
    const times = m.timesInterviewed===1 ? '1 vez' : `${m.timesInterviewed||0} veces`;
    return `Se le ha entrevistado ${times} en total${m.lastInterviewDate?' · última vez '+esc(fmtDateHuman(m.lastInterviewDate)):''}`;

      </div>
      <div class="card-list">
        ${pendingRequests.length ? pendingRequests.map((r)=>interviewRequestRowHtml(r)).join('') : emptyStateHtml('No hay solicitudes de entrevista pendientes')}

      ${decidedRequests.length ? `
        <button type="button" class="btn btn-secondary btn-sm" id="ivreq-history-toggle" style="margin-top:16px;">

        </button>
        <div class="card-list" style="margin-top:10px;">
          ${state.interviewRequestsHistoryOpen ? decidedRequests.map((r)=>interviewRequestRowHtml(r)).join('') : ''}
        </div>` : ''}
    `;
    const newBtn = document.getElementById('iv-new'); if(newBtn) newBtn.addEventListener('click', ()=>openInterviewModal());
    const availBtn = document.getElementById('iv-avail'); if(availBtn) availBtn.addEventListener('click', ()=>openLeaderAvailabilityModal());

    if(historyToggle) historyToggle.addEventListener('click', ()=>{ state.interviewRequestsHistoryOpen = !state.interviewRequestsHistoryOpen; renderInterviewsView(); });

      if(r) openConfirmRequestModal(r);
    }));
    container.querySelectorAll('.ivreq-reject-btn').forEach((b)=>b.addEventListener('click', ()=>{
      const r = pendingRequests.find((x)=>x.id===Number(b.dataset.id));
      if(r) openRejectRequestModal(r);
    }));
    return;
  }

  let list = interviewsPending();
  list.sort((a,b)=>(a.date+a.startTime).localeCompare(b.date+b.startTime));
  let history = interviewsHistory();
  history.sort((a,b)=>(b.markedAt||'').localeCompare(a.markedAt||'') || b.date.localeCompare(a.date));

  // Quien ve entrevistas de más de una organización a la vez (Obispado o
  // Administrador) las ve en sub-pestañas — una por organización — en vez
  // de una sola lista larga o de secciones apiladas mezclando las tres.
  // Por defecto se muestra la propia organización de quien mira (Obispado,
  // para su líder); el Administrador, que no pertenece a ninguna, parte
  // viendo la primera de la lista (Obispado). Un líder que solo ve la suya
  // sigue viendo la lista simple de siempre, sin ninguna sub-pestaña
  // (interviewOrgs.length===1 en ese caso).
  const sectioned = interviewOrgs.length > 1;
  if(sectioned){
    const validIds = interviewOrgs.map((o)=>o.id);
    if(!validIds.includes(state.interviewsOrgTab)){
      state.interviewsOrgTab = (interviewOrgs.find((o)=>o.id===currentUser.organizationId) || interviewOrgs[0]).id;
    }
  }
  const activeOrg = sectioned ? interviewOrgs.find((o)=>o.id===state.interviewsOrgTab) : null;
  const visiblePending = sectioned ? list.filter((iv)=>Number(iv.organizationId)===Number(activeOrg.id)) : list;
  const visibleHistory = sectioned ? history.filter((iv)=>Number(iv.organizationId)===Number(activeOrg.id)) : history;

  const orgTabsHtml = sectioned ? `
    <div class="subtabs iv-org-tabs" style="margin-top:10px;">
      ${interviewOrgs.map((o)=>{
        const count = list.filter((iv)=>Number(iv.organizationId)===Number(o.id)).length;
        return `<button type="button" class="subtab-btn iv-org-tab ${activeOrg.id===o.id?'active':''}" data-org-id="${o.id}">
          <span style="display:inline-block; width:8px; height:8px; border-radius:50%; background:${o.color}; margin-right:5px;"></span>${esc(o.name)}${count ? ` <span style="background:var(--celeste);color:#fff;border-radius:999px;padding:1px 7px;font-size:11px;margin-left:4px;">${count}</span>` : ''}
        </button>`;
      }).join('')}
    </div>` : '';

  const pendingListHtml = !visiblePending.length
    ? emptyStateHtml(
        sectioned ? `${activeOrg.name} no tiene entrevistas pendientes de agendar o verificar` : 'No hay entrevistas pendientes de agendar o verificar',
        canManage ? { id:'iv-empty-new', label:'+ Agendar la primera' } : null
      )
    : interviewPendingDateGroupsHtml(visiblePending);

  container.innerHTML = `
    <div class="section-header">
      <div><h2>Entrevistas</h2><p>${seesAll ? 'Agendadas por los líderes de Obispado, Cuórum de Élderes y Sociedad de Socorro' : 'Entrevistas de tu organización · información privada, no visible para otras organizaciones'}</p></div>
      <div style="display:flex; gap:8px;">
        ${currentUser.role==='leader' ? `<button class="btn btn-secondary" id="iv-avail">🗓️ Mi disponibilidad</button>` : ''}
        ${canManage ? `<button class="btn btn-primary" id="iv-new">+ Agendar entrevista</button>` : ''}
      </div>
    </div>
    ${canManage ? `
    <div class="subtabs">
      <button class="subtab-btn active" data-tab="pending">🗓️ Agenda</button>
      <button class="subtab-btn" data-tab="requests">📥 Solicitudes${pendingRequests.length ? ` <span style="background:var(--celeste);color:#fff;border-radius:999px;padding:1px 7px;font-size:11px;margin-left:4px;">${pendingRequests.length}</span>` : ''}</button>
    </div>` : ''}
    ${orgTabsHtml}
    ${visiblePending.length ? `<div class="hint-box" style="margin-top:12px;">Cuando la entrevista ya se realizó (o no se pudo hacer), márcala con ✅ o ❌ — puedes agregar un comentario opcional. Pasa automáticamente al historial y ya no queda pendiente acá.</div>` : ''}
    <div class="card-list" style="margin-top:${sectioned?'12':'0'}px;">
      ${pendingListHtml}
    </div>
    ${history.length ? `
      <button type="button" class="btn btn-secondary btn-sm" id="iv-history-toggle" style="margin-top:16px;">
        ${state.interviewsHistoryOpen ? '▲ Ocultar historial' : `📜 Ver historial (${visibleHistory.length} entrevista${visibleHistory.length===1?'':'s'} verificada${visibleHistory.length===1?'':'s'})`}
      </button>
      <div class="card-list" style="margin-top:10px;">
        ${state.interviewsHistoryOpen ? (
          visibleHistory.length
            ? visibleHistory.map((iv)=>interviewHistoryCardHtml(iv)).join('')
            : emptyStateHtml(sectioned ? `${activeOrg.name} no tiene entrevistas verificadas todavía` : 'No hay entrevistas verificadas todavía')
        ) : ''}
      </div>` : ''}
  `;
  const newBtn = document.getElementById('iv-new'); if(newBtn) newBtn.addEventListener('click', ()=>openInterviewModal());
  const availBtn2 = document.getElementById('iv-avail'); if(availBtn2) availBtn2.addEventListener('click', ()=>openLeaderAvailabilityModal());
  container.querySelectorAll('.subtabs .subtab-btn[data-tab]').forEach((b)=>b.addEventListener('click', ()=>{ state.interviewsSubtab = b.dataset.tab; renderInterviewsView(); }));
  container.querySelectorAll('.iv-org-tab[data-org-id]').forEach((b)=>b.addEventListener('click', ()=>{ state.interviewsOrgTab = Number(b.dataset.orgId); renderInterviewsView(); }));
  container.querySelectorAll('[data-edit-iv]').forEach((b)=>b.addEventListener('click', ()=>openInterviewModal(visibleInterviewGroups().find((i)=>i.id===Number(b.dataset.editIv)))));
  container.querySelectorAll('.iv-mark').forEach((b)=>b.addEventListener('click', ()=>{
    const iv = visibleInterviewGroups().find((i)=>i.id===Number(b.dataset.id));
    if(iv) openInterviewMarkModal(iv, b.dataset.status);
  }));
  const historyToggle = document.getElementById('iv-history-toggle');
  if(historyToggle) historyToggle.addEventListener('click', ()=>{ state.interviewsHistoryOpen = !state.interviewsHistoryOpen; renderInterviewsView(); });
  wireEmptyStateCta('iv-empty-new', ()=>openInterviewModal());
  wireInterviewHistoryCards(visibleHistory);
}

// Tarjeta de UNA solicitud de entrevista — pendiente (con Confirmar/
// Rechazar) o ya decidida (solo lectura, para el historial).
function interviewRequestRowHtml(r){
  const statusPill = r.status==='pending'
    ? '<span class="status-pill status-amber">Pendiente</span>'

      ? '<span class="status-pill status-green">Confirmada</span>'
      : '<span class="status-pill status-red">Rechazada</span>';
  return `
    <div class="list-card">
      <span class="org-dot" style="background:${r.organizationColor}"></span>
      <div class="lc-main">
        <div class="lc-title">${esc(r.memberName)} ${statusPill}</div>
        <div class="lc-sub">${esc(r.organizationName)}${r.targetLeaderName ? ' · con ' + esc(r.targetLeaderName) : ''} · propone ${esc(fmtDateHuman(r.date))} · ${esc(fmtTime(r.startTime))}${r.endTime?' - '+esc(fmtTime(r.endTime)):''}${r.note?' · '+esc(r.note):''}</div>
        ${r.status==='rejected' && r.decisionComment ? `<div class="lc-sub" style="margin-top:2px; font-style:italic;">💬 ${esc(r.decisionComment)}</div>` : ''}
        ${r.status!=='pending' && r.decidedByName ? `<div class="lc-sub" style="margin-top:2px;">Decidida por ${esc(r.decidedByName)}</div>` : ''}
      </div>
      ${r.status==='pending' ? `
      <div class="lc-actions">
        <button type="button" class="btn btn-primary btn-sm ivreq-confirm-btn" data-id="${r.id}">Confirmar</button>
        <button type="button" class="btn btn-ghost btn-sm ivreq-reject-btn" data-id="${r.id}">Rechazar</button>
      </div>` : ''}
    </div>`;
}
// Punto 4 — Confirmar una solicitud de entrevista: el líder (de la
// organización correspondiente, o cualquier líder de Obispado) puede
// mantener la fecha/hora que propuso quien la pidió, o ajustarla — más el
// lugar y quién la va a realizar. Al guardar se crea la entrevista real.
function openConfirmRequestModal(r){
  const modalRoot = document.getElementById('modal-root');
  modalRoot.innerHTML = `
    <div class="modal-backdrop" id="ivc-modal-backdrop">
      <div class="modal">
        <div class="modal-header"><h3>Confirmar entrevista</h3><button class="modal-close" id="ivc-modal-close">×</button></div>
        <div class="modal-body">
          <div id="ivc-error"></div>
          <p class="hint-box" style="margin-top:0;">${esc(r.memberName)} pidió una entrevista con ${esc(r.organizationName)}${r.targetLeaderName ? ' (' + esc(r.targetLeaderName) + ')' : ''}${r.note ? ' · ' + esc(r.note) : ''}</p>
          <form id="ivc-form">
            <div class="two-col">
              <div class="field"><label>Día</label><input type="date" name="date" required value="${esc(r.date)}" /></div>
              <div class="field"><label>Hora de inicio</label><input type="time" name="startTime" required value="${esc(r.startTime)}" /></div>
            </div>
            <div class="field"><label>Hora de término (opcional)</label><input type="time" name="endTime" value="${esc(r.endTime||'')}" /></div>
            ${locationFieldHtml('ivc')}
            <div class="field"><label>Líder que realizará la entrevista</label><input type="text" name="interviewerName" required placeholder="Nombre del líder" value="${esc(r.targetLeaderName || currentUser.name)}" /></div>
            <div class="two-col">
              <div class="field"><label>Email del líder (opcional)</label><input type="email" name="interviewerEmail" placeholder="lider@correo.com" value="${esc(currentUser.email||'')}" /></div>
              <div class="field"><label>WhatsApp del líder (opcional)</label><input type="text" name="interviewerPhone" placeholder="+56 9 ..." /></div>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <div></div>
          <div style="display:flex; gap:8px;">
            <button class="btn btn-secondary" id="ivc-cancel">Cancelar</button>
            <button class="btn btn-primary" id="ivc-save">Confirmar entrevista</button>
          </div>
        </div>
      </div>
    </div>`;
  wireLocationField('ivc');
  const ivcGuardedClose = wireUnsavedChangesGuard(document.getElementById('ivc-form'));
  document.getElementById('ivc-modal-close').addEventListener('click', ivcGuardedClose);
  document.getElementById('ivc-cancel').addEventListener('click', ivcGuardedClose);
  document.getElementById('ivc-modal-backdrop').addEventListener('click', (e)=>{ if(e.target.id==='ivc-modal-backdrop') ivcGuardedClose(); });
  document.getElementById('ivc-save').addEventListener('click', ()=>{
    const form = document.getElementById('ivc-form');
    if(!form.reportValidity()) return;
    const fd = new FormData(form);
    const location = computeLocationFromForm(fd);
    if(fd.get('locationType')==='Otro' && !location){
      document.getElementById('ivc-error').innerHTML = `<div class="error-msg">Escribe cuál es el lugar</div>`;
      return;
    }
    const sala = computeSalaFromForm(fd, location);
    const now = new Date().toISOString();
    const newId = nextId('interviews');
    // Una solicitud siempre es de UNA persona — pero después se puede editar
    // la entrevista ya confirmada para agregar más (matrimonio,
    // compañerismo de ministración), por eso igual necesita su propio
    // `groupId` desde el principio (auto-referenciado, "grupo de 1").
    const iv = {
      id: newId, groupId: newId, memberName: r.memberName, memberUserId: r.memberUserId, memberPhone:'', memberEmail:'',
      description: r.note||'', location, sala,
      interviewerName: fd.get('interviewerName'), interviewerEmail: fd.get('interviewerEmail')||'', interviewerPhone: fd.get('interviewerPhone')||'',
      date: fd.get('date'), startTime: fd.get('startTime'), endTime: fd.get('endTime')||null,
      organizationId: r.organizationId, scheduledBy: currentUser.id, status:'scheduled', comment:'', markedAt:null, markedBy:null, createdAt: now,
    };
    DB.interviews.push(iv);
    const reqItem = DB.interviewRequests.find((x)=>x.id===r.id);
    if(reqItem) Object.assign(reqItem, { status:'confirmed', decidedBy: currentUser.id, decidedAt: now, resultingInterviewId: iv.id });
    closeModal();
    toast('Entrevista confirmada');
    renderInterviewsView();
  });
}

// editable=false, de solo lectura: muestra el estado (pill), el comentario
// si se dejó uno, y CADA nombre (si se citó a más de una persona a la vez)
// se puede apretar por separado para ver el historial completo de esa
// persona en particular (igual que en Discursos) — el historial de "veces
// entrevistado" nunca se mezcla entre las personas de un mismo grupo.
function interviewHistoryCardHtml(iv){
  const members = Array.isArray(iv.members) && iv.members.length ? iv.members : [{ memberName: iv.memberName, memberUserId: iv.memberUserId }];
  const namesHtml = members.map((m, idx)=>{
    const sep = idx===0 ? '' : (idx===members.length-1 ? ' y ' : ', ');
    return `${sep}<span class="clickable-name iv-history-name" data-member-name="${esc(m.memberName)}" data-member-user-id="${m.memberUserId||''}" title="Ver historial completo de entrevistas">${esc(m.memberName)}</span>`;
  }).join('');
  return `
    <div class="list-card" data-id="${iv.id}">
      <span class="org-dot" style="background:${iv.organizationColor}"></span>
      <div class="lc-main">
        <div class="lc-title">
          ${namesHtml}
          ${interviewStatusPillHtml(iv.status)}
        </div>
        <div class="lc-sub">${esc(iv.organizationName)}${iv.interviewerName?` · 🧑‍💼 ${esc(iv.interviewerName)}`:''}${iv.description?' · '+esc(iv.description):''}</div>
        ${iv.comment?`<div class="lc-sub" style="margin-top:2px; font-style:italic;">💬 ${esc(iv.comment)}</div>`:''}
        <div class="lc-sub" style="margin-top:2px;">${interviewStatsLine(iv)}</div>
      </div>
      <div class="lc-when">${esc(fmtDateHuman(iv.date))}</div>
      ${canScheduleOrg(iv.organizationId) ? `<div class="lc-actions"><button type="button" class="btn btn-ghost btn-sm iv-history-delete" data-id="${iv.id}" title="Eliminar del historial">${icon('trash')}</button></div>` : ''}
    </div>`;
}
function wireInterviewHistoryCards(history){
  // openInterviewMemberDetailModal espera una lista PLANA (una fila por
  // persona por entrevista, como toda la vida) — se aplana acá el historial
  // agrupado (un grupo puede tener varias personas).
  const flatHistory = history.flatMap((iv)=>{
    const members = Array.isArray(iv.members) && iv.members.length ? iv.members : [{ memberName: iv.memberName, memberUserId: iv.memberUserId }];
    return members.map((m)=>({ date: iv.date, status: iv.status, comment: iv.comment, memberName: m.memberName, memberUserId: m.memberUserId }));
  });
  document.querySelectorAll('.iv-history-name').forEach((el)=>{
    el.addEventListener('click', ()=>openInterviewMemberDetailModal(el.dataset.memberName, el.dataset.memberUserId, flatHistory));
  });
  document.querySelectorAll('.iv-history-delete').forEach((btn)=>{
    btn.addEventListener('click', async ()=>{
      if(!(await confirmModal('¿Eliminar definitivamente este registro del historial? Esta acción no se puede deshacer.', { title:'Eliminar del historial', confirmText:'Eliminar', danger:true }))) return;
      // :id acá es el groupId — elimina TODAS las personas del grupo a la
      // vez (es un solo registro histórico, aunque haya sido una reunión
      // con más de una persona).
      const groupId = Number(btn.dataset.id);
      DB.interviews = DB.interviews.filter((i)=>i.groupId!==groupId);
      toast('Registro eliminado del historial');
      renderInterviewsView();
    });
  });
}
// Detalle de una persona: todo su historial de entrevistas ya verificadas

    <div class="modal-header"><h3>👤 ${esc(memberName)}</h3><button class="modal-close" id="ivmd-modal-close">×</button></div>
    <div class="modal-body">
      <p class="hint-box" style="margin-top:0;">Se le ha entrevistado ${doneCount===1?'1 vez':doneCount+' veces'} en total.</p>
      <div class="card-list">
        ${mine.map((iv)=>`
          <div class="list-card">
            <div class="lc-main">
              <div class="lc-title">${esc(fmtDateHuman(iv.date))} ${interviewStatusPillHtml(iv.status)}</div>
              <div class="lc-sub" ${iv.comment?'':'style="font-style:italic;"'}>${iv.comment?esc(iv.comment):'Sin comentario'}</div>

    </div>
    <div class="modal-footer"><div></div><div><button class="btn btn-secondary" id="ivmd-close">Cerrar</button></div></div>
  </div></div>`;
  document.getElementById('ivmd-modal-close').addEventListener('click', closeModal);
  document.getElementById('ivmd-close').addEventListener('click', closeModal);
  document.getElementById('ivmd-modal-backdrop').addEventListener('click',(e)=>{ if(e.target.id==='ivmd-modal-backdrop') closeModal(); });
}
// Check de verificación ✅/❌ con comentario opcional — ej. "Se hizo todo muy
// bien, el hermano está buscando trabajo, pero está con ánimo" o "Se canceló
// porque el hermano está enfermo". Al guardar, la entrevista sale de la
// pestaña principal y pasa al historial.
function openInterviewMarkModal(iv, status){
  const isDone = status==='done';
  const modalRoot = document.getElementById('modal-root');
  modalRoot.innerHTML = `<div class="modal-backdrop" id="ivm-modal-backdrop"><div class="modal">
    <div class="modal-header"><h3>${isDone?'✅ ¿Se realizó la entrevista?':'❌ ¿No se realizó la entrevista?'}</h3><button class="modal-close" id="ivm-modal-close">×</button></div>
    <div class="modal-body">
      <p class="hint-box" style="margin-top:0;">${esc(iv.memberNames || iv.memberName)} · ${esc(fmtDateHuman(iv.date))}</p>
      <div class="field">
        <label>Comentario (opcional)</label>
        <textarea id="ivm-comment" placeholder="${isDone?'Ej: Se hizo todo muy bien, el hermano está buscando trabajo, pero está con ánimo.':'Ej: Se canceló porque el hermano está enfermo.'}">${esc(iv.comment||'')}</textarea>
      </div>
    </div>
    <div class="modal-footer">
      <div></div>
      <div style="display:flex; gap:8px;"><button class="btn btn-secondary" id="ivm-cancel">Cancelar</button><button class="btn btn-primary" id="ivm-save">Guardar</button></div>
    </div>
  </div></div>`;
  document.getElementById('ivm-modal-close').addEventListener('click', closeModal);
  document.getElementById('ivm-cancel').addEventListener('click', closeModal);
  document.getElementById('ivm-modal-backdrop').addEventListener('click',(e)=>{ if(e.target.id==='ivm-modal-backdrop') closeModal(); });
  document.getElementById('ivm-save').addEventListener('click', ()=>{
    const comment = document.getElementById('ivm-comment').value.trim();
    // :id acá es el groupId — se marca a TODAS las personas del grupo juntas
    // (una sola reunión), igual que PUT /api/interviews/:id/mark en el
    // servidor real.
    const targets = DB.interviews.filter((i)=>i.groupId===iv.id);
    for(const target of targets){
      target.status = status;
      target.comment = comment;
      target.markedAt = new Date().toISOString();
      target.markedBy = currentUser.id;
    }
    closeModal();
    toast(isDone ? 'Entrevista marcada como realizada' : 'Entrevista marcada como no realizada');
    renderInterviewsView();
  });
}

function normalizeSearchText(s){
  return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').trim();
}
function memberPickerFieldHtml(idPrefix, selectedUserId, selectedName){
  return `
    <div class="field">
      <label>Miembro</label>
      <div id="${idPrefix}-member-chip" style="display:${selectedUserId?'flex':'none'}; align-items:center; gap:8px; flex-wrap:wrap; padding:8px 10px; border:1px solid var(--border, #d8e3ea); border-radius:8px; background:#f4f8fb;">
        <span>🔗 Vinculado a <strong id="${idPrefix}-member-chip-name">${esc(selectedName||'')}</strong></span>
        <button type="button" class="btn btn-ghost btn-sm" id="${idPrefix}-member-unlink">Quitar / escribir a mano</button>
      </div>
      <div id="${idPrefix}-member-search-wrap" style="display:${selectedUserId?'none':''}; position:relative;">
        <input type="text" name="memberName" id="${idPrefix}-member-name" required autocomplete="off" placeholder="Nombre y apellido (si está registrado, aparecerán coincidencias para elegir)" value="${esc(selectedName||'')}" ${selectedUserId?'readonly':''} />
        <div id="${idPrefix}-member-results" style="display:none; position:absolute; left:0; right:0; z-index:30; background:#fff; border:1px solid var(--border, #d8e3ea); border-radius:8px; margin-top:2px; max-height:220px; overflow-y:auto; box-shadow:0 6px 20px rgba(0,0,0,.12);"></div>
      </div>
      <input type="hidden" name="memberUserId" id="${idPrefix}-member-user-id" value="${esc(selectedUserId||'')}" />
    </div>`;
}
function wireMemberPicker(idPrefix, directory, onChange){
  const nameInput = document.getElementById(`${idPrefix}-member-name`);
  const resultsBox = document.getElementById(`${idPrefix}-member-results`);
  const hiddenId = document.getElementById(`${idPrefix}-member-user-id`);
  const chip = document.getElementById(`${idPrefix}-member-chip`);
  const chipName = document.getElementById(`${idPrefix}-member-chip-name`);
  const searchWrap = document.getElementById(`${idPrefix}-member-search-wrap`);
  const unlinkBtn = document.getElementById(`${idPrefix}-member-unlink`);

  const showChip = (name) => { chipName.textContent = name; chip.style.display = 'flex'; searchWrap.style.display = 'none'; };
  const showSearch = () => { chip.style.display = 'none'; searchWrap.style.display = ''; resultsBox.style.display = 'none'; resultsBox.innerHTML = ''; };
  const selectUser = (u) => {
    hiddenId.value = u.id;
    nameInput.value = u.name;
    nameInput.readOnly = true;
    showChip(u.name);
    resultsBox.style.display = 'none';
    resultsBox.innerHTML = '';
    if(onChange) onChange();
  };

  nameInput.addEventListener('input', () => {
    hiddenId.value = '';
    const q = normalizeSearchText(nameInput.value);
    if(!q){ resultsBox.style.display = 'none'; resultsBox.innerHTML = ''; return; }
    const matches = directory.filter((u) => normalizeSearchText(u.name).includes(q)).slice(0, 8);
    if(!matches.length){
      resultsBox.innerHTML = `<div style="padding:8px 10px; color:var(--ink-soft, #888); font-size:13px;">Sin coincidencias — se guardará el nombre tal como lo escribas</div>`;
      resultsBox.style.display = '';
      return;
    }
    resultsBox.innerHTML = matches.map((u) => `<div class="ac-item" data-id="${u.id}" style="padding:8px 10px; cursor:pointer; font-size:13.5px;">${esc(u.name)}</div>`).join('');
    resultsBox.style.display = '';
    resultsBox.querySelectorAll('.ac-item').forEach((el) => {
      el.addEventListener('mousedown', (e) => {
        e.preventDefault();
        const u = directory.find((d) => String(d.id) === el.dataset.id);
        if(u) selectUser(u);
      });
      el.addEventListener('mouseenter', () => { el.style.background = '#f0f4f8'; });
      el.addEventListener('mouseleave', () => { el.style.background = ''; });
    });
  });
  nameInput.addEventListener('focus', () => { if(!nameInput.readOnly && nameInput.value) nameInput.dispatchEvent(new Event('input')); });
  nameInput.addEventListener('blur', () => { setTimeout(() => { resultsBox.style.display = 'none'; }, 150); });
  unlinkBtn.addEventListener('click', () => {
    hiddenId.value = '';
    nameInput.readOnly = false;
    nameInput.value = '';
    showSearch();
    nameInput.focus();
    if(onChange) onChange();
  });
}

        </div>
