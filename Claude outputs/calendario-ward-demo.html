<style>
:root {
  --celeste: #0ea5e9; --celeste-dark: #0369a1; --celeste-darker: #075985;
  --celeste-light: #e0f2fe; --celeste-lighter: #f0f9ff; --white: #ffffff;
  --ink: #0f172a; --ink-soft: #475569; --border: #dbeafe;
  --danger: #ef4444; --danger-light: #fef2f2; --success: #16a34a;
  --shadow: 0 1px 3px rgba(14,165,233,.12),0 1px 2px rgba(14,165,233,.08);
  --shadow-lg: 0 10px 30px rgba(3,105,161,.18); --radius: 12px;
}
* { box-sizing: border-box; }
html, body { margin:0; padding:0; height:100%; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; background:var(--white); color:var(--ink); }
#app { min-height:100vh; display:flex; flex-direction:column; }
button { font-family:inherit; cursor:pointer; }
.demo-banner { background:var(--celeste-darker); color:white; text-align:center; font-size:12.5px; padding:7px 12px; }
.demo-banner b { font-weight:700; }
.login-wrap { min-height:calc(100vh - 32px); display:flex; align-items:center; justify-content:center; background:linear-gradient(160deg,var(--celeste-lighter) 0%,var(--white) 55%); padding:20px; }
.login-card { background:var(--white); border:1px solid var(--border); border-radius:20px; box-shadow:var(--shadow-lg); padding:36px 32px; width:100%; max-width:440px; }
.login-logo { width:64px; height:64px; object-fit:contain; display:block; margin:0 auto 14px; }
.login-card h1 { text-align:center; font-size:21px; margin:0 0 4px; color:var(--celeste-darker); }
.brand-wordmark { font-weight:800; letter-spacing:-0.2px; }
.brand-organiza { color:var(--ink); }
.brand-sion { color:var(--celeste); }
.login-card p.subtitle { text-align:center; color:var(--ink-soft); font-size:13.5px; margin:0 0 22px; }
.field { margin-bottom:14px; }
.advanced-toggle-btn { display:block; margin:-4px 0 14px; padding-left:0; }
.bulk-actions-bar { display:flex; align-items:center; gap:10px; background:var(--celeste-lighter); border:1px solid var(--celeste-light); border-radius:10px; padding:10px 14px; margin-bottom:12px; font-size:13px; font-weight:600; color:var(--celeste-darker); flex-wrap:wrap; }
.offline-banner { background:#b91c1c; color:#fff; text-align:center; font-size:12.5px; font-weight:600; padding:8px 12px; }
.field label { display:block; font-size:13px; font-weight:600; color:var(--celeste-darker); margin-bottom:6px; }
.field input, .field select, .field textarea { width:100%; padding:10px 12px; border:1.5px solid var(--border); border-radius:10px; font-size:14px; background:var(--white); color:var(--ink); }
.field input:focus, .field select:focus, .field textarea:focus { outline:none; border-color:var(--celeste); box-shadow:0 0 0 3px var(--celeste-light); }
.field textarea { resize:vertical; min-height:64px; }
.btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:10px 18px; border-radius:10px; border:none; font-size:14px; font-weight:600; }
.btn:active { transform:translateY(1px); }
.btn-primary { background:var(--celeste); color:white; }
.btn-primary:disabled { opacity:.6; cursor:not-allowed; }
.btn-block { width:100%; }
.btn-secondary { background:var(--celeste-lighter); color:var(--celeste-darker); border:1px solid var(--border); }
.btn-danger { background:var(--danger-light); color:var(--danger); border:1px solid #fecaca; }
.btn-ghost { background:transparent; color:var(--celeste-darker); }
.btn-sm { padding:6px 10px; font-size:12.5px; border-radius:8px; }
.error-msg { background:var(--danger-light); color:var(--danger); border:1px solid #fecaca; padding:9px 12px; border-radius:10px; font-size:13px; margin-bottom:14px; }
.quick-login { display:flex; flex-direction:column; gap:6px; margin-top:18px; }
.quick-login button { background:var(--celeste-lighter); border:1px solid var(--border); border-radius:10px; padding:8px 10px; font-size:12.5px; font-weight:600; color:var(--celeste-darker); text-align:left; }
.quick-login button:hover { background:var(--celeste-light); }
.quick-login-label { font-size:11px; color:var(--ink-soft); margin-top:20px; text-transform:uppercase; font-weight:700; letter-spacing:.4px; }
.topbar { display:flex; align-items:center; justify-content:space-between; padding:10px 20px; background:var(--white); border-bottom:1px solid var(--border); position:sticky; top:32px; z-index:20; }
.topbar-left { display:flex; align-items:center; gap:10px; }
.topbar-logo { width:34px; height:34px; object-fit:contain; display:block; }
.topbar-title { font-weight:700; font-size:15px; }
.topbar-title small { display:block; font-weight:400; font-size:11px; color:var(--ink-soft); }
.topbar-right { display:flex; align-items:center; gap:12px; }
.user-chip { display:flex; align-items:center; gap:8px; background:var(--celeste-lighter); border:1px solid var(--border); padding:5px 10px 5px 5px; border-radius:999px; font-size:13px; }
.user-avatar { width:26px; height:26px; border-radius:50%; background:var(--celeste); color:white; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; }
.role-badge { font-size:10px; font-weight:700; text-transform:uppercase; padding:2px 7px; border-radius:999px; letter-spacing:.3px; }
.role-admin { background:#ede9fe; color:#6d28d9; }
.role-leader { background:var(--celeste-light); color:var(--celeste-darker); }
.role-member { background:#f1f5f9; color:#475569; }
.role-executive_secretary, .role-ward_clerk, .role-financial_clerk { background:#fef3c7; color:#92400e; }
.tabs { display:flex; gap:4px; padding:8px 20px 0; background:var(--white); border-bottom:1px solid var(--border); overflow-x:auto; }
.tab-btn { background:none; border:none; padding:9px 16px; font-size:13.5px; font-weight:600; color:var(--ink-soft); border-bottom:2.5px solid transparent; white-space:nowrap; }
.tab-btn.active { color:var(--celeste-darker); border-bottom-color:var(--celeste); }
main.view { padding:20px; max-width:1180px; margin:0 auto; width:100%; }
.cal-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; flex-wrap:wrap; gap:10px; }
.cal-nav { display:flex; align-items:center; gap:8px; }
.cal-month-label { font-size:18px; font-weight:700; color:var(--celeste-darker); min-width:190px; text-align:center; text-transform:capitalize; }
.icon-btn { width:32px; height:32px; border-radius:8px; border:1px solid var(--border); background:var(--white); display:flex; align-items:center; justify-content:center; font-size:15px; color:var(--celeste-dark); }
.cal-select { height:32px; padding:0 8px; border-radius:8px; border:1px solid var(--border); background:var(--white); font-size:13.5px; font-weight:700; color:var(--celeste-darker); }
.cal-select:focus { outline:none; border-color:var(--celeste); box-shadow:0 0 0 3px var(--celeste-light); }
.cal-goto { display:flex; align-items:center; gap:8px; }
.cal-goto-label { font-size:12.5px; font-weight:600; color:var(--ink-soft); white-space:nowrap; }
.cal-goto input[type="date"] { height:32px; padding:0 8px; border-radius:8px; border:1px solid var(--border); background:var(--white); font-size:13px; color:var(--ink); }
.cal-goto input[type="date"]:focus { outline:none; border-color:var(--celeste); box-shadow:0 0 0 3px var(--celeste-light); }
.lc-location { display:inline-flex; align-items:center; gap:3px; }
.ro-detail-row { display:flex; align-items:center; gap:8px; font-size:13.5px; color:var(--ink); padding:9px 0; border-bottom:1px solid var(--border); }
.ro-detail-row:last-child { border-bottom:none; }
.ro-detail-row.ro-desc { align-items:flex-start; white-space:pre-wrap; color:var(--ink-soft); }
.org-filters { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:16px; }
.org-chip { display:inline-flex; align-items:center; gap:6px; border:1.5px solid var(--border); padding:5px 11px 5px 8px; border-radius:999px; font-size:12.5px; font-weight:600; background:var(--white); color:var(--ink-soft); }
.org-chip.active { border-color:currentColor; }
.org-dot { width:9px; height:9px; border-radius:50%; flex-shrink:0; }
.cal-grid-wrap { overflow-x:auto; -webkit-overflow-scrolling:touch; border-radius:var(--radius); }
.cal-grid { display:grid; grid-template-columns:repeat(7,1fr); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; min-width:700px; }
.cal-dow { background:var(--celeste-lighter); color:var(--celeste-darker); font-size:11.5px; font-weight:700; text-transform:uppercase; text-align:center; padding:8px 4px; border-bottom:1px solid var(--border); }
.cal-cell { min-height:108px; min-width:0; border-right:1px solid var(--border); border-bottom:1px solid var(--border); padding:6px; background:var(--white); display:flex; flex-direction:column; gap:3px; position:relative; }
.cal-cell:nth-child(7n) { border-right:none; }
.cal-cell.other-month { background:#fafcff; }
.cal-cell.other-month .cal-daynum { color:#cbd5e1; }
.cal-cell.today { background:var(--celeste-lighter); }
.cal-daynum { font-size:12px; font-weight:700; color:var(--ink-soft); }
.cal-cell.today .cal-daynum { background:var(--celeste); color:white; width:20px; height:20px; border-radius:50%; display:flex; align-items:center; justify-content:center; }
.cal-event { font-size:10.5px; padding:2px 6px; border-radius:6px; color:white; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; text-align:left; border:none; width:100%; }
.cal-event.is-interview { border:1.5px dashed rgba(255,255,255,.85); }
.cal-event.is-stake { box-shadow: inset 0 0 0 1.5px rgba(255,255,255,0.9), 0 1px 4px rgba(124,58,237,0.5); font-weight: 700; }
.cal-event.is-stake.is-stake-info { box-shadow: none; border: 1.5px dashed rgba(255,255,255,0.75); font-weight: 600; opacity: 0.9; }
.stake-status-bar { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px; background:#f5f0fe; border:1px solid #ddd0fb; border-radius:10px; padding:8px 12px; font-size:12.5px; color:#5b21b6; margin-bottom:14px; }
.cal-more { font-size:10px; color:var(--celeste-dark); font-weight:700; text-align:left; background:none; border:none; padding:1px 4px; }
.cal-event-draggable { cursor:grab; }
.cal-event-draggable.dragging { opacity:0.35; cursor:grabbing; }
.cal-cell.drag-over { outline:2px dashed var(--celeste); outline-offset:-2px; background:var(--celeste-lighter); }
.section-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; flex-wrap:wrap; gap:10px; }
.section-header h2 { margin:0; font-size:19px; color:var(--celeste-darker); }
.section-header p { margin:3px 0 0; font-size:13px; color:var(--ink-soft); }
.card-list { display:flex; flex-direction:column; gap:8px; }
.list-card { border:1px solid var(--border); border-radius:var(--radius); padding:12px 14px; display:flex; align-items:center; gap:12px; background:var(--white); }
.list-card .org-dot { width:11px; height:11px; }
.list-card .lc-main { flex:1; min-width:0; }
.list-card .lc-title { font-weight:700; font-size:14px; color:var(--ink); }
.list-card .lc-sub { font-size:12.5px; color:var(--ink-soft); margin-top:2px; }
.list-card .lc-when { font-size:12.5px; font-weight:700; color:var(--celeste-dark); white-space:nowrap; text-align:right; }
.list-card .lc-actions { display:flex; gap:6px; }
/* Panel de Obispado: "Compromisos atrasados" y "Turnos de aseo sin
   confirmar" pueden crecer mucho a medida que se suman organizaciones — en
   vez de estirar la página hacia abajo, esas dos cajas se scrollean de
   lado, mostrando una tarjeta completa a la vez (nunca cortada a la mitad)
   con sus acciones (✅/❌) a mano. La barra de scroll nativa se esconde —
   en su lugar, .bp-scroll-dots (debajo de la caja) indica cuántas tarjetas
   hay y cuál se está viendo, estilo carrusel. */
.card-list.bp-scroll-row { flex-direction:row; overflow-x:auto; -webkit-overflow-scrolling:touch; scroll-snap-type:x mandatory; min-width:0; scrollbar-width:none; -ms-overflow-style:none; }
.card-list.bp-scroll-row::-webkit-scrollbar { display:none; }
.card-list.bp-scroll-row > .list-card { flex:0 0 100%; width:100%; scroll-snap-align:start; scroll-snap-stop:always; }
.bp-grid > div { min-width:0; }
.bp-scroll-dots { display:flex; gap:6px; margin-top:8px; padding-left:2px; }
.bp-scroll-dot { width:7px; height:7px; border-radius:50%; border:none; padding:0; background:var(--border); cursor:pointer; flex:0 0 auto; transition:background-color .15s ease; }
.bp-scroll-dot.active { background:var(--celeste-dark); }
.empty-state { text-align:center; color:var(--ink-soft); font-size:13.5px; padding:40px 10px; border:1.5px dashed var(--border); border-radius:var(--radius); }
.budget-card { border:1px solid var(--border); border-radius:var(--radius); padding:14px 16px; background:var(--white); margin-bottom:12px; }
.budget-card-head { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; }
.budget-card-name { display:flex; align-items:center; gap:8px; }
.budget-figures { display:flex; gap:18px; font-size:13.5px; }
.budget-figures .bf-label { color:var(--ink-soft); font-size:11.5px; display:block; }
.budget-alloc-row { display:flex; gap:8px; align-items:center; margin-top:10px; }
.budget-alloc-row input[type="number"] { max-width:160px; }
.budget-actions-row { display:flex; justify-content:space-between; align-items:center; margin-top:10px; flex-wrap:wrap; gap:8px; }
.budget-expenses-list { margin-top:10px; border-top:1px solid var(--border); padding-top:10px; }
.budget-expense-row { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:6px 0; font-size:13px; border-bottom:1px dashed var(--border); }
.budget-expense-row:last-child { border-bottom:none; }
.table-scroll { overflow-x:auto; -webkit-overflow-scrolling:touch; border-radius:var(--radius); }
table.data-table { width:100%; min-width:480px; border-collapse:collapse; font-size:13.5px; }
table.data-table th { text-align:left; padding:9px 10px; background:var(--celeste-lighter); color:var(--celeste-darker); font-size:11.5px; text-transform:uppercase; border-bottom:1px solid var(--border); }
table.data-table td { padding:9px 10px; border-bottom:1px solid var(--border); }
table.data-table tr:last-child td { border-bottom:none; }
.subtabs { display:flex; gap:6px; margin-bottom:16px; flex-wrap:wrap; }
.subtab-btn { background:var(--white); border:1.5px solid var(--border); padding:6px 14px; border-radius:999px; font-size:12.5px; font-weight:600; color:var(--ink-soft); }
.subtab-btn.active { background:var(--celeste); border-color:var(--celeste); color:white; }
.modal-backdrop { position:fixed; inset:0; background:rgba(3,105,161,.25); display:flex; align-items:center; justify-content:center; padding:16px; z-index:100; }
.modal { background:white; border-radius:18px; max-width:460px; width:100%; box-shadow:var(--shadow-lg); max-height:90vh; overflow-y:auto; }
.modal-header { display:flex; align-items:center; justify-content:space-between; padding:18px 20px 4px; }
.modal-header h3 { margin:0; font-size:16px; color:var(--celeste-darker); }
.modal-close { background:none; border:none; font-size:20px; color:var(--ink-soft); line-height:1; }
.modal-body { padding:14px 20px 20px; }
.modal-footer { display:flex; justify-content:space-between; gap:8px; padding:0 20px 20px; }
.color-swatches { display:flex; gap:8px; flex-wrap:wrap; }
.color-swatch { width:26px; height:26px; border-radius:50%; border:2px solid transparent; cursor:pointer; }
.color-swatch.selected { border-color:var(--ink); }
.two-col { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
@media (max-width:520px) { .two-col { grid-template-columns:1fr; } }
/* ---------- Modal de confirmación (reemplaza confirm() nativo) ---------- */
.confirm-modal-backdrop { z-index:150; }
.confirm-modal { max-width:400px; }
.confirm-modal-message { margin:0; font-size:14px; color:var(--ink); line-height:1.55; white-space:pre-line; }
.toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--ink); color:white; padding:10px 18px; border-radius:10px; font-size:13px; z-index:200; box-shadow:var(--shadow-lg); }
.toast.error { background:var(--danger); }
.toast.success { background:var(--success); }
@media (max-width:640px) {
  .cal-cell { min-height:78px; } .cal-month-label { min-width:0; font-size:15px; } main.view { padding:12px; } .topbar-title small { display:none; } .bp-grid { grid-template-columns:1fr !important; }
  .topbar { padding:8px 12px; gap:6px; flex-wrap:wrap; }
  .topbar-right { gap:6px; flex:1 1 100%; justify-content:flex-end; }
  .topbar-icon-btn { width:30px; height:30px; font-size:13.5px; }
  .user-chip { padding:4px 8px 4px 4px; gap:6px; }
  .user-chip > div:not(.user-avatar) > div:first-child { display:none; }
  .user-chip .role-badge { font-size:9px; }
  #logout-btn { padding:6px 10px; font-size:12.5px; }
  .topbar-dropdown-panel { padding:10px 12px; }
  .search-panel-row input[type="text"] { font-size:16px; }
}

/* ---------- Íconos de la barra superior (búsqueda / notificaciones / tour) ---------- */
.topbar-icon-btn { position:relative; width:34px; height:34px; border-radius:999px; border:1px solid var(--border); background:var(--white); display:flex; align-items:center; justify-content:center; font-size:15px; flex-shrink:0; }
.topbar-icon-btn:hover, .topbar-icon-btn.active { background:var(--celeste-lighter); border-color:var(--celeste); }
.notif-badge { position:absolute; top:-4px; right:-4px; min-width:16px; height:16px; padding:0 3px; border-radius:999px; background:#dc2626; color:white; font-size:9.5px; font-weight:700; line-height:16px; text-align:center; border:2px solid var(--white); }
.topbar-dropdown-panel { background:var(--white); border-bottom:1px solid var(--border); padding:12px 20px; }
.search-panel-row { display:flex; align-items:center; gap:8px; max-width:640px; margin:0 auto; }
.search-panel-row input[type="text"] { flex:1; height:38px; padding:0 12px; border-radius:8px; border:1px solid var(--border); font-size:14px; background:var(--white); }
.search-panel-row input[type="text"]:focus { outline:none; border-color:var(--celeste); box-shadow:0 0 0 3px var(--celeste-light); }
.search-hint { font-size:12.5px; color:var(--ink-soft); text-align:center; padding:14px 0; }
#search-results, #notif-results { max-width:640px; margin:10px auto 0; display:flex; flex-direction:column; gap:4px; max-height:55vh; overflow-y:auto; }
#notif-results:empty, #search-results:empty { margin:0; }
.search-result-row { display:flex; align-items:center; gap:10px; width:100%; text-align:left; border:1px solid var(--border); background:var(--white); border-radius:10px; padding:9px 11px; }
.search-result-row:hover { background:var(--celeste-lighter); border-color:var(--celeste); }
.search-result-icon { width:30px; height:30px; border-radius:8px; flex-shrink:0; background:var(--celeste-lighter); color:var(--celeste-darker); display:flex; align-items:center; justify-content:center; font-size:14px; }
.search-result-main { min-width:0; flex:1; }
.search-result-title { font-size:13.5px; font-weight:600; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.search-result-sub { font-size:12px; color:var(--ink-soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

/* ---------- Vista Agenda + mini calendario emergente ---------- */
.view-toggle { display:flex; border:1px solid var(--border); border-radius:8px; overflow:hidden; }
.view-toggle-btn { border:none; background:var(--white); color:var(--ink-soft); padding:0 10px; height:32px; font-size:12.5px; font-weight:600; }
.view-toggle-btn + .view-toggle-btn { border-left:1px solid var(--border); }
.view-toggle-btn.active { background:var(--celeste-lighter); color:var(--celeste-darker); }
.agenda-list { display:flex; flex-direction:column; gap:16px; }
.agenda-day-header { font-size:12.5px; font-weight:700; color:var(--celeste-darker); margin-bottom:6px; padding-bottom:4px; border-bottom:1px solid var(--border); }
.agenda-day-header::first-letter { text-transform:uppercase; }
.agenda-day-header.is-today { color:var(--celeste); }
.mini-cal-panel { background:var(--white); border-bottom:1px solid var(--border); padding:10px 20px 14px; max-width:min(320px,100%); box-sizing:border-box; }
.mini-cal-nav { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
.mini-cal-label { font-size:13px; font-weight:700; color:var(--celeste-darker); text-align:center; flex:1; }
.mini-cal-dow-row { display:grid; grid-template-columns:repeat(7,1fr); text-align:center; font-size:10.5px; font-weight:700; color:var(--ink-soft); margin-bottom:4px; }
.mini-cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:2px; }
.mini-cal-cell { position:relative; height:30px; border:none; background:none; border-radius:8px; font-size:12px; color:var(--ink); cursor:pointer; }
.mini-cal-cell:hover { background:var(--celeste-lighter); }
.mini-cal-cell.other-month { color:var(--border); }
.mini-cal-cell.today { background:var(--celeste); color:white; font-weight:700; }
.mini-cal-dot { position:absolute; bottom:3px; left:50%; transform:translateX(-50%); width:4px; height:4px; border-radius:50%; background:var(--celeste-dark); }
.mini-cal-cell.today .mini-cal-dot { background:white; }

/* ---------- Confirmación de asistencia (RSVP) ---------- */
.rsvp-box { margin-top:14px; padding:12px; border-radius:var(--radius); background:var(--celeste-lighter); border:1px solid var(--border); }
.rsvp-summary { font-size:12.5px; font-weight:600; color:var(--ink-soft); margin-bottom:8px; }
.rsvp-buttons { display:flex; gap:8px; flex-wrap:wrap; }
.rsvp-buttons .btn { flex:1 1 auto; min-width:90px; }

/* ---------- Exportar reportes (CSV / imprimir-a-PDF) ---------- */
.print-area { position:absolute; left:-9999px; top:-9999px; width:800px; }
.print-report { padding:24px; max-width:800px; margin:0 auto; font-family:inherit; color:var(--ink); }
.print-report h2 { margin:0 0 4px; color:var(--celeste-darker); }
.print-report .print-report-meta { font-size:12.5px; color:var(--ink-soft); margin-bottom:18px; }
.print-report table { width:100%; border-collapse:collapse; margin-bottom:20px; font-size:13px; }
.print-report th, .print-report td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--border); }
.print-report th { color:var(--celeste-darker); font-size:11.5px; text-transform:uppercase; }

/* ---------- Estado (píldoras): Reuniones/Asignaciones, Aseo ---------- */
.status-pill { display:inline-flex; align-items:center; white-space:nowrap; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.3px; padding:3px 9px; border-radius:999px; }
.status-amber { background:#fef3c7; color:#92400e; }
.status-red { background:var(--danger-light); color:var(--danger); }
.status-green { background:#dcfce7; color:#15803d; }
.status-gray { background:#f1f5f9; color:#64748b; }
.status-blue { background:#dbeafe; color:#1d4ed8; }
.commitment-row { border:1px solid var(--border); border-radius:10px; padding:10px; margin-bottom:8px; }
.commitment-detail-row { padding:10px 0; border-bottom:1px solid var(--border); }
.commitment-detail-row:last-child { border-bottom:none; }
.hint-box { background:var(--celeste-lighter); border:1px solid var(--border); border-radius:10px; padding:10px 12px; font-size:12px; color:var(--ink-soft); margin-top:18px; line-height:1.5; }
.council-alert-box { display:flex; align-items:flex-start; gap:10px; background:#fef3c7; border:1px solid #fde68a; border-radius:12px; padding:12px 14px; font-size:13px; color:#92400e; margin-bottom:14px; line-height:1.5; }
.council-alert-box.ok { background:#dcfce7; border-color:#bbf7d0; color:#166534; }
.council-alert-icon { font-size:18px; line-height:1; flex-shrink:0; }
.council-alert-body { flex:1; min-width:0; }
.council-alert-title { font-weight:700; margin-bottom:2px; }
.council-alert-box .btn { margin-top:8px; }
.council-alert-freq-form { display:flex; align-items:center; gap:8px; margin-top:8px; flex-wrap:wrap; }
.council-alert-freq-form input { width:70px; padding:6px 8px; border:1.5px solid var(--border); border-radius:8px; font-size:13px; }

/* ---------- Aseo del Edificio ---------- */
.ac-item:hover { background:#f0f4f8; }
.family-row { border:1px solid var(--border); border-radius:10px; padding:10px; margin-bottom:8px; }
.cleaning-date-card { flex-direction:column; align-items:stretch; }
.cleaning-family-rows { margin-top:8px; }
.cleaning-family-row { display:flex; align-items:center; gap:10px; padding:8px 0; border-top:1px solid var(--border); }
.cleaning-family-row:first-child { border-top:none; }
.cfr-main { flex:1; min-width:0; }
.cfr-name { font-weight:600; font-size:13.5px; }
.cfr-sub { font-size:12px; color:var(--ink-soft); margin-top:2px; }
.cfr-actions { display:flex; gap:4px; flex-shrink:0; }
/* Nombre clicable (ej. discursante, ganador de un logro) que abre un detalle */
.clickable-name { cursor:pointer; text-decoration:underline dotted; text-underline-offset:2px; }
.clickable-name:hover { color:var(--celeste-dark); }
.whatsapp-link { color:inherit; text-decoration:none; }
.whatsapp-link:hover { text-decoration:underline; color:#15803d; }
.icon-svg { vertical-align:-3px; flex-shrink:0; }
.topbar-icon-btn .icon-svg { vertical-align:-1px; }

/* ---------- Estadísticas ---------- */
.stats-cards { display:flex; gap:12px; flex-wrap:wrap; }
.stat-card { flex:1; min-width:160px; border:1px solid var(--border); border-radius:var(--radius); padding:14px 16px; background:var(--white); }
.stat-card-label { font-size:11.5px; color:var(--ink-soft); text-transform:uppercase; font-weight:700; letter-spacing:0.3px; }
.stat-card-value { font-size:24px; font-weight:800; color:var(--celeste-darker); margin-top:4px; }
.purpose-balance { display:flex; flex-direction:column; gap:8px; margin-top:10px; }
.purpose-row { display:flex; align-items:center; gap:10px; }
.purpose-label { font-size:12.5px; font-weight:600; color:var(--ink-soft); width:84px; flex-shrink:0; }
.purpose-bar-wrap { flex:1; height:10px; background:var(--celeste-lighter); border-radius:999px; overflow:hidden; }
.purpose-bar { height:100%; background:var(--celeste); border-radius:999px; min-width:2px; }
.purpose-count { font-size:12.5px; font-weight:700; color:var(--celeste-dark); width:20px; text-align:right; }
.sparkline-wrap { margin-top:8px; }
.sparkline-plot { position:relative; width:100%; }
.sparkline-svg { position:absolute; inset:0; width:100%; height:100%; display:block; }
.sparkline-path { stroke:var(--celeste); stroke-width:2; }
.sparkline-baseline { stroke:var(--border); stroke-width:1; stroke-dasharray:3 3; }
.sparkline-dot { position:absolute; width:8px; height:8px; margin-left:-4px; margin-top:-4px; border-radius:50%; background:var(--celeste-darker); }
.sparkline-labels { display:flex; justify-content:space-between; font-size:10px; color:var(--ink-soft); margin-top:2px; padding:0 4px; }
.ranking-row { display:flex; gap:12px; flex-wrap:wrap; margin-top:18px; }
.ranking-card { flex:1; min-width:220px; border-radius:var(--radius); padding:14px 16px; }
.ranking-top { background:#f0fdf4; border:1px solid #bbf7d0; }
.ranking-bottom { background:var(--danger-light); border:1px solid #fecaca; }
.ranking-label { font-size:12px; font-weight:700; color:var(--ink-soft); margin-bottom:4px; }
.ranking-title { font-size:14px; font-weight:700; color:var(--ink); }
.ranking-sub { font-size:12.5px; color:var(--ink-soft); margin-top:2px; }
/* "Rachas y Logros" — cuadrícula de rankings del Panel de Estadísticas */
.ranking-grid { display:grid; grid-template-columns:1fr 1fr; gap:22px; }
.ranking-section .card-list { display:flex; flex-direction:column; gap:8px; }

/* Diploma imprimible/descargable (botón "🎓 Ver / descargar diploma") */
.diploma { padding:10px; }
.diploma-border { border:3px double var(--celeste-dark); border-radius:10px; padding:40px 30px; text-align:center; background:#fffdf7; }
.diploma-logo { width:44px; height:44px; object-fit:contain; display:block; margin:0 auto 10px; }
.diploma-eyebrow { font-size:12px; letter-spacing:1.5px; text-transform:uppercase; color:var(--ink-soft); font-weight:700; }
.diploma-title { font-size:28px; font-weight:800; color:var(--celeste-darker); margin:10px 0 6px; font-family:Georgia,'Times New Roman',serif; }
.diploma-sub { font-size:13px; color:var(--ink-soft); margin-bottom:22px; }
.diploma-body-text { font-size:14px; color:var(--ink); max-width:480px; margin:0 auto 24px; line-height:1.5; font-style:italic; }
.diploma-winner { font-size:24px; font-weight:800; color:var(--ink); border-bottom:2px solid var(--celeste); display:inline-block; padding:0 20px 6px; margin-bottom:10px; }
.diploma-value { font-size:15px; font-weight:700; color:var(--celeste-dark); margin-bottom:26px; }
.diploma-footer { font-size:12px; color:var(--ink-soft); }
@media print {
  body * { visibility:hidden; }
  #diploma-print-area, #diploma-print-area *,
  .print-area, .print-area * { visibility:visible; }
  #diploma-print-area, .print-area { position:absolute; top:0; left:0; width:100%; }
  .modal-backdrop { position:static !important; background:none !important; }
}

@media (max-width:640px) { .ranking-grid { grid-template-columns:1fr; } }
</style>
</head>

function setCalling(name, calling){

}
// Punto 8 — a lo más un isPresident:true por organización (incluida
// Obispado, donde representa "el Obispo" específicamente, distinto de un
// consejero) — mismo criterio que unmarkOtherPresidents() en el servidor.
function setPresident(userId){
  const u = DB.users.find((x)=>x.id===userId);
  if (!u || u.role!=='leader' || !u.organizationId) return;
  DB.users.forEach((x)=>{ if (Number(x.organizationId)===Number(u.organizationId)) x.isPresident=false; });
  u.isPresident = true;
}
// Igual que slugify() en server/src/seed.js: primero descompone los
// acentos (NFD) y los quita, y solo AHÍ reemplaza lo que no sea a-z por un
// punto — si no, "Cuórum de Élderes" generaría "cu.rum.de.lderes" en vez de
// "cuorum.de.elderes" (la letra acentuada quedaría completamente borrada en
// vez de solo perder el acento).
function slugify(name){
  return name.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z]+/g,'.');
}

function addMeeting(title, dayOffset, organizationName, status, commitments, opts){
  opts = opts || {};
  const orgId = organizationName ? orgIdByName[organizationName] : null;
  const creator = DB.users.find((u)=>Number(u.organizationId)===Number(orgId)) || DB.users.find((u)=>u.role==='admin');
  const m = {
    id: nextId('meetings'), title, date: todayISO(dayOffset), organizationId: orgId,
    status: status || 'active', createdBy: creator ? creator.id : null,
    createdAt: new Date().toISOString(), archivedAt: null,
    // Punto 8: tipo de acta ('general' salvo que se indique otro).
    type: opts.type || 'general',
    // Punto 9: acta confidencial completa (no solo compromisos puntuales).
    confidential: !!opts.confidential,
    // Punto 7: agenda previa — temas a tratar, armados antes de la reunión.
    // Punto 16: en Consejo de Barrio, cada tema sigue además el patrón de
    // consejo del Manual General (necesidad → análisis → acuerdo →
    // seguimiento) en vez de una nota libre. Punto 64: Coordinación de
    // Ministración usa su propio patrón de 3 campos (quién necesita ayuda →
    // qué se hará → quién lo hará).
    agendaItems: (opts.agendaItems||[]).map((a) => ({ id: nextId('agendaItems'), topic: a.topic, presenter: a.presenter||'', notes: a.notes||'', necesidad: a.necesidad||'', analisis: a.analisis||'', acuerdo: a.acuerdo||'', seguimiento: a.seguimiento||'', quienNecesita: a.quienNecesita||'', queSeHara: a.queSeHara||'', quienLoHara: a.quienLoHara||'' })),
    commitments: (commitments||[]).map((c) => ({
      id: nextId('commitments'), description: c.description, dueDate: todayISO(c.dueOffset),
      assignedToUserId: DB.users.find((u)=>u.name===c.assignedToName)?.id || null,
      status: c.status || 'pending', completedAt: c.status==='completed' ? new Date().toISOString() : null,
      completionComment: c.comment || '',
      // Punto 9: compromiso confidencial individual (aunque el acta no lo sea).
      confidential: !!c.confidential,
    })),
  };
  DB.meetings.push(m);
  return m;
}

// ===================== SESIÓN =====================
let currentUser = null;

function orgById(id){ return DB.organizations.find((o) => o.id === Number(id)); }
function withOrgInfo(item){
  const o = orgById(item.organizationId);
  const involvedIds = Array.isArray(item.involvedOrganizationIds) ? item.involvedOrganizationIds : [];
  const involvedOrganizations = involvedIds.map((id)=>orgById(id)).filter(Boolean).map((io)=>({ id:io.id, name:io.name, color:io.color }));
  // Confirmación de asistencia (RSVP): solo aplica a actividades reales, pero
  // se calcula igual para todos los ítems (el resto simplemente ignora estos
  // campos) — mismo criterio que el servidor real (withOrgInfo en events.js).
  const rsvps = Array.isArray(item.rsvps) ? item.rsvps : [];
  const rsvpYes = rsvps.filter((r)=>r.response==='yes').length;
  const rsvpNo = rsvps.filter((r)=>r.response==='no').length;
  const myRsvp = currentUser ? (rsvps.find((r)=>Number(r.userId)===Number(currentUser.id))?.response || null) : null;
  // Check de verificación de Entrevistas (¿se logró hacer o no?): solo los
  // ítems con memberName son entrevistas (los eventos no tienen ese campo),
  // así que este bloque no afecta en nada a withOrgInfo(evento). Igual
  // criterio que memberInterviewStats en el servidor real: solo cuentan las
  // ya verificadas como "Se hizo".
  const isInterview = item.memberName !== undefined;
  const interviewExtra = isInterview
    ? { status: item.status || 'scheduled', comment: item.comment || '', ...memberInterviewStats(item) }
    : {};
  return { ...item, organizationName:o?.name||'', organizationColor:o?.color||'#999', involvedOrganizations, rsvpYes, rsvpNo, myRsvp, ...interviewExtra };
}
// Igual criterio que speakerKey (Discursos) y familyId (Aseo): dos
// entrevistas son "de la misma persona" si comparten memberUserId, o si no
// lo tienen, si el nombre coincide (sin importar mayúsculas ni tildes).
function interviewMemberKey(iv){ return iv.memberUserId ? `u:${iv.memberUserId}` : `n:${normalizeSearchText(iv.memberName)}`; }
// Solo cuentan las entrevistas ya verificadas como "Se hizo" — igual
// espíritu que familyStats (Aseo) y speakerStats (Discursos).
function memberInterviewStats(iv){
  const key = interviewMemberKey(iv);
  const done = DB.interviews.filter((i)=>interviewMemberKey(i)===key && i.status==='done');
  const timesInterviewed = done.length;
  const lastInterviewDate = done.length ? done.map((i)=>i.date).sort().slice(-1)[0] : null;
  return { timesInterviewed, lastInterviewDate };
}
// "Juan Pérez", "Juan y María Pérez", "Juan, María y Pedro Pérez" — mismo
// criterio de unión de nombres que el servidor real (joinNames en
// interviews.js): en español, con "y" antes del último en vez de una coma.
function joinNames(names){
  const list = names.filter(Boolean);
  if(list.length<=1) return list[0]||'';
  if(list.length===2) return `${list[0]} y ${list[1]}`;
  return `${list.slice(0,-1).join(', ')} y ${list[list.length-1]}`;
}
// Punto de ampliación "más de una persona a la vez" (matrimonios,
// compañerismos de ministración) — mismo criterio que groupInterviews en el
// servidor real (interviews.js): cada persona citada sigue viviendo en su
// propia fila de DB.interviews (para que "veces entrevistado", su propia
// "Mis Actividades" y sus recordatorios sigan siendo por persona), pero
// todas las filas de la misma reunión comparten un `groupId` y se presentan
// juntas como UNA sola tarjeta ("Juan y María Pérez"), que se edita/marca/
// elimina como una unidad. Una entrevista de una sola persona es, para este
// código, simplemente "un grupo de 1" — no hay ningún caso especial. El `id`
// del grupo queda deliberadamente igual a `groupId`, para que cualquier
// código que espere un solo "id" por entrevista (editar/marcar/eliminar)
// automáticamente apunte al grupo completo.
function groupInterviews(rows){
  const byGroup = new Map();
  for(const iv of rows){
    const gid = iv.groupId ?? iv.id;
    if(!byGroup.has(gid)) byGroup.set(gid, []);
    byGroup.get(gid).push(iv);
  }
  const groups = [];
  for(const [groupId, groupRowsRaw] of byGroup){
    const groupRows = [...groupRowsRaw].sort((a,b)=>a.id-b.id);
    const first = groupRows[0];
    const org = orgById(first.organizationId);
    const members = groupRows.map((iv)=>({
      id: iv.id,
      memberName: iv.memberName,
      memberUserId: iv.memberUserId,
      memberPhone: iv.memberPhone,
      memberEmail: iv.memberEmail,
      ...memberInterviewStats(iv),
    }));
    groups.push({
      id: groupId,
      groupId,
      ids: groupRows.map((iv)=>iv.id),
      members,
      memberNames: joinNames(members.map((m)=>m.memberName)),
      // compatibilidad: quien todavía espera un solo memberName/memberUserId
      // sigue encontrando el de la primera persona del grupo.
      memberName: first.memberName,
      memberUserId: first.memberUserId,
      memberPhone: first.memberPhone,
      memberEmail: first.memberEmail,
      timesInterviewed: members[0]?.timesInterviewed,
      lastInterviewDate: members[0]?.lastInterviewDate,
      description: first.description,
      location: first.location,
      sala: first.sala,
      interviewerName: first.interviewerName,
      interviewerEmail: first.interviewerEmail,
      interviewerPhone: first.interviewerPhone,
      date: first.date,
      startTime: first.startTime,
      endTime: first.endTime,
      organizationId: first.organizationId,
      organizationName: org?.name || '',
      organizationColor: org?.color || '#999999',
      status: first.status || 'scheduled',
      comment: first.comment || '',
      markedAt: first.markedAt,
      markedBy: first.markedBy,
    });
  }
  return groups;
}
// Cuando se entrevista a más de una persona a la vez (matrimonio,
// compañerismo de ministración), CADA persona del grupo debe corresponder
// individualmente a la organización — a propósito no basta con que una sola
// califique: por ejemplo, el presidente de Cuórum de Élderes no puede
// entrevistar junto a un matrimonio, porque la esposa por sí sola no
// corresponde a esa organización (solo el Obispado puede entrevistar a
// cualquier persona sin restricción, así que un matrimonio o un
// compañerismo mixto siempre puede agendarse con el Obispado). Mismo
// criterio que checkGroupEligibility en el servidor real.
function checkGroupEligibility(org, members){
  for(const m of members){
    if(!m.memberUserId) continue;
    const member = DB.users.find((u)=>u.id===Number(m.memberUserId));
    if(org && member && interviewEligibility(org.name, member)===false){
      return `Esta entrevista es de ${org.name} y ${member.name} no corresponde según su perfil (sexo/edad) — según el Manual General, agenda con el Obispado en su lugar.`;
    }
  }
  return null;
}

// Limpia la lista de "otras organizaciones involucradas": solo IDs de
// organizaciones que existen de verdad, sin duplicados, y sin incluir a la
// organización principal (no puede estar "involucrada" consigo misma).
function normalizeInvolvedOrgIds(raw, primaryOrgId){
  if(!raw) return [];
  const arr = Array.isArray(raw) ? raw : [raw];
  const validIds = new Set(DB.organizations.map((o)=>o.id));
  const primary = Number(primaryOrgId);
  const ids = arr.map(Number).filter((id)=>Number.isFinite(id) && id!==primary && validIds.has(id));
  return [...new Set(ids)];
}

function addMonths(d,n){ return new Date(d.getFullYear(), d.getMonth()+n, 1); }
function isSameDay(a,b){ return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }
function fmtTime(t){ return t ? t.slice(0,5) : ''; }
const WEEKDAY_NAMES = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
function fmtDateHuman(iso){ const [y,m,d]=iso.split('-').map(Number); const dt=new Date(y,m-1,d); const dow=WEEKDAY_NAMES[dt.getDay()]; return `${dow} ${d} de ${MONTH_LABELS[m-1]}`; }
function isoDate(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
// Igual que timesOverlap() en el servidor (db.js): si falta la hora de
// término se asume una duración típica de 30 minutos, solo para comparar si
// dos horarios se superponen.
function timeToMinutes(t){ const [h,m]=String(t).split(':').map(Number); return h*60+m; }
function effectiveEndMinutes(startTime, endTime){ return endTime ? timeToMinutes(endTime) : timeToMinutes(startTime)+30; }
function timesOverlap(aStart, aEnd, bStart, bEnd){
  return timeToMinutes(aStart) < effectiveEndMinutes(bStart, bEnd) && timeToMinutes(bStart) < effectiveEndMinutes(aStart, aEnd);
}
// Punto 4 (ampliación): próximas fechas concretas que calzan con la agenda
// semanal declarada por un líder, dentro de las próximas 6 semanas — `busy`
// (entrevistas ya agendadas con ese líder) descarta las fechas cuyo horario
// ya está ocupado. Ver la misma función en app.js.
function computeUpcomingAvailableDates(windows, busy){
  if(!Array.isArray(windows) || !windows.length) return [];
  const busyList = Array.isArray(busy) ? busy : [];
  const out = [];
  const today = new Date();
  today.setHours(0,0,0,0);
  for(let i=1; i<=42; i++){
    const d = new Date(today);
    d.setDate(d.getDate()+i);
    const weekday = d.getDay();
    const dateStr = isoDate(d);
    for(const w of windows){
      if(Number(w.weekday)!==weekday) continue;
      const occupied = busyList.some((b)=>b.date===dateStr && timesOverlap(w.startTime, w.endTime, b.startTime, b.endTime));
      if(!occupied) out.push({ date: dateStr, weekday, startTime: w.startTime, endTime: w.endTime });
    }
  }
  return out;
}
function availabilityWindowsSummary(windows){
  if(!Array.isArray(windows) || !windows.length) return '';
  const byRange = {};
  for(const w of windows){ const key=`${w.startTime}-${w.endTime}`; (byRange[key] ||= []).push(w.weekday); }
  return Object.entries(byRange).map(([range, days])=>{
    const [start, end] = range.split('-');
    const dayNames = [...new Set(days)].sort((a,b)=>a-b).map((d)=>WEEKDAY_NAMES[d]);
    return `${dayNames.join(', ')} de ${start} a ${end}`;
  }).join(' · ');
}

}

// ---------------- Mi Perfil (fecha de nacimiento, sexo, foto) ----------------
// Igual que la app real: sirve para saber con quién se puede agendar
// entrevista (ver interviewEligibility) y para mostrar la foto en vez de
// las iniciales. Aquí no hay servidor — se lee/escribe directo sobre
// currentUser / DB.users, en vez de llamar a api().
function compressImageFile(file, maxSize = 320){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('No se pudo leer la imagen'));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('Archivo de imagen inválido'));
      img.onload = () => {
        const side = Math.min(img.width, img.height);
        const sx = (img.width - side) / 2;
        const sy = (img.height - side) / 2;
        const outSize = Math.min(maxSize, side);
        const canvas = document.createElement('canvas');
        canvas.width = outSize; canvas.height = outSize;
        const ctx = canvas.getContext('2d');

    };
    reader.readAsDataURL(file);
  });
}

// ---------------- Choques de horario/lugar con otras organizaciones ----------------
function toMinutes(t){ const [h,m] = String(t).split(':').map(Number); return h*60+m; }
function timesOverlap(aStart, aEnd, bStart, bEnd){
  if(!aStart || !bStart) return false;
  const as = toMinutes(aStart), bs = toMinutes(bStart);
  const aeRaw = aEnd ? toMinutes(aEnd) : as;
  const beRaw = bEnd ? toMinutes(bEnd) : bs;
  const ae = aeRaw > as ? aeRaw : as+1;
  const be = beRaw > bs ? beRaw : bs+1;
  return as < be && bs < ae;
}
function normalizeLocation(loc){ return String(loc||'').trim().toLowerCase(); }
// Dos lugares "chocan" si son el mismo lugar Y (falta la sala en alguno de
// los dos, o es la misma sala). Si ambos indicaron sala y son distintas,
// son espacios separados del mismo edificio — no es un choque real.
function placesConflict(aLoc, aSala, bLoc, bSala){
  if(!aLoc || !bLoc) return false;
  if(normalizeLocation(aLoc)!==normalizeLocation(bLoc)) return false;
  if(aSala && bSala && normalizeLocation(aSala)!==normalizeLocation(bSala)) return false;
  return true;
}
// Une la organización principal con las "involucradas" de un ítem, para
// poder comparar si dos actividades comparten alguna organización.
function orgSetForConflictCheck(item){
  const ids = [Number(item.organizationId)];
  if(Array.isArray(item.involvedOrganizationIds)) ids.push(...item.involvedOrganizationIds.map(Number));
  if(Array.isArray(item.involvedOrganizations)) ids.push(...item.involvedOrganizations.map((o)=>Number(o.id)));
  return ids;
}
// "¿Está ocupada esta sala a esta hora?" — igual que en el servidor real
// (ver GET /api/interviews/room-occupancy): a propósito NO reutiliza
// visibleInterviews() (que respeta la privacidad de cada organización)
// porque cualquier líder debe poder saber que una sala está ocupada por una
// entrevista de otra organización sin ver el listado completo de esa
// organización — por eso esta función solo expone lugar/sala/horario/
// organización, nunca a quién entrevistan ni quién entrevista.
function interviewRoomOccupancy(date){
  // Una entrevista grupal (matrimonio, compañerismo de ministración) solo
  // ocupa la sala una vez, no una vez por persona citada — mismo criterio
  // que el servidor real (GET /api/interviews/room-occupancy).
  const seenGroups = new Set();
  const result = [];
  for(const i of DB.interviews.filter((i)=>i.location && i.date===date)){
    const gid = i.groupId ?? i.id;
    if(seenGroups.has(gid)) continue;
    seenGroups.add(gid);
    const org = orgById(i.organizationId);
    result.push({ id:gid, organizationId:i.organizationId, organizationName: org?org.name:'', organizationColor: org?org.color:'#999999', date:i.date, startTime:i.startTime, endTime:i.endTime, location:i.location, sala:i.sala||'' });
  }
  return result;
}
// Revisa si lo que se está por agendar (actividad o entrevista) choca con
// una ACTIVIDAD de OTRA organización el mismo día (mismo horario, o
// exactamente el mismo lugar aunque el horario sea distinto), y por
// separado si choca con una SALA ya ocupada por una ENTREVISTA de otra
// organización (ver interviewRoomOccupancy). El choque contra entrevistas
// es más estricto: requiere que se solapen el horario Y la sala — para no
// avisar por cada entrevista del día que no tiene nada que ver con la sala
// que se está por usar. Dos actividades (o una actividad y una entrevista)
// que comparten alguna organización (principal o involucrada) nunca se
// consideran un choque entre sí. excludeEventId/excludeInterviewId sirven
// para que, al editar algo ya existente, no choque consigo mismo.
function findConflictingActivities(candidate, excludeEventId, excludeInterviewId){
  if(!candidate.date || !candidate.startTime || !candidate.organizationId) return [];
  const dayEvents = visibleEvents().filter((e)=>e.date===candidate.date).map(withOrgInfo);
  const dayInterviewRooms = interviewRoomOccupancy(candidate.date);
  const candidateOrgs = orgSetForConflictCheck(candidate);
  const eventConflicts = dayEvents.filter((ev) => {
    if(excludeEventId && ev.id===Number(excludeEventId)) return false;
    const evOrgs = orgSetForConflictCheck(ev);
    if(candidateOrgs.some((id)=>evOrgs.includes(id))) return false;
    const timeConflict = timesOverlap(candidate.startTime, candidate.endTime, ev.startTime, ev.endTime);
    const placeConflict = placesConflict(candidate.location, candidate.sala, ev.location, ev.sala);
    return timeConflict || placeConflict;
  });
  const interviewConflicts = dayInterviewRooms.filter((iv) => {
    if(excludeInterviewId && iv.id===Number(excludeInterviewId)) return false;
    const ivOrgs = orgSetForConflictCheck(iv);
    if(candidateOrgs.some((id)=>ivOrgs.includes(id))) return false;
    const timeConflict = timesOverlap(candidate.startTime, candidate.endTime, iv.startTime, iv.endTime);
    const placeConflict = placesConflict(candidate.location, candidate.sala, iv.location, iv.sala);
    return timeConflict && placeConflict;
  }).map((iv)=>({...iv, kind:'interview'}));
  return [...eventConflicts, ...interviewConflicts];
}
function conflictWarningHtml(conflicts){
  return `<div class="hint-box" style="border-color:#f59e0b; background:#fffbeb;">
    ⚠️ <strong>Posible choque con otra organización</strong> — vuelve a presionar el botón para agendar de todas formas:
    <ul style="margin:6px 0 0; padding-left:18px;">
      ${conflicts.map((c)=>`<li><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${c.organizationColor};margin-right:4px;"></span><strong>${esc(c.organizationName)}</strong> — ${c.kind==='interview' ? '🔒 ocupada por una entrevista (privada)' : esc(c.title||c.memberName||'')} · ${esc(fmtTime(c.startTime))}${c.endTime?' - '+esc(fmtTime(c.endTime)):''}${c.location?' · 📍 '+esc(locationDisplay(c)):''}</li>`).join('')}

// ---------------- Choques con actividades de Estaca (prioridad) ----------------
// No TODAS las actividades de Estaca bloquean: las puramente informativas
// (entrevistas, reuniones internas de Estaca, presentación anual de la
// Primaria, etc.) son solo para mostrar — no involucran a los barrios, así
// que no compiten por horario con nada. Cuáles cuentan como informativas se
// decide comparando el título contra DB.stakeCalendar.nonBlockingKeywords
// (configurable en Administración → Estaca). Todo lo demás (conferencias,
// festivales, capacitaciones, días de servicio...) SÍ bloquea — salvo que lo
// autorice el líder de Obispado.
function normalizeText(s){
  return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').trim();
}
function isBlockingStakeEvent(ev){
  const list = (DB.stakeCalendar.nonBlockingKeywords && DB.stakeCalendar.nonBlockingKeywords.length) ? DB.stakeCalendar.nonBlockingKeywords : [];
  const title = normalizeText(ev.title);
  if(!title) return true;
  return !list.some((kw)=>{ const k = normalizeText(kw); return k && title.includes(k); });
}
// Actividades de Estaca a mostrar en el calendario: si el Administrador
// desactivó "mostrar informativas", solo quedan las que sí bloquean (las
// que influyen a la membresía del Barrio). No afecta el bloqueo en sí.
function visibleStakeEvents(){
  if(DB.stakeCalendar.showNonBlockingEvents === false) return DB.stakeEvents.filter(isBlockingStakeEvent);
  return DB.stakeEvents;
}
function findStakeConflicts(candidate){
  if(!candidate.date) return [];
  return DB.stakeEvents.filter((s)=>{
    if(s.date !== candidate.date) return false;
    if(!isBlockingStakeEvent(s)) return false;
    if(s.allDay || !s.startTime) return true;
    return timesOverlap(candidate.startTime, candidate.endTime, s.startTime, s.endTime);
  });
}
function stakeConflictError(conflicts, date){
  const list = conflicts.map((c)=>`"${c.title}"${c.startTime?` (${c.startTime}${c.endTime?'–'+c.endTime:''})`:' (todo el día)'}`).join(', ');
  return `Choca con ${conflicts.length>1?'actividades de Estaca':'una actividad de Estaca'} (tienen prioridad) — ${list}. Requiere autorización del líder de Obispado antes de agendarse. (fecha: ${date})`;
}
function stakeConflictWarningHtml(conflicts, canOverride){
  const list = `<ul style="margin:6px 0 0; padding-left:18px;">
      ${conflicts.map((c)=>`<li><strong>${esc(c.title)}</strong> · ${c.allDay?'Todo el día':esc(fmtTime(c.startTime))+(c.endTime?' - '+esc(fmtTime(c.endTime)):'')}</li>`).join('')}
    </ul>`;
  if(canOverride){
    return `<div class="hint-box" style="border-color:#f59e0b; background:#fffbeb;">
      🏛️ <strong>Choca con ${conflicts.length>1?'actividades de Estaca':'una actividad de Estaca'}</strong> (tienen prioridad) — como líder de Obispado puedes autorizarlo igual: vuelve a presionar el botón para agendarlo de todas formas.
      ${list}

  }

    🏛️ <strong>No se puede agendar sin autorización — choca con ${conflicts.length>1?'actividades de Estaca':'una actividad de Estaca'}</strong> (tienen prioridad sobre las de organizaciones y del Barrio):
    ${list}
    Elige otro horario o fecha, o pide autorización al líder de Obispado.
  </div>`;
}
function fmtRelativeTime(iso){
  if(!iso) return '';
  const diffMin = Math.round((Date.now() - new Date(iso).getTime())/60000);
  if(diffMin < 1) return 'recién';
  if(diffMin < 60) return `hace ${diffMin} min`;
  const diffH = Math.round(diffMin/60);
  if(diffH < 24) return `hace ${diffH} h`;
  const diffD = Math.round(diffH/24);
  return `hace ${diffD} día${diffD===1?'':'s'}`;
}

function wireRecurrenceField(idPrefix){
  const select = document.getElementById(`${idPrefix}-recurrence-select`);
  const weeklyField = document.getElementById(`${idPrefix}-recurrence-weekly-field`);
  const customField = document.getElementById(`${idPrefix}-recurrence-custom-field`);
  const hint = document.getElementById(`${idPrefix}-recurrence-hint`);
  const datesContainer = document.getElementById(`${idPrefix}-recurrence-dates`);
  const addBtn = document.getElementById(`${idPrefix}-recurrence-add-date`);
  const applyState = () => {
    weeklyField.style.display = select.value==='weekly' ? '' : 'none';
    customField.style.display = select.value==='custom' ? '' : 'none';
    hint.style.display = select.value==='none' ? 'none' : '';
  };
  applyState();
  select.addEventListener('change', applyState);
  addBtn.addEventListener('click', () => {
    const row = document.createElement('div');
    row.style.cssText = 'display:flex; gap:6px; align-items:center; margin-bottom:6px;';
    row.innerHTML = `<input type="date" class="${idPrefix}-extra-date" /> <button type="button" class="btn btn-ghost btn-sm">✕</button>`;
    row.querySelector('button').addEventListener('click', () => row.remove());
    datesContainer.appendChild(row);
  });
}
function computeRecurrenceDates(idPrefix, firstDate){
  const mode = document.getElementById(`${idPrefix}-recurrence-select`).value;
  if(mode==='weekly'){
    const until = document.getElementById(`${idPrefix}-recurrence-until`).value;
    if(!firstDate || !until) return [firstDate].filter(Boolean);
    const dates = [];
    const cur = new Date(`${firstDate}T00:00:00`);
    const end = new Date(`${until}T00:00:00`);
    while(cur <= end){ dates.push(toISODate(cur)); cur.setDate(cur.getDate()+7); }
    return dates.length ? dates : [firstDate];
  }
  if(mode==='custom'){
    const extra = Array.from(document.querySelectorAll(`.${idPrefix}-extra-date`)).map((el)=>el.value).filter(Boolean);
    return [firstDate, ...extra].filter(Boolean);
  }
  return [firstDate].filter(Boolean);
}

function tryLogin(email, password){
  const normalized = String(email).toLowerCase().trim();
  const u = DB.users.find((x) => x.email === normalized && x.password === password);
  if(!u){
    const box = document.getElementById('login-error');
    if(!box) return;
    const pending = DB.registrationRequests.some((r) => r.email === normalized);
    box.innerHTML = pending
      ? '<div class="error-msg">Tu solicitud de cuenta está pendiente de aprobación del administrador todavía.</div>'
      : '<div class="error-msg">Credenciales inválidas</div>';
    return;
  }
  currentUser = u;
  render();
  maybeShowAssignmentsAlert();
  maybeShowMandatoryProfileModal(() => maybeStartOnboardingTour());
}

function markTourSeen(){ localStorage.setItem('organizasion_tour_seen', '1'); }
function maybeStartOnboardingTour(){
  if(localStorage.getItem('organizasion_tour_seen')) return;
  setTimeout(()=>startOnboardingTour(), 400);
}
function startOnboardingTour(){
  const steps = tourStepsForUser();
  let idx = 0;
  const modalRoot = document.getElementById('modal-root');
  if(!modalRoot) return;
  const renderStep = () => {
    const s = steps[idx];
    modalRoot.innerHTML = `
      <div class="modal-backdrop" id="tour-backdrop">
        <div class="modal" style="max-width:420px; text-align:center;">
          <div class="modal-body" style="padding-top:26px;">
            <div style="font-size:40px; margin-bottom:10px;">${s.icon}</div>
            <h3 style="margin:0 0 8px;">${esc(s.title)}</h3>
            <p style="font-size:13.5px; color:var(--ink-soft); margin:0 0 18px;">${esc(s.text)}</p>
            <div style="font-size:12px; color:var(--ink-soft); margin-bottom:14px;">${idx+1} / ${steps.length}</div>
            <div style="display:flex; gap:8px;">
              ${idx>0 ? `<button class="btn btn-secondary btn-block" id="tour-prev">Atrás</button>` : ''}
              <button class="btn btn-primary btn-block" id="tour-next">${idx===steps.length-1?'Entendido':'Siguiente'}</button>
            </div>
            <button class="btn btn-ghost btn-sm" id="tour-skip" style="margin-top:10px;">Saltar recorrido</button>
          </div>
        </div>
      </div>`;
    document.getElementById('tour-next').addEventListener('click', () => {
      if(idx===steps.length-1){ closeModal(); markTourSeen(); }
      else { idx++; renderStep(); }
    });
    const prevBtn = document.getElementById('tour-prev');
    if(prevBtn) prevBtn.addEventListener('click', () => { idx--; renderStep(); });
    document.getElementById('tour-skip').addEventListener('click', () => { closeModal(); markTourSeen(); });
    document.getElementById('tour-backdrop').addEventListener('click', (e) => { if(e.target.id==='tour-backdrop'){ closeModal(); markTourSeen(); } });
  };
  renderStep();
}

// ---------------- Búsqueda global (barra superior) ----------------
// Una sola caja de texto que busca a la vez en actividades/reuniones,
// entrevistas, actas/compromisos y discursos — cada categoría respeta la
// misma regla de visibilidad que su propia pestaña. El panel se abre EN EL
// FLUJO NORMAL de la página (no flotando encima) para que nunca tape ni se
// corte con otro recuadro, sobre todo en el celular.
let searchDebounceTimer = null;
const SEARCH_MAX_PER_CATEGORY = 8;

function toggleSearchPanel(forceOpen){
  state.searchOpen = forceOpen!==undefined ? forceOpen : !state.searchOpen;
  if(state.searchOpen) state.notifOpen = false;
  const searchPanel = document.getElementById('search-panel');
  const notifPanel = document.getElementById('notif-panel');
  if(!searchPanel) return;
  searchPanel.hidden = !state.searchOpen;
  if(notifPanel) notifPanel.hidden = true;
  if(state.searchOpen){
    const input = document.getElementById('search-input');
    if(input) input.focus();
  }
}

function searchAll(query){
  const raw = String(query||'').trim();
  if(raw.length < 2) return [];
  const q = normalizeSearchText(raw);
  const results = [];

  let eventMatches = visibleEvents().map(withOrgInfo).filter((e)=>normalizeSearchText(e.title).includes(q) || normalizeSearchText(e.description).includes(q));
  eventMatches = eventMatches.sort((a,b)=>b.date.localeCompare(a.date)).slice(0, SEARCH_MAX_PER_CATEGORY);
  for(const e of eventMatches){
    results.push({ category:'events', categoryLabel: e.isMeeting?'Reuniones':'Actividades', icon: e.isMeeting?'🔒':'📅', id:e.id, title:e.title, subtitle:`${e.organizationName||''} · ${e.date}`, date:e.date });
  }

  let ivMatches = visibleInterviews().map(withOrgInfo).filter((iv)=>normalizeSearchText(iv.memberName).includes(q) || normalizeSearchText(iv.description).includes(q));
  ivMatches = ivMatches.sort((a,b)=>b.date.localeCompare(a.date)).slice(0, SEARCH_MAX_PER_CATEGORY);
  for(const iv of ivMatches){
    results.push({ category:'interviews', categoryLabel:'Entrevistas', icon:'👤', id:iv.id, title:iv.memberName, subtitle:`${iv.organizationName||''} · ${iv.date}`, date:iv.date });
  }

  if(currentUser.role==='admin' || currentUser.role==='leader' || currentUser.role==='ward_clerk'){
    const meetingPool = isObispadoLeader(currentUser) ? DB.meetings : DB.meetings.filter((m)=>Number(m.organizationId)===Number(currentUser.organizationId));
    let meetingMatches = meetingPool.map(withMeetingInfo).filter((m)=>normalizeSearchText(m.title).includes(q));
    meetingMatches = meetingMatches.sort((a,b)=>b.date.localeCompare(a.date)).slice(0, SEARCH_MAX_PER_CATEGORY);
    for(const m of meetingMatches){
      results.push({ category:'meetings', categoryLabel:'Actas', icon:'📋', id:m.id, title:m.title, subtitle:`${m.organizationName||'Administración'} · ${m.date}`, date:m.date });
    }
    const commitmentMatches = [];
    for(const m of meetingPool){
      for(const c of (m.commitments||[])){
        if(normalizeSearchText(c.description).includes(q)) commitmentMatches.push({ meeting:m, commitment:c });
      }
    }
    commitmentMatches.sort((a,b)=>b.commitment.dueDate.localeCompare(a.commitment.dueDate));
    for(const { meeting:m, commitment:c } of commitmentMatches.slice(0, SEARCH_MAX_PER_CATEGORY)){
      const assignee = DB.users.find((u)=>u.id===Number(c.assignedToUserId));
      results.push({ category:'meetings', categoryLabel:'Compromisos', icon:'🎯', id:m.id, title:c.description, subtitle:`${assignee?assignee.name:''} · acta "${m.title}" · vence ${c.dueDate}`, date:c.dueDate });
    }
  }

  if(isObispadoLeader(currentUser)){
    let talkMatches = DB.talks.filter((t)=>normalizeSearchText(t.speakerName).includes(q) || normalizeSearchText(t.topic).includes(q));
    talkMatches = talkMatches.sort((a,b)=>b.date.localeCompare(a.date)).slice(0, SEARCH_MAX_PER_CATEGORY);
    for(const t of talkMatches){
      results.push({ category:'talks', categoryLabel:'Discursos', icon:'🎤', id:t.id, title:t.speakerName, subtitle:`${t.topic||'Sin tema'} · ${t.date}`, date:t.date });
    }
  }

  return results;
}

function renderSearchResults(results, query){
  const el = document.getElementById('search-results');
  if(!el) return;
  if(!query || query.trim().length < 2){
    el.innerHTML = '<div class="search-hint">Escribe al menos 2 letras para buscar</div>';
    return;
  }
  if(!results.length){
    el.innerHTML = '<div class="search-hint">Sin resultados para "' + esc(query) + '"</div>';
    return;
  }
  el.innerHTML = results.map((r)=>`
    <button type="button" class="search-result-row" data-category="${r.category}" data-id="${r.id}" data-date="${esc(r.date||'')}">
      <span class="search-result-icon">${r.icon}</span>
      <span class="search-result-main">
        <span class="search-result-title">${esc(r.title)}</span>
        <span class="search-result-sub">${r.categoryLabel} · ${esc(r.subtitle)}</span>
      </span>
    </button>`).join('');
  el.querySelectorAll('.search-result-row').forEach((row)=>{
    row.addEventListener('click', ()=>goToSearchResult(row.dataset.category, Number(row.dataset.id), row.dataset.date));
  });
}

function runSearch(query){
  renderSearchResults(searchAll(query), query);
}

function goToSearchResult(category, id, date){
  toggleSearchPanel(false);
  if(category==='events'){
    state.view = 'calendar';
    state.calMonth = new Date(Number(date.slice(0,4)), Number(date.slice(5,7))-1, 1);
    render();
    openDayModal(date);
    return;
  }
  if(category==='interviews'){
    state.view = 'interviews';
    render();
    return;
  }
  if(category==='meetings'){
    state.view = 'meetings';
    state.meetingsSubtab = 'manage';
    render();
    const raw = DB.meetings.find((m)=>m.id===id);
    if(raw) openMeetingDetailModal(withMeetingInfo(raw));
    return;
  }
  if(category==='talks'){
    state.view = 'cleaning';
    state.assignmentsSubtab = 'talks';
    render();
    return;
  }
  render();
}

// ---------------- Campana de notificaciones ----------------
// Reutiliza EXACTAMENTE los mismos cálculos que ya usan sus propias
// pestañas (dashboardOverview, pendingEvaluationsFor, myAssignments), para
// que el número de la campana siempre calce con lo que se ve al entrar a
// esa pestaña.
function notificationsSummary(user){
  const items = [];
  const mine = myAssignments(user);
  if(mine.length > 0){
    items.push({ key:'myCommitments', icon:'🔔', count:mine.length, label:`Compromiso${mine.length===1?'':'s'} pendiente${mine.length===1?'':'s'}`, view:'meetings', subtab:'mine' });
  }
  if(user.role==='admin' || user.role==='leader'){
    const orgId = user.role==='admin' ? null : Number(user.organizationId);
    const pending = pendingEvaluationsFor(orgId);
    if(pending.length > 0){
      items.push({ key:'pendingEvaluations', icon:'📝', count:pending.length, label:`Actividad${pending.length===1?'':'es'} por evaluar`, view:'stats', subtab:'pending' });
    }
    // Punto 4 — Solicitudes de entrevista por confirmar: la propia
    // organización, o todas si es líder de Obispado/Administrador (mismo
    // alcance que la bandeja de Entrevistas → Solicitudes).
    const pendingRequests = DB.interviewRequests.filter((r)=>r.status==='pending'
      && (isObispadoLeader(user) || Number(r.organizationId)===Number(user.organizationId)));
    if(pendingRequests.length > 0){
      items.push({ key:'pendingInterviewRequests', icon:'📥', count:pendingRequests.length, label:`Solicitud${pendingRequests.length===1?'':'es'} de entrevista por confirmar`, view:'interviews', subtab:'requests' });
    }
  }
  if(isObispadoLeader(user)){
    const overview = dashboardOverview();
    if(overview.overdueCommitments.length > 0){
      items.push({ key:'overdueCommitments', icon:'⏰', count:overview.overdueCommitments.length, label:`Compromiso${overview.overdueCommitments.length===1?'':'s'} atrasado${overview.overdueCommitments.length===1?'':'s'} en el Barrio`, view:'bishopricPanel' });
    }
    if(overview.cleaningPending.length > 0){
      items.push({ key:'cleaningPending', icon:'🧹', count:overview.cleaningPending.length, label:`Turno${overview.cleaningPending.length===1?'':'s'} de aseo sin confirmar`, view:'cleaning', subtab:'cleaning' });
    }
    if(overview.upcomingInterviews.length > 0){
      items.push({ key:'upcomingInterviews', icon:'👤', count:overview.upcomingInterviews.length, label:`Entrevista${overview.upcomingInterviews.length===1?'':'s'} esta semana`, view:'interviews' });
    }
  }
  const total = items.reduce((sum,it)=>sum+it.count, 0);
  return { total, items };
}

function closeModal(){ document.getElementById('modal-root').innerHTML=''; }

// Reemplaza al confirm() nativo del navegador por un modal propio con el
// mismo lenguaje visual del resto de la app. Vive en su propio contenedor
// #confirm-root (no en #modal-root) para poder abrirse ENCIMA de un modal
// que ya esté abierto sin destruirlo — al cancelar, el modal de fondo sigue
// intacto tal como estaba.
function confirmModal(message, opts={}){
  const { title='Confirmar', confirmText='Confirmar', cancelText='Cancelar', danger=false } = opts;
  return new Promise((resolve)=>{
    const root = document.getElementById('confirm-root');
    root.innerHTML = `
      <div class="modal-backdrop confirm-modal-backdrop" id="confirm-backdrop">
        <div class="modal confirm-modal">
          <div class="modal-header"><h3>${esc(title)}</h3></div>
          <div class="modal-body"><p class="confirm-modal-message">${esc(message)}</p></div>
          <div class="modal-footer" style="justify-content:flex-end;">
            <button type="button" class="btn btn-ghost" id="confirm-cancel">${esc(cancelText)}</button>
            <button type="button" class="btn ${danger?'btn-danger':'btn-primary'}" id="confirm-ok">${esc(confirmText)}</button>
          </div>
        </div>
      </div>`;
    const cleanup = (result)=>{ root.innerHTML=''; resolve(result); };
    document.getElementById('confirm-cancel').addEventListener('click', ()=>cleanup(false));
    document.getElementById('confirm-ok').addEventListener('click', ()=>cleanup(true));
    document.getElementById('confirm-backdrop').addEventListener('click', (e)=>{ if(e.target.id==='confirm-backdrop') cleanup(false); });
    document.getElementById('confirm-ok').focus();
  });
}

// Advierte antes de cerrar un modal si su formulario tiene cambios sin
// guardar (mismo comportamiento que la app real — ver wireUnsavedChangesGuard
// en app.js). Se llama con el <form> del modal justo después de armarlo;
// devuelve una función que reemplaza a closeModal en los 3 cierres de
// siempre (botón X, fondo, botón Cancelar).
function wireUnsavedChangesGuard(formEl){
  if(!formEl) return closeModal;
  let dirty = false;
  formEl.addEventListener('input', ()=>{ dirty = true; });
  formEl.addEventListener('change', ()=>{ dirty = true; });
  return async ()=>{
    if(dirty){
      const ok = await confirmModal('Tienes cambios sin guardar en este formulario. ¿Cerrar de todas formas?', { title:'Cambios sin guardar', confirmText:'Cerrar sin guardar', danger:true });
      if(!ok) return;
    }
    closeModal();
  };
}

// ===================== CALENDARIO =====================
function gridStartDate(monthDate){ const first=new Date(monthDate); const dow=(first.getDay()+6)%7; const start=new Date(first); start.setDate(first.getDate()-dow); return start; }
function orgFilterActive(orgId){ return state.activeOrgIds===null || state.activeOrgIds.has(Number(orgId)); }
function toggleOrgFilter(orgId){
  orgId = Number(orgId);
  if(state.activeOrgIds===null) state.activeOrgIds = new Set(DB.organizations.map((o)=>o.id));
  if(state.activeOrgIds.has(orgId)) state.activeOrgIds.delete(orgId); else state.activeOrgIds.add(orgId);
  if(state.activeOrgIds.size===DB.organizations.length) state.activeOrgIds=null;
  renderCalendarView();
}
function renderCalendarView(){
  const container = document.getElementById('view-root');
  const gridStart = gridStartDate(state.calMonth);
  const today = new Date();
  const yearNow = today.getFullYear();
  const yearOptions = [];
  for (let y = yearNow - 1; y <= yearNow + 4; y++) yearOptions.push(y);
  const chips = DB.organizations.map((o) => `<button class="org-chip ${orgFilterActive(o.id)?'active':''}" style="color:${orgFilterActive(o.id)?o.color:'#94a3b8'}" data-org="${o.id}"><span class="org-dot" style="background:${o.color}"></span>${esc(o.name)}</button>`).join('');
  let cellsHtml = '';
  const agendaDays = []; // solo para la vista "Agenda": días del mes actual con algo agendado
  for(let i=0;i<42;i++){
    const cellDate = new Date(gridStart); cellDate.setDate(gridStart.getDate()+i);
    const iso = toISODate(cellDate);
    const otherMonth = cellDate.getMonth() !== state.calMonth.getMonth();
    const isToday = isSameDay(cellDate, today);
    const dayEvents = visibleEvents().filter((e)=>e.date===iso && orgFilterActive(e.organizationId)).map(withOrgInfo);
    const dayInterviews = visibleInterviewGroups().filter((iv)=>iv.date===iso && orgFilterActive(iv.organizationId)).map((iv)=>({...iv, title: iv.memberNames || iv.memberName}));
    // Las actividades de Estaca no pertenecen a ninguna organización del
    // barrio, así que se muestran siempre — no las esconden los filtros
    // (salvo que el Administrador haya ocultado las informativas).
    const dayStake = visibleStakeEvents().filter((s)=>s.date===iso);
    const items = [...dayEvents.map((e)=>({...e,kind:'event'})), ...dayInterviews.map((e)=>({...e,kind:'interview'})), ...dayStake.map((s)=>({...s,kind:'stake'}))].sort((a,b)=>(a.startTime||'00:00').localeCompare(b.startTime||'00:00'));
    if(!otherMonth && items.length) agendaDays.push({ iso, isToday, items });
    const visible = items.slice(0,3); const extra = items.length - visible.length;
    cellsHtml += `<div class="cal-cell ${otherMonth?'other-month':''} ${isToday?'today':''}" data-date="${iso}">
      <div class="cal-daynum">${cellDate.getDate()}</div>
      ${visible.map((it)=>{
        const draggableEvent = it.kind==='event' && canEditOrg(it.organizationId);
        return `<button class="cal-event ${it.kind==='interview'?'is-interview':''} ${it.kind==='stake'?(isBlockingStakeEvent(it)?'is-stake':'is-stake is-stake-info'):''} ${draggableEvent?'cal-event-draggable':''}" style="background:${it.organizationColor}" data-kind="${it.kind}" data-id="${it.id}" ${draggableEvent?'draggable="true"':''} title="${draggableEvent?'Arrástrala a otro día para moverla':''}">${it.kind==='stake'?'🏛️ ':''}${esc(it.kind==='stake'&&it.allDay?'Todo el día':fmtTime(it.startTime))} ${it.kind==='interview'?'👤':''} ${esc(it.kind==='stake'?'':eventTitlePrefix(it))}${esc(truncateTitle(it.title))}</button>`;
      }).join('')}
      ${extra>0?`<button class="cal-more" data-more="${iso}">+${extra} más</button>`:''}
    </div>`;
  }
  const agendaHtml = agendaDays.length ? agendaDays.map((day)=>`
    <div class="agenda-day">
      <div class="agenda-day-header ${day.isToday?'is-today':''}">${esc(fmtDateHuman(day.iso))}</div>
      <div class="card-list">
        ${day.items.map((it)=>`<div class="list-card" data-kind="${it.kind}" data-id="${it.id}" style="cursor:pointer;">
          <span class="org-dot" style="background:${it.organizationColor}"></span>
          <div class="lc-main"><div class="lc-title">${it.kind==='interview'?'👤 ':it.kind==='stake'?'🏛️ ':eventTitlePrefix(it)}${esc(it.title)}</div><div class="lc-sub">${esc(it.organizationName||'')}${it.location?` · <span class="lc-location">📍 ${esc(locationDisplay(it))}</span>`:''}${it.kind==='interview' && it.interviewerName?` · 🧑‍💼 ${esc(it.interviewerName)}`:''}${it.kind==='event'?involvedOrgsBadgesHtml(it):''}</div></div>
          <div class="lc-when">${it.kind==='stake' && it.allDay ? 'Todo el día' : esc(fmtTime(it.startTime))}${it.endTime?' - '+esc(fmtTime(it.endTime)):''}</div>
        </div>`).join('')}
      </div>
    </div>`).join('') : emptyStateHtml('Sin actividades este mes' + (state.activeOrgIds ? ' con los filtros de organización activos' : ''));
  container.innerHTML = `
    <div class="cal-header">
      <div class="cal-nav">
        <button class="icon-btn" id="cal-prev">‹</button>
        <select class="cal-select" id="cal-month-select">
          ${MONTH_LABELS.map((m,i)=>`<option value="${i}" ${i===state.calMonth.getMonth()?'selected':''}>${m.charAt(0).toUpperCase()+m.slice(1)}</option>`).join('')}
        </select>
        <select class="cal-select" id="cal-year-select">
          ${yearOptions.map((y)=>`<option value="${y}" ${y===state.calMonth.getFullYear()?'selected':''}>${y}</option>`).join('')}
        </select>
        <button class="icon-btn" id="cal-next">›</button>
        <button class="btn btn-secondary btn-sm" id="cal-today">Hoy</button>
      </div>
      <div class="cal-goto">

      </div>

        <button type="button" class="view-toggle-btn ${state.calViewMode==='month'?'active':''}" id="cal-view-month" title="Vista de mes">🗓️ Mes</button>
        <button type="button" class="view-toggle-btn ${state.calViewMode==='agenda'?'active':''}" id="cal-view-agenda" title="Vista de lista">📋 Agenda</button>
      </div>
      ${canManageAnyEvents() ? `<button class="btn btn-primary" id="cal-new-event">+ Nueva actividad</button>` : ''}
    </div>
    <div id="mini-cal-panel" class="mini-cal-panel" hidden></div>
    ${stakeStatusBarHtml()}
    <div class="org-filters">${chips}</div>
    ${state.calViewMode==='agenda' ? `
    <div class="agenda-list">${agendaHtml}</div>
    ` : `
    <div class="cal-grid-wrap"><div class="cal-grid">${DOW_LABELS.map((d)=>`<div class="cal-dow">${d}</div>`).join('')}${cellsHtml}</div></div>
    `}`;
  wireStakeStatusBar();
  document.getElementById('cal-prev').addEventListener('click', ()=>{ state.calMonth = addMonths(state.calMonth,-1); renderCalendarView(); });
  document.getElementById('cal-next').addEventListener('click', ()=>{ state.calMonth = addMonths(state.calMonth,1); renderCalendarView(); });
  document.getElementById('cal-today').addEventListener('click', ()=>{ state.calMonth = startOfMonth(new Date()); renderCalendarView(); });
  document.getElementById('cal-month-select').addEventListener('change', (e)=>{ state.calMonth = new Date(state.calMonth.getFullYear(), Number(e.target.value), 1); renderCalendarView(); });
  document.getElementById('cal-year-select').addEventListener('change', (e)=>{ state.calMonth = new Date(Number(e.target.value), state.calMonth.getMonth(), 1); renderCalendarView(); });
  document.getElementById('cal-goto-input').addEventListener('change', (e)=>{
