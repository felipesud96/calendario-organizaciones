<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Pedir entrevista · OrganizaSion</title>
  <link rel="icon" type="image/png" href="/logo-bee.png" />
  <meta name="theme-color" content="#0ea5e9" />
  <!--
    Página pública (sin iniciar sesión) para pedir una entrevista con un
    líder a partir de su enlace personal o QR. Ver server/src/routes/publicBooking.js.
      /agendar/<token>         → elegir horario y enviar la solicitud
      /agendar/estado/<token>  → ver si la solicitud fue confirmada
    Es independiente de app.js a propósito: carga rápido en cualquier
    celular y no expone nada del resto de la aplicación.
  -->
  <style>
    :root {
      --celeste: #0ea5e9; --celeste-dark: #0369a1; --celeste-light: #e0f2fe; --celeste-lighter: #f0f9ff;
      --bg: #f0f9ff; --card: #ffffff; --ink: #0f172a; --ink-soft: #475569; --border: #dbeafe;
      --ok: #16a34a; --ok-bg: #f0fdf4; --warn: #b45309; --warn-bg: #fffbeb; --bad: #dc2626; --bad-bg: #fef2f2;
      --org: #0ea5e9;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --celeste-dark: #7dd3fc; --celeste-light: #0c4a6e; --celeste-lighter: #0b2536;
        --bg: #0b1220; --card: #111a2b; --ink: #e2e8f0; --ink-soft: #94a3b8; --border: #1e3a5f;
        --ok: #4ade80; --ok-bg: #052e16; --warn: #fbbf24; --warn-bg: #3a2a05; --bad: #f87171; --bad-bg: #3b0d0d;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--ink); line-height: 1.45; }
    .wrap { max-width: 560px; margin: 0 auto; padding: 16px 16px 40px; }
    .brand { display: flex; align-items: center; gap: 10px; margin: 4px 0 18px; font-weight: 700; font-size: 18px; }
    .brand img { width: 36px; height: 36px; }
    .brand .sion { color: var(--celeste); }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px; margin-bottom: 14px; }
    .lider { border-left: 5px solid var(--org); }
    .lider h1 { font-size: 20px; margin: 0 0 4px; }
    .muted { color: var(--ink-soft); font-size: 14px; }
    h2 { font-size: 15px; margin: 0 0 10px; }
    .dias { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: thin; }
    .dia, .hora {
      flex: none; border: 1px solid var(--border); background: var(--card); color: var(--ink);
      border-radius: 12px; cursor: pointer; font: inherit;
    }
    .dia { width: 64px; padding: 8px 4px; text-align: center; }
    .dia small { display: block; font-size: 11px; color: var(--ink-soft); text-transform: uppercase; }
    .dia b { display: block; font-size: 20px; }
    .horas { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 8px; }
    .hora { padding: 10px 0; font-weight: 600; }
    .dia[aria-pressed="true"], .hora[aria-pressed="true"] { background: var(--celeste); border-color: var(--celeste); color: #fff; }
    .dia[aria-pressed="true"] small { color: #e0f2fe; }
    label { display: block; font-size: 14px; font-weight: 600; margin: 12px 0 4px; }
    input, textarea {
      width: 100%; padding: 11px 12px; font: inherit; font-size: 16px; color: var(--ink);
      background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    }
    textarea { min-height: 70px; resize: vertical; }
    .trampa { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px; width: 100%; margin-top: 16px;
      padding: 13px; font: inherit; font-weight: 700; font-size: 16px; border: 0; border-radius: 12px; cursor: pointer;
      background: var(--celeste); color: #fff; text-decoration: none;
    }
    .btn:disabled { opacity: .6; cursor: default; }
    .btn.sec { background: var(--celeste-light); color: var(--celeste-dark); }
    .resumen { background: var(--celeste-lighter); border-radius: 10px; padding: 10px 12px; font-size: 14px; margin-top: 12px; }
    .error { background: var(--bad-bg); color: var(--bad); border-radius: 10px; padding: 10px 12px; margin-top: 12px; font-size: 14px; }
    .estado { border-radius: 12px; padding: 14px; margin: 10px 0; font-weight: 600; }
    .estado.pending { background: var(--warn-bg); color: var(--warn); }
    .estado.confirmed { background: var(--ok-bg); color: var(--ok); }
    .estado.rejected { background: var(--bad-bg); color: var(--bad); }
    .fila { display: flex; gap: 10px; padding: 4px 0; }
    .enlace { word-break: break-all; font-size: 13px; background: var(--celeste-lighter); padding: 8px 10px; border-radius: 8px; }
    .centro { text-align: center; }
    .spinner { width: 32px; height: 32px; border: 3px solid var(--celeste-light); border-top-color: var(--celeste); border-radius: 50%; animation: g 0.8s linear infinite; margin: 40px auto; }
    @keyframes g { to { transform: rotate(360deg); } }
    footer { text-align: center; font-size: 12px; color: var(--ink-soft); margin-top: 20px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand"><img src="/logo-bee.png" alt="" /><span>Organiza<span class="sion">Sion</span></span></div>
    <main id="app"><div class="spinner" aria-label="Cargando"></div></main>
    <footer>Tus datos solo los ve el líder con quien pides la entrevista.</footer>
  </div>

  <script>
  (function () {
    const app = document.getElementById('app');
    const partes = location.pathname.split('/').filter(Boolean); // ["agendar", token] | ["agendar","estado",token]
    const esEstado = partes[1] === 'estado';
    const token = esEstado ? partes[2] : partes[1];

    const DIAS = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
    const DIAS_C = ['dom', 'lun', 'mar', 'mié', 'jue', 'vie', 'sáb'];
    const MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
    const aFecha = (iso) => { const [y, m, d] = iso.split('-').map(Number); return new Date(y, m - 1, d, 12); };
    const fechaLarga = (iso) => { const f = aFecha(iso); return `${DIAS[f.getDay()]} ${f.getDate()} de ${MESES[f.getMonth()]}`; };
    const esc = (s) => { const d = document.createElement('div'); d.textContent = String(s ?? ''); return d.innerHTML; };
    const colorOk = (c) => (/^#[0-9a-f]{3}([0-9a-f]{3})?$/i.test(c || '') ? c : '#0ea5e9');
    const guardar = (k, v) => { try { localStorage.setItem(k, v); } catch (e) { /* sin almacenamiento */ } };
    const leer = (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } };

    async function pedir(url, opts) {
      const r = await fetch(url, opts);
      let data = {};
      try { data = await r.json(); } catch (e) { /* sin cuerpo */ }
      if (!r.ok) throw new Error(data.error || 'No se pudo conectar. Intenta de nuevo.');
      return data;
    }

    function error(msg) {
      app.innerHTML = `<div class="card"><h2>😕 Algo no salió bien</h2><p class="muted">${esc(msg)}</p></div>`;
    }

    // ---------------- Pedir entrevista ----------------
    async function vistaAgendar() {
      let info;
      try { info = await pedir(`/api/public/agendar/${encodeURIComponent(token)}`); } catch (e) { return error(e.message); }
      const l = info.lider;
      document.documentElement.style.setProperty('--org', colorOk(l.color));
      const previa = leer(`solicitud:${token}`);
      const cabecera = `
        <div class="card lider">
          <div class="muted">Pide una entrevista con</div>
          <h1>${esc(l.nombre)}</h1>
          <div class="muted">${esc([l.cargo, l.organizacion].filter(Boolean).join(' · '))}</div>
          ${previa ? `<p class="muted" style="margin-bottom:0">Ya enviaste una solicitud desde este teléfono. <a href="/agendar/estado/${esc(previa)}">Ver su estado</a></p>` : ''}
        </div>`;
      if (!info.dias.length) {
        app.innerHTML = cabecera + `<div class="card"><h2>No hay horarios disponibles en línea</h2><p class="muted">Por ahora ${esc(l.nombre.split(' ')[0])} no tiene horarios libres en las próximas semanas. Puedes contactarlo directamente.</p></div>`;
        return;
      }
      let dia = info.dias[0].fecha; let hora = null;
      app.innerHTML = cabecera + `
        <div class="card">
          <h2>1. Elige el día</h2>
          <div class="dias" id="dias" role="group" aria-label="Días disponibles"></div>
          <h2 style="margin-top:16px">2. Elige la hora</h2>
          <div class="horas" id="horas" role="group" aria-label="Horas disponibles"></div>
        </div>
        <form class="card" id="form" novalidate>
          <h2>3. Tus datos</h2>
          <label for="nombre">Nombre y apellido</label>
          <input id="nombre" name="nombre" autocomplete="name" required maxlength="80" />
          <label for="telefono">Teléfono (WhatsApp)</label>
          <input id="telefono" name="telefono" type="tel" autocomplete="tel" inputmode="tel" placeholder="+56 9 1234 5678" required maxlength="16" />
          <label for="nota">Motivo (opcional)</label>
          <textarea id="nota" name="nota" maxlength="300" placeholder="Ej. renovar recomendación del templo"></textarea>
          <div class="trampa" aria-hidden="true"><label>No llenar<input name="website" tabindex="-1" autocomplete="off" /></label></div>
          <div id="resumen" class="resumen"></div>
          <div id="err"></div>
          <button class="btn" id="enviar" type="submit">Enviar solicitud</button>
          <p class="muted" style="margin-bottom:0">El líder confirmará tu entrevista. Te daremos un enlace para ver si fue confirmada.</p>
        </form>`;

      const diasEl = document.getElementById('dias'); const horasEl = document.getElementById('horas');
      const resumen = document.getElementById('resumen');
      function pintar() {
        diasEl.innerHTML = info.dias.map((d) => { const f = aFecha(d.fecha); return `<button type="button" class="dia" data-f="${d.fecha}" aria-pressed="${d.fecha === dia}"><small>${DIAS_C[f.getDay()]}</small><b>${f.getDate()}</b><small>${MESES[f.getMonth()].slice(0, 3)}</small></button>`; }).join('');
        const horas = (info.dias.find((d) => d.fecha === dia) || { horas: [] }).horas;
        horasEl.innerHTML = horas.map((h) => `<button type="button" class="hora" data-h="${h}" aria-pressed="${h === hora}">${h}</button>`).join('');
        resumen.innerHTML = hora ? `📅 <b>${esc(fechaLarga(dia))}</b> a las <b>${esc(hora)}</b>` : 'Elige un día y una hora arriba.';
        diasEl.querySelectorAll('.dia').forEach((b) => b.addEventListener('click', () => { dia = b.dataset.f; hora = null; pintar(); }));
        horasEl.querySelectorAll('.hora').forEach((b) => b.addEventListener('click', () => { hora = b.dataset.h; pintar(); document.getElementById('nombre').focus({ preventScroll: true }); }));
      }
      pintar();

      document.getElementById('form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const f = e.target; const err = document.getElementById('err'); const btn = document.getElementById('enviar');
        err.innerHTML = '';
        if (!hora) { err.innerHTML = '<div class="error">Elige un día y una hora.</div>'; return; }
        if (f.nombre.value.trim().length < 3) { err.innerHTML = '<div class="error">Escribe tu nombre y apellido.</div>'; f.nombre.focus(); return; }
        if (f.telefono.value.replace(/\D/g, '').length < 8) { err.innerHTML = '<div class="error">Escribe un teléfono válido.</div>'; f.telefono.focus(); return; }
        btn.disabled = true; btn.textContent = 'Enviando…';
        try {
          const r = await pedir(`/api/public/agendar/${encodeURIComponent(token)}`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ nombre: f.nombre.value, telefono: f.telefono.value, nota: f.nota.value, website: f.website.value, fecha: dia, hora }),
          });
          if (r.estado) { guardar(`solicitud:${token}`, r.estado); location.href = `/agendar/estado/${r.estado}?nueva=1`; }
        } catch (ex) {
          err.innerHTML = `<div class="error">${esc(ex.message)}</div>`;
          btn.disabled = false; btn.textContent = 'Enviar solicitud';
          if (/disponible|ocup/i.test(ex.message)) { try { info = await pedir(`/api/public/agendar/${encodeURIComponent(token)}`); hora = null; if (!info.dias.find((d) => d.fecha === dia)) dia = info.dias[0]?.fecha; pintar(); } catch (e2) { /* se queda el error */ } }
        }
      });
    }

    // ---------------- Estado de la solicitud ----------------
    function icsDe(s) {
      const [y, m, d] = s.fecha.split('-'); const [hh, mm] = s.hora.split(':');
      const ini = `${y}${m}${d}T${hh}${mm}00`;
      const finMin = Number(hh) * 60 + Number(mm) + 30;
      const fin = `${y}${m}${d}T${String(Math.floor(finMin / 60)).padStart(2, '0')}${String(finMin % 60).padStart(2, '0')}00`;
      return ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//OrganizaSion//ES', 'BEGIN:VEVENT',
        `UID:${token}@organizasion`, `DTSTART;TZID=America/Santiago:${ini}`, `DTEND;TZID=America/Santiago:${fin}`,
        `SUMMARY:Entrevista con ${s.lider || s.organizacion}`, s.lugar ? `LOCATION:${s.lugar}` : '', 'END:VEVENT', 'END:VCALENDAR']
        .filter(Boolean).join('\r\n');
    }

    async function vistaEstado() {
      let s;
      try { s = await pedir(`/api/public/solicitud/${encodeURIComponent(token)}`); } catch (e) { return error(e.message); }
      document.documentElement.style.setProperty('--org', colorOk(s.color));
      const nueva = new URLSearchParams(location.search).has('nueva');
      const textos = {
        pending: '⏳ Solicitud enviada — esperando confirmación del líder',
        confirmed: s.entrevistaEstado === 'eliminada' ? '⚠️ La entrevista fue cancelada' : '✅ ¡Entrevista confirmada!',
        rejected: '❌ El líder no pudo confirmar este horario',
      };
      const clase = s.estado === 'confirmed' && s.entrevistaEstado === 'eliminada' ? 'rejected' : s.estado;
      const url = location.origin + location.pathname;
      app.innerHTML = `
        <div class="card lider">
          <div class="muted">Entrevista de ${esc(s.nombre)}</div>
          <h1>${esc(s.lider || s.organizacion)}</h1>
          <div class="muted">${esc(s.organizacion)}</div>
          <div class="estado ${clase}">${textos[s.estado] || s.estado}</div>
          <div class="fila">📅 <span>${esc(fechaLarga(s.fecha))}</span></div>
          <div class="fila">🕐 <span>${esc(s.hora)}</span></div>
          ${s.lugar ? `<div class="fila">📍 <span>${esc(s.lugar)}</span></div>` : ''}
          ${s.comentario ? `<div class="fila">💬 <span>${esc(s.comentario)}</span></div>` : ''}
          ${s.estado === 'confirmed' && s.entrevistaEstado !== 'eliminada' ? '<button class="btn" id="ics">📆 Agregar a mi calendario</button>' : ''}
          ${s.estado === 'rejected' ? '<p class="muted">Puedes volver al enlace que te compartieron y elegir otro horario.</p>' : ''}
        </div>
        ${s.estado === 'pending' ? `
        <div class="card">
          <h2>${nueva ? '🔖 Guarda este enlace' : 'Seguimiento'}</h2>
          <p class="muted">Vuelve a abrir esta página para ver si tu entrevista fue confirmada.</p>
          <div class="enlace">${esc(url)}</div>
          <button class="btn sec" id="copiar">📋 Copiar enlace</button>
          <a class="btn sec" href="https://wa.me/?text=${encodeURIComponent('Mi solicitud de entrevista: ' + url)}" target="_blank" rel="noopener">💬 Enviármelo por WhatsApp</a>
        </div>` : ''}`;
      const copiar = document.getElementById('copiar');
      if (copiar) copiar.addEventListener('click', () => navigator.clipboard?.writeText(url).then(() => { copiar.textContent = '✅ Copiado'; }));
      const ics = document.getElementById('ics');
      if (ics) ics.addEventListener('click', () => {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([icsDe(s)], { type: 'text/calendar' }));
        a.download = 'entrevista.ics'; a.click();
      });
    }

    if (!token) error('Falta el enlace. Pide a tu líder el enlace para agendar.');
    else if (esEstado) vistaEstado();
    else vistaAgendar();
  })();
  </script>
</body>
</html>
