// ---------------- Discursos (dentro de Asignaciones) ----------------
// Igual espíritu que Aseo: un registro es, ante todo, una FECHA (el
// domingo) a la que se le puede asignar uno o varios discursantes. El
// discursante se elige con el mismo buscador de miembros que usa
// Entrevistas (memberPickerFieldHtml/wireMemberPicker): si está registrado
// queda vinculado a su cuenta, y si no, el nombre escrito a mano queda tal
// cual.
function speakerKey(talk){ return talk.speakerUserId ? `u:${talk.speakerUserId}` : `n:${normalizeSearchText(talk.speakerName)}`; }
function speakerStats(talk){
  const key = speakerKey(talk);
  const mine = DB.talks.filter((t)=>speakerKey(t)===key);
  return { timesSpoken: mine.length, lastSpokenDate: mine.length ? mine.map((t)=>t.date).sort().slice(-1)[0] : null };
}
function withTalkInfo(talk){ return { ...talk, ...speakerStats(talk) }; }
// Reutilizado por Rachas y Logros para el ranking "Quién ha discursado
// más" — un renglón por persona distinta, no uno por discurso. `range` es
// opcional ({start,end} ISO, ambas inclusive).
function allSpeakersWithStats(range){
  const inRange = (date) => !range || (date >= range.start && date <= range.end);
  const talksInRange = DB.talks.filter((t) => inRange(t.date));
  const seen = new Map();
  for(const t of talksInRange){
    const key = speakerKey(t);
    if(!seen.has(key)){
      const mine = talksInRange.filter((x) => speakerKey(x) === key);
      seen.set(key, { speakerName:t.speakerName, speakerUserId:t.speakerUserId, timesSpoken: mine.length, lastSpokenDate: mine.map((x) => x.date).sort().slice(-1)[0] });
    }
  }
  return [...seen.values()].sort((a,b)=>b.timesSpoken-a.timesSpoken);
}

// Reutilizado por Rachas y Logros para "Más actividades registradas" y
// "Más actas de reunión registradas" — quién creó más, agrupado por
// createdBy y contado por la fecha propia del registro (no por cuándo se
// tipeó). `range` es opcional ({start,end} ISO, ambas inclusive).
function allActivityCreatorsWithStats(range){
  const inRange = (date) => !range || (date >= range.start && date <= range.end);
  const byUser = new Map();
  for(const e of DB.events){
    if(!e.createdBy || !inRange(e.date)) continue;
    if(!byUser.has(e.createdBy)) byUser.set(e.createdBy, []);
    byUser.get(e.createdBy).push(e);
  }
  return [...byUser.entries()].map(([userId, items]) => {
    const user = DB.users.find((u) => u.id === Number(userId));
    return { userId: Number(userId), userName: user?.name || '(usuario eliminado)', count: items.length, lastDate: items.map((e) => e.date).sort().slice(-1)[0] };
  }).sort((a,b)=>b.count-a.count);
}
function allMeetingCreatorsWithStats(range){
  const inRange = (date) => !range || (date >= range.start && date <= range.end);
  const byUser = new Map();
  for(const m of DB.meetings){
    if(!m.createdBy || !inRange(m.date)) continue;
    if(!byUser.has(m.createdBy)) byUser.set(m.createdBy, []);
    byUser.get(m.createdBy).push(m);
  }
  return [...byUser.entries()].map(([userId, items]) => {
    const user = DB.users.find((u) => u.id === Number(userId));
    return { userId: Number(userId), userName: user?.name || '(usuario eliminado)', count: items.length, lastDate: items.map((m) => m.date).sort().slice(-1)[0] };
  }).sort((a,b)=>b.count-a.count);
}

function renderTalksView(){
  const container = document.getElementById('assignments-content');
  const talks = DB.talks.map(withTalkInfo);
  const currentMonthKey = todayISO().slice(0,7);
  const current = talks.filter((t)=>t.date.slice(0,7) >= currentMonthKey);
  const past = talks.filter((t)=>t.date.slice(0,7) < currentMonthKey);

  const groupByDate = (items) => {
    const byDate = new Map();
    items.forEach((t)=>{ if(!byDate.has(t.date)) byDate.set(t.date, []); byDate.get(t.date).push(t); });
    return [...byDate.keys()].sort((a,b)=>b.localeCompare(a)).map((d)=>[d, byDate.get(d)]);
  };
  const currentGroups = groupByDate(current);
  const pastGroups = groupByDate(past);

  container.innerHTML = `
    <div class="section-header">
      <div><p>Quién discursó cada domingo en la reunión sacramental, y cuántas veces lo ha hecho</p></div>
      <button class="btn btn-primary" id="tk-new">+ Nuevo registro</button>
    </div>
    <div class="card-list">
      ${currentGroups.length ? currentGroups.map(([d, entries])=>talkDateCardHtml(d, entries, true)).join('') : emptyStateHtml('Todavía no hay discursos registrados este mes', { id:'tk-empty-new', label:'+ Agregar el primero' })}
    </div>
    ${pastGroups.length ? `
      <button type="button" class="btn btn-secondary btn-sm" id="tk-history-toggle" style="margin-top:16px;">
        ${state.talksHistoryOpen ? '▲ Ocultar histórico' : `📜 Ver histórico (${pastGroups.length} domingo${pastGroups.length===1?'':'s'} de meses anteriores)`}
      </button>
      <div class="card-list" style="margin-top:10px;">
        ${state.talksHistoryOpen ? pastGroups.map(([d, entries])=>talkDateCardHtml(d, entries, false)).join('') : ''}
      </div>` : ''}
  `;
  document.getElementById('tk-new').addEventListener('click', ()=>openTalkModal());
  wireEmptyStateCta('tk-empty-new', ()=>openTalkModal());
  const historyToggle = document.getElementById('tk-history-toggle');
  if(historyToggle) historyToggle.addEventListener('click', ()=>{ state.talksHistoryOpen = !state.talksHistoryOpen; renderTalksView(); });
  wireTalkCards(talks);
}

// Detalle de una persona: todo su historial de discursos (fecha + tema),
// sin importar si viene de la lista vigente o del histórico — así se puede
// "analizar" a la persona completa: cuántas veces, cuándo, y de qué habló
// cada vez.
function openSpeakerDetailModal(speakerName, speakerUserId, allTalks){
  const key = speakerUserId ? `u:${speakerUserId}` : `n:${normalizeSearchText(speakerName)}`;
  const mine = allTalks.filter((t)=>talkSpeakerKey(t)===key).sort((a,b)=>b.date.localeCompare(a.date));
  const modalRoot = document.getElementById('modal-root');
  modalRoot.innerHTML = `
    <div class="modal-backdrop" id="tksd-modal-backdrop">
      <div class="modal">

          <p class="hint-box" style="margin-top:0;">Ha discursado ${mine.length===1?'1 vez':mine.length+' veces'} en total.</p>
          <div class="card-list">
            ${mine.map((t)=>`
              <div class="list-card">
                <div class="lc-main">
                  <div class="lc-title">${esc(fmtDateHuman(t.date))}</div>
                  <div class="lc-sub" ${t.topic?'':'style="font-style:italic;"'}>${t.topic ? esc(t.topic) : 'Sin tema registrado'}</div>

  document.getElementById('tksd-modal-backdrop').addEventListener('click', (e)=>{ if(e.target.id==='tksd-modal-backdrop') closeModal(); });
}

function wireTalkCards(talks){
  document.querySelectorAll('#assignments-content .cleaning-family-row').forEach((row)=>{
    const id = Number(row.dataset.id);
    const editBtn = row.querySelector('.tk-edit');
    if(editBtn) editBtn.addEventListener('click', ()=>{
      const talk = talks.find((t)=>t.id===id);
      if(talk) openTalkEditModal(talk);
    });
    const removeBtn = row.querySelector('.tk-remove');
    if(removeBtn) removeBtn.addEventListener('click', async ()=>{
      if(!(await confirmModal('¿Eliminar este registro de discurso?', { title:'Eliminar discurso', confirmText:'Eliminar', danger:true }))) return;
      DB.talks = DB.talks.filter((t)=>t.id!==id);
      toast('Discurso eliminado');
      renderTalksView();
    });
  });
  document.querySelectorAll('.tk-add-speaker').forEach((btn)=>{
    btn.addEventListener('click', ()=>openTalkModal(btn.dataset.date));
  });
  document.querySelectorAll('#assignments-content .tk-speaker-name').forEach((el)=>{
    el.addEventListener('click', ()=>openSpeakerDetailModal(el.dataset.speakerName, el.dataset.speakerUserId || null, talks));
  });
}

// presetDate: si viene con valor, el modal funciona en modo "agregar
// discursante a un domingo que ya existe" (fecha fija); si no, funciona en
// modo "registro nuevo" (se elige la fecha, y se le pueden agregar de una
// varios discursantes con "+ Agregar otro discursante").
function openTalkModal(presetDate){
  const directory = DB.users;
  const allTalks = DB.talks.map(withTalkInfo);
  const isAdd = !!presetDate;
  const modalRoot = document.getElementById('modal-root');
  modalRoot.innerHTML = `<div class="modal-backdrop" id="tk-modal-backdrop"><div class="modal">
    <div class="modal-header"><h3>${isAdd ? 'Agregar discursante' : 'Nuevo registro de discursos'}</h3><button class="modal-close" id="tk-modal-close">×</button></div>
    <div class="modal-body">
      <div id="tk-error"></div>
      <form id="tk-form">
        <div class="field"><label>Domingo</label><input type="date" name="date" required value="${esc(presetDate||'')}" ${isAdd?'readonly':''} /></div>
        <div class="field">
          <label>Discursantes</label>
          <div id="tk-speaker-rows"></div>
          <button type="button" class="btn btn-secondary btn-sm" id="tk-add-row">+ Agregar otro discursante</button>
        </div>
      </form>
    </div>
    <div class="modal-footer"><div></div><div style="display:flex; gap:8px;"><button class="btn btn-secondary" id="tk-cancel">Cancelar</button><button class="btn btn-primary" id="tk-save">${isAdd?'Agregar':'Guardar registro'}</button></div></div>
  </div></div>`;
  const tkGuardedClose = wireUnsavedChangesGuard(document.getElementById('tk-form'));
  document.getElementById('tk-modal-close').addEventListener('click', tkGuardedClose);
  document.getElementById('tk-cancel').addEventListener('click', tkGuardedClose);
  document.getElementById('tk-modal-backdrop').addEventListener('click',(e)=>{ if(e.target.id==='tk-modal-backdrop') tkGuardedClose(); });

  const talkSpeakerRowHtml = (rowId) => `
    <div class="family-row" data-row-id="${rowId}">
      <div style="display:flex; gap:8px; align-items:flex-start;">
        <div style="flex:1;">
          ${memberPickerFieldHtml(rowId, '', '')}
          <div class="field" style="margin-top:6px;"><input type="text" class="tk-topic" placeholder="Tema del discurso (opcional)" /></div>
        </div>
        <button type="button" class="btn btn-ghost btn-sm tk-row-remove" title="Quitar este discursante">${icon('trash')}</button>
      </div>
      <div class="tk-row-stats hint-box" style="margin-top:6px; display:none;"></div>
    </div>`;

  const wireTalkSpeakerRow = (rowEl, rowId) => {
    const nameInput = document.getElementById(`${rowId}-member-name`);
    const hiddenId = document.getElementById(`${rowId}-member-user-id`);
    const statsBox = rowEl.querySelector('.tk-row-stats');
    const showStatsFor = () => {
      const name = nameInput.value;
      const userId = hiddenId.value;
      const norm = normalizeSearchText(name);
      if(!norm){ statsBox.style.display = 'none'; return; }
      const match = userId
        ? allTalks.find((t)=>Number(t.speakerUserId)===Number(userId))
        : allTalks.find((t)=>!t.speakerUserId && normalizeSearchText(t.speakerName)===norm);
      statsBox.style.display = '';
      statsBox.textContent = match
        ? `Ha discursado ${match.timesSpoken} ${match.timesSpoken===1?'vez':'veces'} · última vez: ${fmtDateHuman(match.lastSpokenDate)}`
        : 'Nunca ha discursado';
    };
    wireMemberPicker(rowId, directory, showStatsFor);
    nameInput.addEventListener('input', showStatsFor);
    rowEl.querySelector('.tk-row-remove').addEventListener('click', ()=>{
      const box = rowEl.parentElement;
      if(box.children.length > 1) rowEl.remove();
    });
  };

  const rowsBox = document.getElementById('tk-speaker-rows');
  let rowCounter = 0;
  const addRow = () => {
    const rowId = `tk-row-${rowCounter++}`;
    rowsBox.insertAdjacentHTML('beforeend', talkSpeakerRowHtml(rowId));
    wireTalkSpeakerRow(rowsBox.lastElementChild, rowId);
  };
  document.getElementById('tk-add-row').addEventListener('click', addRow);
  addRow();

  document.getElementById('tk-save').addEventListener('click', ()=>{
    const form = document.getElementById('tk-form');
    if(!form.reportValidity()) return;
    const speakers = Array.from(rowsBox.children).map((rowEl)=>{
      const rowId = rowEl.dataset.rowId;
      return {
        speakerName: document.getElementById(`${rowId}-member-name`).value.trim(),
        speakerUserId: document.getElementById(`${rowId}-member-user-id`).value || null,
        topic: rowEl.querySelector('.tk-topic').value.trim(),
      };
    }).filter((s)=>s.speakerName);
    if(!speakers.length){ document.getElementById('tk-error').innerHTML = '<div class="error-msg">Agrega al menos un discursante</div>'; return; }
    const date = form.date.value;
    const now = new Date().toISOString();
    speakers.forEach((s)=>{
      const speakerUserId = s.speakerUserId ? Number(s.speakerUserId) : null;
      const key = speakerUserId ? `u:${speakerUserId}` : `n:${normalizeSearchText(s.speakerName)}`;
      const already = DB.talks.some((t)=>t.date===date && (t.speakerUserId?`u:${t.speakerUserId}`:`n:${normalizeSearchText(t.speakerName)}`)===key);
      if(already) return;
      DB.talks.push({ id: nextId('talks'), date, speakerName: s.speakerName, speakerUserId, topic: s.topic, createdBy: currentUser.id, createdAt: now });
    });
    closeModal(); toast(isAdd ? 'Discursante agregado' : 'Registro creado'); renderTalksView();
  });
}

// registrado; si se cambia a mano, queda desvinculado.
function openTalkEditModal(talk){
  const modalRoot = document.getElementById('modal-root');
  modalRoot.innerHTML = `<div class="modal-backdrop" id="tke-modal-backdrop"><div class="modal">
    <div class="modal-header"><h3>Editar discurso</h3><button class="modal-close" id="tke-modal-close">×</button></div>
    <div class="modal-body">
      <div id="tke-error"></div>
      <form id="tke-form">
        <div class="field"><label>Domingo</label><input type="date" name="date" required value="${esc(talk.date)}" /></div>
        <div class="field"><label>Discursante</label><input type="text" name="speakerName" required value="${esc(talk.speakerName)}" /></div>
        <div class="field"><label>Tema (opcional)</label><input type="text" name="topic" value="${esc(talk.topic||'')}" /></div>

const MONTH_ABBR = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];

// Mini-gráfico de tendencia (sparkline) del % de asistencia mes a mes —
// mismo criterio que app.js/attendanceSparklineHtml: SVG armado a mano
// (sin librería de gráficos), salta los meses sin actividades evaluadas
// (pct:null) en vez de dibujarlos como 0%, y marca el 100% con una línea
// punteada de referencia.
function attendanceSparklineHtml(monthlyAttendance){
  const withData = (monthlyAttendance||[]).filter((m)=>m.pct!==null);
  if(!withData.length){
    return `<div class="hint-box" style="margin-top:0;">Todavía no hay actividades evaluadas este año para mostrar la tendencia mensual.</div>`;
  }
  const h=70, padY=10;
  const usableH = h - padY*2;
  const maxPct = Math.max(100, ...withData.map((m)=>m.pct));
  // x en porcentaje del ancho del contenedor — los puntitos van como divs
  // HTML posicionados con `left: %` (no <circle> del SVG) para que no
  // salgan ovalados cuando el SVG se estira de forma no uniforme en un
  // contenedor ancho; ver misma nota en app.js/attendanceSparklineHtml.
  const xPct = (i) => (i/11)*100;
  const yFor = (pct) => padY + usableH - (usableH*pct)/maxPct;

  let pathParts = [];
  let drawing = false;
  monthlyAttendance.forEach((m,i)=>{
    if(m.pct===null){ drawing=false; return; }
    pathParts.push(`${drawing?'L':'M'}${xPct(i).toFixed(2)},${yFor(m.pct).toFixed(1)}`);
    drawing = true;
  });

  const dotsHtml = monthlyAttendance.map((m,i)=>{
    if(m.pct===null) return '';
    return `<div class="sparkline-dot" style="left:${xPct(i).toFixed(2)}%; top:${yFor(m.pct).toFixed(1)}px;" title="${MONTH_ABBR[i]}: ${m.pct}% (${m.count} actividad${m.count===1?'':'es'} evaluada${m.count===1?'':'s'})"></div>`;
  }).join('');

  return `
    <div class="sparkline-wrap">
      <div class="sparkline-plot" style="height:${h}px;">
        <svg viewBox="0 0 100 ${h}" class="sparkline-svg" preserveAspectRatio="none">
          <line x1="0" y1="${yFor(100).toFixed(1)}" x2="100" y2="${yFor(100).toFixed(1)}" class="sparkline-baseline" vector-effect="non-scaling-stroke" />
          <path d="${pathParts.join(' ')}" class="sparkline-path" fill="none" vector-effect="non-scaling-stroke" />
        </svg>
        ${dotsHtml}
      </div>
      <div class="sparkline-labels">${MONTH_ABBR.map((m)=>`<span>${m}</span>`).join('')}</div>
    </div>`;
}

// Compromisos: % cumplidos por persona, sobre compromisos ya RESUELTOS
// (completados o no cumplidos) — los "pending" todavía no tuvieron su
// oportunidad, así que no cuentan ni a favor ni en contra de nadie. Se
// agrupan por su propia dueDate para poder acotarlos a un período. `range`
// es opcional ({start,end} ISO, ambas inclusive).
function commitmentsRankingOf(range){
  const inRange = (date) => !range || (date >= range.start && date <= range.end);
  const byUser = new Map();
  for(const m of DB.meetings){
    for(const c of (m.commitments||[])){
      if(c.status!=='completed' && c.status!=='not_fulfilled') continue;
      if(!inRange(c.dueDate)) continue;
      const uid = Number(c.assignedToUserId);
      if(!byUser.has(uid)) byUser.set(uid, { completed:0, notFulfilled:0 });
      const entry = byUser.get(uid);
      if(c.status==='completed') entry.completed+=1; else entry.notFulfilled+=1;
    }
  }
  return [...byUser.entries()].map(([uid,e])=>{
    const user = DB.users.find((u)=>u.id===uid);
    const total = e.completed + e.notFulfilled;
    return { userId:uid, userName:user?.name||'(usuario eliminado)', completed:e.completed, notFulfilled:e.notFulfilled, total, pct: total>0 ? Math.round((e.completed/total)*1000)/10 : null };
  }).sort((a,b)=>(b.pct??-1)-(a.pct??-1) || b.total-a.total);
}
// Entrevistas: "interviewerName" es texto libre — se agrupa normalizado,
// para que mayúsculas o tildes distintas no fragmenten el conteo de la
// misma persona. `range` es opcional ({start,end} ISO, ambas inclusive).
// Solo cuentan las entrevistas verificadas como "Se hizo" (ver el check
// ✅/❌ de Entrevistas) — igual criterio que Aseo y Discursos, que solo
// suman lo efectivamente cumplido, no lo agendado.
function interviewsRankingOf(range){
  const inRange = (date) => !range || (date >= range.start && date <= range.end);
  const byInterviewer = new Map();
  // Una entrevista grupal (matrimonio, compañerismo de ministración) cuenta
  // como UNA sola "entrevista realizada" para el ranking, no una por
  // persona citada — se deduplica por groupId, igual criterio que
  // interviewsRanking en el servidor real (stats.js).
  const countedGroups = new Set();
  for(const iv of DB.interviews){
    if(iv.status!=='done') continue;
    if(!inRange(iv.date)) continue;
    const norm = normalizeSearchText(iv.interviewerName);
    if(!norm) continue;
    const dedupeKey = `${norm}::${iv.groupId ?? iv.id}`;
    if(countedGroups.has(dedupeKey)) continue;
    countedGroups.add(dedupeKey);
    if(!byInterviewer.has(norm)) byInterviewer.set(norm, { interviewerName: iv.interviewerName, count:0 });
    byInterviewer.get(norm).count += 1;
  }
  return [...byInterviewer.values()].sort((a,b)=>b.count-a.count);
}
// Junta los 6 rankings de Rachas y Logros — usado tanto por "Todo el
// tiempo" (sin range) como por cada período (con range).
function allCategoryRankings(range){
  return {
    commitmentsRanking: commitmentsRankingOf(range),
    cleaningRanking: allFamiliesWithStats(range),
    interviewsRanking: interviewsRankingOf(range),
    talksRanking: allSpeakersWithStats(range),
    activitiesRanking: allActivityCreatorsWithStats(range),
    meetingsRanking: allMeetingCreatorsWithStats(range),
  };
}

function achAlreadyClosed(periodType, periodKey){

      categoryKey: cat.key, categoryLabel: cat.label, categoryIcon: cat.icon,
      achievementName: cat.achievementName, blurb: cat.blurb,
      winnerUserId: winner.userId, winnerName: winner.name, valueLabel: winner.valueLabel, closedAt: now,
    });
  }
  DB.achievementClosures.push({ id: nextId('achievementClosures'), periodType, periodKey, closedAt: now });
}
// Cierra automáticamente todos los períodos ya terminados que todavía no
// tengan registro de cierre — mismo criterio que
// achievements.js→closeElapsedPeriods() del servidor real. En el demo se
// llama una sola vez al cargar la página (ver el final del archivo, justo
// antes de renderLogin()), ya que acá no hay ningún proceso corriendo de
// fondo entre visitas.
function achCloseElapsedPeriods(){
  const today = todayISO(0);
  const now = new Date().toISOString();
  for(const periodType of PERIOD_TYPES){
    let key = previousPeriodKey(periodType, currentPeriodKey(periodType));
    for(let i=0; i<ACH_LOOKBACK_STEPS[periodType]; i++){
      if(!isPeriodElapsed(periodType, key, today)) break;
      if(achAlreadyClosed(periodType, key)) break;
      achCloseOnePeriod(periodType, key, now);
      key = previousPeriodKey(periodType, key);
    }
  }
}

// ---------------- Exportar reportes (CSV / imprimir-a-PDF) ----------------
// El CSV se arma y descarga enteramente en el navegador. El "PDF" reutiliza
// el mismo mecanismo que ya usa el diploma de arriba: una tabla armada en un
// contenedor .print-area + window.print().
function downloadCsv(filename, headers, rows){
  const escCsv = (v) => {
    const s = String(v ?? '');
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  const lines = [headers.map(escCsv).join(','), ...rows.map((r)=>r.map(escCsv).join(','))];
  const blob = new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}
function printReport(title, meta, headers, rows){
  let area = document.getElementById('report-print-area');
  if(!area){
    area = document.createElement('div');
    area.id = 'report-print-area';
    area.className = 'print-area';
    document.body.appendChild(area);
  }
  area.innerHTML = `
    <div class="print-report">
      <h2>${esc(title)}</h2>
      <div class="print-report-meta">${esc(meta)} · ${esc(APP_NAME)}</div>
      <table>
        <thead><tr>${headers.map((h)=>`<th>${esc(h)}</th>`).join('')}</tr></thead>
        <tbody>${rows.map((r)=>`<tr>${r.map((c)=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody>
      </table>
    </div>`;
  window.print();
}

// ===================== PANEL DE OBISPADO =====================
// Resumen de una sola pantalla con lo más urgente de TODAS las
// organizaciones — compromisos atrasados, turnos de aseo sin confirmar,
// entrevistas próximas y el presupuesto del trimestre — para no tener que
// entrar módulo por módulo a armarse una idea general. Solo lo ve el
// Administrador o el líder de Obispado (canSeeBishopricPanelTab).
function addDaysISO(days){ const d=new Date(); d.setDate(d.getDate()+days); return toISODate(d); }

function dashboardOverview(){
  const today = toISODate(new Date());
  const weekEnd = addDaysISO(7);

  const overdueCommitments = [];
  DB.meetings.forEach((m)=>{
    if(m.status!=='active') return;
    const org = orgById(m.organizationId);
    (m.commitments||[]).forEach((c)=>{
      if(c.status!=='pending' || !c.dueDate || c.dueDate>=today) return;
      const assignee = DB.users.find((u)=>u.id===Number(c.assignedToUserId));
      overdueCommitments.push({
        commitmentId:c.id, meetingId:m.id, meetingTitle:m.title,
        organizationName: org?.name || 'Administración',
        description:c.description, dueDate:c.dueDate,
        assignedToName: assignee?assignee.name:'(usuario eliminado)',
        // El cliente lo usa para saber si quien ve el panel es justo el
        // responsable de este compromiso — solo ahí le muestra "✅ Completar"
        // directamente en la tarjeta.
        assignedToUserId: c.assignedToUserId ?? null,
      });
    });
  });
  overdueCommitments.sort((a,b)=>a.dueDate.localeCompare(b.dueDate));

  const cleaningPending = DB.cleaningShifts
    .filter((s)=>s.status==='scheduled' && s.date<today)
    .map((s)=>({ id:s.id, date:s.date, familyName:s.familyName }))
    .sort((a,b)=>a.date.localeCompare(b.date));

  // Solo las todavía pendientes de verificar — las ya marcadas ✅/❌ no
  // necesitan atención y viven en el historial de Entrevistas. Una
  // entrevista grupal (matrimonio, compañerismo de ministración) cuenta
  // como UNA sola tarjeta, con los nombres unidos — igual criterio que
  // upcomingInterviews en el servidor real (dashboard.js).
  const upcomingInterviews = groupInterviews(
    DB.interviews.filter((iv)=>iv.date>=today && iv.date<=weekEnd && (iv.status||'scheduled')==='scheduled')
  )
    .map((g)=>({ id:g.id, date:g.date, startTime:g.startTime, memberName:g.memberNames, interviewerName:g.interviewerName, organizationName:g.organizationName }))
    .sort((a,b)=>(a.date+a.startTime).localeCompare(b.date+b.startTime));

  const activitiesThisWeek = DB.events.filter((e)=>e.date>=today && e.date<=weekEnd).length;

  const quarter = currentQuarter();
  const categorySummaries = allCategoryRefs().map((ref)=>budgetSummaryFor(quarter, ref));
  const totalAssigned = categorySummaries.reduce((s,c)=>s+c.assigned,0);
  const totalSpent = categorySummaries.reduce((s,c)=>s+c.spent,0);

  // Punto 10: aviso si pasó más tiempo del que el Obispo definió (por
  // defecto 7 días) desde el último Consejo de Barrio registrado.
  const councilFrequencyDays = DB.wardSettings?.councilFrequencyDays || 7;
  const lastCouncilDate = lastMeetingDateOfType('consejo_barrio');
  const daysSinceCouncil = lastCouncilDate ? Math.floor((Date.parse(today) - Date.parse(lastCouncilDate)) / 86400000) : null;
  const wardCouncil = {
    frequencyDays: councilFrequencyDays, lastDate: lastCouncilDate, daysSinceLast: daysSinceCouncil,
    overdue: lastCouncilDate ? daysSinceCouncil > councilFrequencyDays : true,
  };

  // Punto 8: la Coordinación de Ministración debe darse al menos una vez
  // por trimestre (Manual General 7.1.1.1), dirigido a las tres personas
  // que el manual identifica (ver isPresident en los usuarios).
  const lastMinisteringDate = lastMeetingDateOfType('coordinacion_ministracion');
  const ministeringCoordination = {
    quarter, quarterLabel: quarterLabelClient(quarter), lastDate: lastMinisteringDate,
    overdue: !lastMinisteringDate || quarterOf(lastMinisteringDate) !== quarter,
    keyLeaders: {
      bishop: presidentOf('Obispado'),
      eldersQuorumPresident: presidentOf('Cuórum de Élderes'),
      reliefSocietyPresident: presidentOf('Sociedad de Socorro'),
    },
  };

  return {
    overdueCommitments, cleaningPending, upcomingInterviews, activitiesThisWeek,
    budget: { quarter, quarterLabel: quarterLabelClient(quarter), totalAssigned, totalSpent, totalBalance: totalAssigned-totalSpent },
    wardCouncil, ministeringCoordination,
  };
}
function presidentOf(orgName){
  const org = DB.organizations.find((o)=>o.name===orgName);
  if(!org) return null;
  const u = DB.users.find((x)=>x.role==='leader' && Number(x.organizationId)===org.id && x.isPresident);
  return u ? { id:u.id, name:u.name } : null;
}

    : wc.overdue
      ? `Han pasado ${wc.daysSinceLast} días desde el último (${esc(fmtDateHuman(wc.lastDate))}) — la frecuencia esperada es cada ${wc.frequencyDays} días.`
      : `Al día — el último fue hace ${wc.daysSinceLast} día${wc.daysSinceLast===1?'':'s'} (${esc(fmtDateHuman(wc.lastDate))}).`;
  return `
    <div class="council-alert-box${okClass}">
      <div class="council-alert-icon">${wc.overdue?'⚠️':'✅'}</div>
      <div class="council-alert-body">
        <div class="council-alert-title">⛪ Consejo de Barrio</div>
        <div>${statusText}</div>
        ${wc.overdue ? `<button type="button" class="btn btn-secondary btn-sm" id="bp-create-council">📋 Crear acta de Consejo de Barrio</button>` : ''}

          <label for="bp-council-freq" style="font-weight:600; font-size:12.5px;">Frecuencia esperada (días):</label>
          <input type="number" id="bp-council-freq" min="1" max="90" value="${wc.frequencyDays}" />
          <button type="submit" class="btn btn-ghost btn-sm">Guardar</button>
        </form>
      </div>
    </div>`;
}

// Las esferitas reemplazan la barra de scroll nativa (escondida por CSS)
// para las cajas "de a una tarjeta a la vez" del Panel de Obispado: una por
// tarjeta, gris, y la de la tarjeta que se está viendo se pinta celeste —
// igual que un carrusel. Se puede tocar una esfera para saltar directo a
// esa tarjeta.
function bpScrollDotsHtml(count, targetId){
  if(count<=1) return '';
  const dots = Array.from({length:count}, (_,i)=>`<button type="button" class="bp-scroll-dot${i===0?' active':''}" data-index="${i}" aria-label="Tarjeta ${i+1} de ${count}"></button>`).join('');
  return `<div class="bp-scroll-dots" data-target="${targetId}">${dots}</div>`;
}
function wireBishopricScrollDots(){
  document.querySelectorAll('.bp-scroll-dots').forEach((dotsEl)=>{
    const row = document.getElementById(dotsEl.dataset.target);
    if(!row) return;
    const dots = Array.from(dotsEl.querySelectorAll('.bp-scroll-dot'));
    const updateActive = ()=>{
      const idx = Math.max(0, Math.min(dots.length-1, Math.round(row.scrollLeft / Math.max(1, row.clientWidth))));
      dots.forEach((d,i)=>d.classList.toggle('active', i===idx));
    };
    row.addEventListener('scroll', ()=>window.requestAnimationFrame(updateActive));
    dots.forEach((d,i)=>{
      d.addEventListener('click', ()=>row.scrollTo({ left: i*row.clientWidth, behavior:'smooth' }));
    });
  });
}

function wireBishopricPanelActions(){
  document.getElementById('bp-create-council')?.addEventListener('click', ()=>goCreateMeetingOfType('consejo_barrio'));
  document.getElementById('bp-create-ministering')?.addEventListener('click', ()=>goCreateMeetingOfType('coordinacion_ministracion'));
  document.getElementById('bp-council-freq-form')?.addEventListener('submit', (e)=>{
    e.preventDefault();
    const input = document.getElementById('bp-council-freq');
    const days = Number(input.value);
    if(!Number.isFinite(days) || days<1 || days>90){ toast('La frecuencia debe ser un número entre 1 y 90 días', 'error'); return; }
    DB.wardSettings = { ...DB.wardSettings, councilFrequencyDays: Math.round(days) };
    toast('Frecuencia actualizada');
    renderBishopricPanelView();
  });
  document.querySelectorAll('.bp-commitment-card').forEach((card)=>{
    const toggleBtn = card.querySelector('.bp-commitment-complete-toggle');
    if(toggleBtn){
      const form = card.querySelector('.bp-commitment-complete-form');
      toggleBtn.addEventListener('click', ()=>{ form.style.display = form.style.display==='none' ? '' : 'none'; });
      card.querySelector('.bp-commitment-complete-save').addEventListener('click', ()=>{
        const found = findMeetingWithCommitment(Number(card.dataset.commitmentId));
        if(!found){ toast('Compromiso no encontrado', 'error'); return; }
        const comment = card.querySelector('.bp-commitment-comment').value.trim();
        Object.assign(found.commitment, { status:'completed', completedAt:new Date().toISOString(), completionComment:comment });
        toast('Compromiso completado');
        renderBishopricPanelView();
      });
    } else {
      // No es tu compromiso: tocar la tarjeta lleva directo a esa acta en
      // Reuniones y Consejos (mismo destino que un resultado de búsqueda de
      // categoría "meetings").
      card.addEventListener('click', ()=>goToSearchResult('meetings', Number(card.dataset.meetingId), ''));
    }
  });
  document.querySelectorAll('.bp-cs-mark').forEach((btn)=>{
    btn.addEventListener('click', ()=>{
      const shift = DB.cleaningShifts.find((s)=>s.id===Number(btn.dataset.id));
      if(!shift) return;
      shift.status = btn.dataset.status;
      shift.markedAt = new Date().toISOString();
      shift.markedBy = currentUser.id;
      toast('Turno actualizado');
      renderBishopricPanelView();
    });
  });
}

// Banner discreto que avisa cuando el navegador pierde la conexión — mismo
// comportamiento que la app real (ver wireOfflineBanner en app.js), aunque
// en el demo no hay guardado real de por medio, así que es puramente
// informativo/ilustrativo de la función.
function wireOfflineBanner(){
  const banner = document.getElementById('offline-banner');
  if(!banner) return;
  const update = () => { banner.style.display = navigator.onLine ? 'none' : 'block'; };
  window.addEventListener('online', () => { update(); toast('Conexión recuperada'); });
  window.addEventListener('offline', update);
  update();
}

// Deslizar el dedo hacia la izquierda o la derecha en cualquier parte de la
// pantalla cambia de módulo (pestaña) — mismo comportamiento que la app real
// (ver wireSwipeNavigation en app.js). Atado una sola vez a `document` (no a
// #root, que se vuelve a crear en cada login) para que funcione en toda la
// pantalla, incluida la barra superior. Se ignora el gesto si: hay un modal
// abierto, no hay sesión iniciada, el desplazamiento no fue predominantemente
// horizontal (para no interferir con el scroll normal de una lista larga), o
// empezó dentro de un elemento que ya se desplaza horizontalmente por sí
// mismo — la grilla del calendario en celular (.cal-grid-wrap), el carrusel
// del Panel de Obispado (.bp-scroll-row), una tabla con scroll propio
// (.table-scroll), o la fila de pestañas si no entran todas (.tabs).
let swipeNavigationWired = false;
function wireSwipeNavigation() {
  // Se llama una sola vez al cargar el script, pero se protege igual con
  // este guard (misma protección que en app.js) por si en el futuro se
  // llamara de nuevo desde otro punto (ej. tras iniciar sesión) — así nunca
  // queda más de un par de listeners atados a `document`.
  if (swipeNavigationWired) return;
  swipeNavigationWired = true;
  const SWIPE_MIN_DISTANCE = 60; // px — evita que un tap o un scroll corto dispare el cambio
  const SWIPE_INTENT_THRESHOLD = 10; // px — cuánto hay que moverse antes de decidir si el gesto es horizontal o vertical
  const SWIPE_MAX_OFF_AXIS_RATIO = 0.6; // |dy| no puede pasar de esta fracción de |dx|
  const HORIZONTAL_SCROLL_CLASSES = ['cal-grid-wrap', 'bp-scroll-row', 'table-scroll', 'tabs'];
  let touchStartX = null;
  let touchStartY = null;
  let swipeIntent = null; // null = aún no decidido; 'horizontal' | 'vertical' una vez que el gesto se define

  const startsInsideHorizontalScroller = (el) => {
    let node = el;
    while (node && node !== document.body) {
      if (node.classList) {
        for (const cls of HORIZONTAL_SCROLL_CLASSES) {
          if (node.classList.contains(cls)) return true;
        }
      }
      if (node.scrollWidth > node.clientWidth + 2) return true;
      node = node.parentElement;
    }
    return false;
  };

  document.addEventListener('touchstart', (e) => {
    if (e.touches.length !== 1 || !currentUser) { touchStartX = null; return; }
    const modalRoot = document.getElementById('modal-root');
    if (modalRoot && modalRoot.innerHTML.trim()) { touchStartX = null; return; }
    if (startsInsideHorizontalScroller(e.touches[0].target)) { touchStartX = null; return; }
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
    swipeIntent = null;
  }, { passive: true });

  // Una vez que el gesto se reconoce como predominantemente horizontal, se
  // llama preventDefault() en touchmove para que el navegador no lo tome
  // como su propio gesto nativo de "volver atrás/adelante" (mismo motivo
  // que en app.js). Un gesto vertical nunca llama preventDefault, así que
  // el scroll normal de una lista larga sigue intacto.
  document.addEventListener('touchmove', (e) => {
    if (touchStartX === null || e.touches.length !== 1) return;
    const dx = e.touches[0].clientX - touchStartX;
    const dy = e.touches[0].clientY - touchStartY;
    if (swipeIntent === null && (Math.abs(dx) >= SWIPE_INTENT_THRESHOLD || Math.abs(dy) >= SWIPE_INTENT_THRESHOLD)) {
      swipeIntent = Math.abs(dy) > Math.abs(dx) * SWIPE_MAX_OFF_AXIS_RATIO ? 'vertical' : 'horizontal';
    }
    if (swipeIntent === 'horizontal' && e.cancelable) e.preventDefault();
  }, { passive: false });

  document.addEventListener('touchend', (e) => {
    if (touchStartX === null) return;
    const touch = e.changedTouches[0];
    const dx = touch.clientX - touchStartX;
    const dy = touch.clientY - touchStartY;
    touchStartX = null;
    if (Math.abs(dx) < SWIPE_MIN_DISTANCE) return;
    if (Math.abs(dy) > Math.abs(dx) * SWIPE_MAX_OFF_AXIS_RATIO) return;
    const order = tabOrderFor().filter((k) => TAB_DEFS[k].visible());
    const idx = order.indexOf(state.view);
    if (idx === -1) return;
    // Izquierda (dx negativo) avanza al siguiente módulo; derecha (dx
    // positivo) retrocede — misma convención que cualquier carrusel.
    const nextIdx = dx < 0 ? idx + 1 : idx - 1;
    if (nextIdx < 0 || nextIdx >= order.length) return;
    state.view = order[nextIdx];
    renderCurrentView();
  }, { passive: true });
}

achCloseElapsedPeriods();
wireOfflineBanner();
