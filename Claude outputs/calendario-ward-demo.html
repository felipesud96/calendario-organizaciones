        <div class="two-col">
          <div class="field"><label>Hora de inicio</label><input type="time" name="startTime" required value="${existing?.startTime||''}" /></div>
          <div class="field"><label>Hora de término (opcional)</label><input type="time" name="endTime" value="${existing?.endTime||''}" /></div>
        </div>
      </form>
    </div>
    <div class="modal-footer">
      <div>${isEdit?`<button class="btn btn-danger" id="iv-delete">Eliminar</button>`:''}</div>
      <div style="display:flex; gap:8px;"><button class="btn btn-secondary" id="iv-cancel">Cancelar</button><button class="btn btn-primary" id="iv-save">${isEdit?'Guardar cambios':'Agendar'}</button></div>
    </div></div></div>`;
  const ivGuardedClose = wireUnsavedChangesGuard(document.getElementById('iv-form'));
  document.getElementById('iv-modal-close').addEventListener('click', ivGuardedClose);
  document.getElementById('iv-cancel').addEventListener('click', ivGuardedClose);
  document.getElementById('iv-modal-backdrop').addEventListener('click',(e)=>{ if(e.target.id==='iv-modal-backdrop') ivGuardedClose(); });
  // Esto borra la entrevista sin dejar registro histórico (a TODAS las
  // personas del grupo — matrimonio, compañerismo de ministración) —
  // pensado para corregir un error al agendar (ej. quedó duplicada). Si la
  // entrevista se agendó bien pero no se pudo hacer (o ya se hizo), conviene
  // cerrar este formulario y usar los botones ✅/❌ de la lista, para que el
  // motivo quede guardado en el historial.
  if(isEdit) document.getElementById('iv-delete').addEventListener('click', async ()=>{
    if(!(await confirmModal('¿Eliminar esta entrevista? Esto la borra por completo, sin dejar registro histórico. Si ya se hizo (o no se pudo hacer), mejor ciérralo y usa ✅/❌ en la lista para que quede en el historial.', { title:'Eliminar entrevista', confirmText:'Eliminar', danger:true }))) return;
    DB.interviews = DB.interviews.filter((i)=>i.groupId!==existing.id);
    closeModal(); toast('Entrevista eliminada'); renderInterviewsView();
  });

  let ivConflictsChecked = false;
  const ivSaveBtn = document.getElementById('iv-save');
  const resetIvConflictCheck = () => {
    ivConflictsChecked = false;
    ivSaveBtn.textContent = isEdit ? 'Guardar cambios' : 'Agendar';
    document.getElementById('iv-conflict-warning').innerHTML = '';
  };
  const ivForm = document.getElementById('iv-form');
  ['date','startTime','endTime'].forEach((name)=>{ ivForm.querySelector(`[name="${name}"]`)?.addEventListener('change', resetIvConflictCheck); });
  wireLocationField('iv', resetIvConflictCheck);
  document.getElementById('iv-location-other-field').querySelector('input').addEventListener('input', resetIvConflictCheck);

  // Una fila por persona citada (matrimonio, compañerismo de ministración,
  // etc.) — igual patrón que "+ Agregar otro discursante" en Discursos: cada
  // fila tiene su propio buscador con autocompletado (memberPickerFieldHtml),
  // su estadística ("se le ha entrevistado X veces") y su teléfono/email.
  const interviewMemberRowHtml = (rowId, selectedUserId, selectedName, phone, email) => `
    <div class="family-row" data-row-id="${rowId}">
      <div style="display:flex; gap:8px; align-items:flex-start;">
        <div style="flex:1;">
          ${memberPickerFieldHtml(rowId, selectedUserId, selectedName)}
          <div id="${rowId}-stats" class="hint-box" style="margin-top:0; display:none;"></div>
          <div class="two-col" style="margin-top:6px;">
            <div class="field"><input type="text" class="iv-row-phone" placeholder="Teléfono (opcional)" value="${esc(phone||'')}" /></div>
            <div class="field"><input type="email" class="iv-row-email" placeholder="Email (opcional)" value="${esc(email||'')}" /></div>
          </div>
        </div>
        <button type="button" class="btn btn-ghost btn-sm iv-row-remove" title="Quitar a esta persona">${icon('trash')}</button>
      </div>
    </div>`;
  const wireIvMemberRow = (rowEl, rowId) => {
    const nameInput = document.getElementById(`${rowId}-member-name`);
    const hiddenId = document.getElementById(`${rowId}-member-user-id`);
    const statsBox = document.getElementById(`${rowId}-stats`);
    const showRowStats = () => {
      const norm = normalizeSearchText(nameInput.value);
      if(!norm){ statsBox.style.display = 'none'; return; }
      const userId = hiddenId.value;
      const match = userId
        ? DB.interviews.find((i)=>Number(i.memberUserId)===Number(userId))
        : DB.interviews.find((i)=>!i.memberUserId && normalizeSearchText(i.memberName)===norm);
      statsBox.style.display = '';
      if(match){
        const stats = memberInterviewStats(match);
        statsBox.textContent = `Se le ha entrevistado ${stats.timesInterviewed} ${stats.timesInterviewed===1?'vez':'veces'}${stats.lastInterviewDate?' · última vez: '+fmtDateHuman(stats.lastInterviewDate):''}`;
      } else {
        statsBox.textContent = 'Nunca ha sido entrevistado';
      }
    };
    wireMemberPicker(rowId, DB.users, ()=>{ resetIvConflictCheck(); showRowStats(); });
    nameInput.addEventListener('input', showRowStats);
    rowEl.querySelector('.iv-row-remove').addEventListener('click', ()=>{
      const box = rowEl.parentElement;
      if(box.children.length>1){ rowEl.remove(); resetIvConflictCheck(); } // siempre queda al menos una fila
    });
    if(nameInput.value) showRowStats();
  };
  const ivRowsBox = document.getElementById('iv-member-rows');
  let ivRowCounter = 0;
  const addIvRow = (selectedUserId, selectedName, phone, email) => {
    const rowId = `iv-row-${ivRowCounter++}`;
    ivRowsBox.insertAdjacentHTML('beforeend', interviewMemberRowHtml(rowId, selectedUserId, selectedName, phone, email));
    wireIvMemberRow(ivRowsBox.lastElementChild, rowId);
  };
  document.getElementById('iv-add-row').addEventListener('click', ()=>addIvRow());
  if(isEdit && Array.isArray(existing.members) && existing.members.length){
    existing.members.forEach((m)=>addIvRow(m.memberUserId, m.memberName, m.memberPhone, m.memberEmail));
  } else {
    addIvRow(existing?.memberUserId, existing?.memberName, existing?.memberPhone, existing?.memberEmail);
  }

  ivSaveBtn.addEventListener('click', ()=>{
    if(!ivForm.reportValidity()) return;
    const fd = new FormData(ivForm);
    const location = computeLocationFromForm(fd);
    if(fd.get('locationType')==='Otro' && !location){ document.getElementById('iv-error').innerHTML = '<div class="error-msg">Escribe cuál es el lugar</div>'; return; }
    const sala = computeSalaFromForm(fd, location);
    if(STANDARD_LOCATIONS.includes(location) && fd.get('salaType')==='OtraSala' && !sala){ document.getElementById('iv-error').innerHTML = '<div class="error-msg">Escribe cuál es la sala</div>'; return; }
    // memberName/memberUserId no viajan por el FormData (los inputs de cada
    // fila comparten el mismo `name` — solo `id` está prefijado por fila —
    // así que se arma acá el arreglo `members`, uno por fila.
    const rawMembers = Array.from(ivRowsBox.children).map((rowEl)=>{
      const rowId = rowEl.dataset.rowId;
      return {
        memberName: document.getElementById(`${rowId}-member-name`).value.trim(),
        memberUserId: document.getElementById(`${rowId}-member-user-id`).value ? Number(document.getElementById(`${rowId}-member-user-id`).value) : null,
        memberPhone: rowEl.querySelector('.iv-row-phone').value.trim(),
        memberEmail: rowEl.querySelector('.iv-row-email').value.trim(),
      };
    });
    // Se descarta cualquier fila sin nombre, y no se cita dos veces a la
    // misma persona dentro del mismo grupo (por vínculo de cuenta, o por
    // nombre si no está vinculada) — igual criterio que
    // normalizeMembersInput en el servidor real.
    const seen = new Set();
    const members = [];
    for(const m of rawMembers){
      if(!m.memberName) continue;
      const key = m.memberUserId ? `u:${m.memberUserId}` : `n:${normalizeSearchText(m.memberName)}`;
      if(seen.has(key)) continue;
      seen.add(key);
      members.push(m);
    }
    if(!members.length){ document.getElementById('iv-error').innerHTML = '<div class="error-msg">Agrega al menos una persona</div>'; return; }
    const body = Object.fromEntries(fd.entries());
    body.location = location; body.sala = sala;
    delete body.locationType; delete body.locationOther; delete body.salaType; delete body.salaOther;
    const orgId = isEdit ? existing.organizationId : Number(body.organizationId);
    if(!orgAllowsInterviews(orgId)){ document.getElementById('iv-error').innerHTML = '<div class="error-msg">Esta organización no agenda entrevistas</div>'; return; }
    if(!canScheduleOrg(orgId)){ document.getElementById('iv-error').innerHTML = '<div class="error-msg">Solo el líder de la organización o un administrador puede agendar entrevistas</div>'; return; }
    // Con quién se puede agendar una entrevista, según el Manual General —
    // si se cita a más de una persona a la vez (matrimonio, compañerismo de
    // ministración), CADA una debe corresponder individualmente a la
    // organización: no basta con que una sola califique — por ejemplo, el
    // presidente de Cuórum de Élderes no puede entrevistar junto a un
    // matrimonio, porque la esposa por sí sola no corresponde a esa
    // organización (solo el Obispado puede entrevistar a cualquier persona
    // sin restricción, así que un matrimonio o un compañerismo mixto
    // siempre puede agendarse con el Obispado). Solo se puede validar si el
    // nombre está vinculado a una cuenta registrada y esa cuenta ya
    // completó su perfil.
    const eligibilityError = checkGroupEligibility(orgById(orgId), members);
    if(eligibilityError){ document.getElementById('iv-error').innerHTML = `<div class="error-msg">${esc(eligibilityError)}</div>`; return; }

    if(!ivConflictsChecked){
      const conflicts = findConflictingActivities({ ...body, organizationId: orgId }, null, existing?.id);
      if(conflicts.length){
        document.getElementById('iv-conflict-warning').innerHTML = conflictWarningHtml(conflicts);
        ivConflictsChecked = true;
        ivSaveBtn.textContent = 'Agendar de todas formas';
        return;
      }
    }

    const now = new Date().toISOString();
    const sharedPatch = {
      description: body.description||'', location: body.location||'', sala: body.sala||'',
      interviewerName: body.interviewerName||'', interviewerEmail: body.interviewerEmail||'', interviewerPhone: body.interviewerPhone||'',
      date: body.date, startTime: body.startTime, endTime: body.endTime||null, organizationId: orgId,
    };
    if(isEdit){
      // Igual algoritmo que PUT /api/interviews/:id en el servidor real: a
      // quien ya estaba y sigue (mismo memberUserId, o mismo nombre si no
      // está vinculado) se le actualiza su fila conservando su estado/
      // historial; a quien se agrega se le crea una fila nueva; a quien se
      // saca del grupo se le elimina su fila.
      const rows = DB.interviews.filter((i)=>i.groupId===existing.id);
      const usedIds = new Set();
      for(const m of members){
        let row = null;
        if(m.memberUserId) row = rows.find((r)=>!usedIds.has(r.id) && Number(r.memberUserId)===Number(m.memberUserId));
        if(!row){
          const norm = normalizeSearchText(m.memberName);
          row = rows.find((r)=>!usedIds.has(r.id) && !r.memberUserId && normalizeSearchText(r.memberName)===norm);
        }
        if(row){
          usedIds.add(row.id);
          Object.assign(row, sharedPatch, { memberName:m.memberName, memberUserId:m.memberUserId, memberPhone:m.memberPhone, memberEmail:m.memberEmail });
        } else {
          const newRow = { id: nextId('interviews'), groupId: existing.id, memberName:m.memberName, memberUserId:m.memberUserId, memberPhone:m.memberPhone, memberEmail:m.memberEmail, ...sharedPatch, scheduledBy: currentUser.id, status: rows[0]?.status || 'scheduled', comment: rows[0]?.comment || '', markedAt: rows[0]?.markedAt ?? null, markedBy: rows[0]?.markedBy ?? null, createdAt: now };
          DB.interviews.push(newRow);
        }
      }
      const removed = rows.filter((r)=>!usedIds.has(r.id));
      if(removed.length){
        const removedIds = new Set(removed.map((r)=>r.id));
        DB.interviews = DB.interviews.filter((i)=>!removedIds.has(i.id));
      }
    } else {
      let groupId = null;
      for(const m of members){
        const id = nextId('interviews');
        if(groupId===null) groupId = id;
        DB.interviews.push({ id, groupId, memberName:m.memberName, memberUserId:m.memberUserId, memberPhone:m.memberPhone, memberEmail:m.memberEmail, ...sharedPatch, scheduledBy: currentUser.id, status:'scheduled', comment:'', markedAt:null, markedBy:null, createdAt: now });
      }
    }
    closeModal(); toast(isEdit?'Entrevista actualizada':'Entrevista agendada'); renderInterviewsView();
  });
}

// ===================== PRESUPUESTO =====================
// Trimestral: el líder de Obispado asigna un monto a cada organización
// (incluida la suya) y puede crear categorías extra que no son de una sola
// organización (ej. "Actividades de Barrio"). Cada líder ve el presupuesto
// asignado a su propia organización y registra sus gastos, opcionalmente
// ligados a una actividad ya creada. El líder de Obispado además puede
// registrar gastos como Obispado o en cualquier categoría de todo el
// Barrio. Al cambiar de trimestre no se borra nada: los datos de
// trimestres anteriores quedan disponibles a modo de historial (de solo
// lectura), pero no se cuentan en el saldo del trimestre actual.
function quarterOf(dateInput){
  const d = typeof dateInput === 'string' ? new Date(dateInput+'T00:00:00') : dateInput;
  const year = d.getFullYear();
  const q = Math.floor(d.getMonth()/3)+1;
  return `${year}-Q${q}`;
}
function currentQuarter(){ return quarterOf(new Date()); }
function quarterLabelClient(q){
  const m = /^(\d{4})-Q([1-4])$/.exec(q||'');
  return m ? `${m[2]}° trimestre ${m[1]}` : (q||'');
}

// ---------------- Períodos de "Rachas y Logros" (mes/trimestre/semestre/año) ----------------
// Misma matemática que server/src/periods.js — reutiliza quarterOf/
// quarterLabelClient de arriba para el trimestre, y agrega mes/semestre/año.
const PERIOD_TYPES = ['month', 'quarter', 'semester', 'year'];
function lastDayOfMonth(year, monthIndex0){ return new Date(year, monthIndex0+1, 0).getDate(); }
function parseISODateLocal(iso){ const [y,m,d] = iso.split('-').map(Number); return new Date(y, m-1, d); }
function monthKeyOf(dateInput){
  const d = typeof dateInput === 'string' ? parseISODateLocal(dateInput) : dateInput;
  return `${d.getFullYear()}-${pad2(d.getMonth()+1)}`;
}
function semesterKeyOf(dateInput){
  const d = typeof dateInput === 'string' ? parseISODateLocal(dateInput) : dateInput;
  const s = d.getMonth() < 6 ? 1 : 2;
  return `${d.getFullYear()}-S${s}`;
}
function yearKeyOf(dateInput){
  const d = typeof dateInput === 'string' ? parseISODateLocal(dateInput) : dateInput;
  return `${d.getFullYear()}`;
}
function periodKeyOf(periodType, dateInput){
  if(periodType==='month') return monthKeyOf(dateInput);
  if(periodType==='quarter') return quarterOf(dateInput);
  if(periodType==='semester') return semesterKeyOf(dateInput);
  if(periodType==='year') return yearKeyOf(dateInput);
  throw new Error(`Tipo de período desconocido: ${periodType}`);
}
function currentPeriodKey(periodType){ return periodKeyOf(periodType, new Date()); }
function periodRange(periodType, key){
  if(periodType==='month'){
    const [y,m] = key.split('-').map(Number);
    const last = lastDayOfMonth(y, m-1);
    return { start:`${y}-${pad2(m)}-01`, end:`${y}-${pad2(m)}-${pad2(last)}` };
  }
  if(periodType==='quarter'){
    const mth = /^(\d{4})-Q([1-4])$/.exec(key);
    const y = Number(mth[1]); const q = Number(mth[2]);
    const startMonth0 = (q-1)*3; const endMonth0 = startMonth0+2;
    const last = lastDayOfMonth(y, endMonth0);
    return { start:`${y}-${pad2(startMonth0+1)}-01`, end:`${y}-${pad2(endMonth0+1)}-${pad2(last)}` };
  }
  if(periodType==='semester'){
    const mth = /^(\d{4})-S([12])$/.exec(key);
    const y = Number(mth[1]); const s = Number(mth[2]);
    const startMonth0 = s===1 ? 0 : 6; const endMonth0 = startMonth0+5;
    const last = lastDayOfMonth(y, endMonth0);
    return { start:`${y}-${pad2(startMonth0+1)}-01`, end:`${y}-${pad2(endMonth0+1)}-${pad2(last)}` };
  }
  if(periodType==='year'){
    const y = Number(key);
    return { start:`${y}-01-01`, end:`${y}-12-31` };
  }
  throw new Error(`Tipo de período desconocido: ${periodType}`);
}
function periodLabel(periodType, key){
  if(periodType==='month'){
    const [y,m] = key.split('-').map(Number);
    return `${MONTH_LABELS[m-1]} ${y}`;
  }
  if(periodType==='quarter') return quarterLabelClient(key);
  if(periodType==='semester'){
    const m = /^(\d{4})-S([12])$/.exec(key);
    return `${m[2]}° semestre ${m[1]}`;
  }
  if(periodType==='year') return key;
  return key;
}
function previousPeriodKey(periodType, key){
  const { start } = periodRange(periodType, key);
  const d = parseISODateLocal(start);
  d.setDate(d.getDate()-1);
  return periodKeyOf(periodType, d);
}
function isPeriodElapsed(periodType, key, todayISOStr){
  const { end } = periodRange(periodType, key);
  return end < todayISOStr;
}

function fmtMoney(n){
  return new Intl.NumberFormat('es-CL', { style:'currency', currency:'CLP', maximumFractionDigits:0 }).format(Number(n)||0);
}
function isObispadoLeader(user){
  if(!user) return false;
  if(user.role==='admin') return true;
  if(user.role!=='leader') return false;
  const org = orgById(user.organizationId);
  return !!org && org.name==='Obispado';
}
// Punto 51: el módulo de Bienestar es el más restringido de la app — el
// usuario pidió explícitamente que SOLO lo vea el Obispado, el presidente
// del Cuórum de Élderes y la presidenta de Sociedad de Socorro, ni siquiera
// los 3 llamamientos de apoyo al Obispado (que sí ven casi todo lo demás
// vía isObispadoLeader). Por eso exige explícitamente ser el/la titular
// (isPresident) de esas dos organizaciones, calcado del mismo criterio del
// servidor real (isWelfareCommitteeMember en routes/welfare.js).
const WELFARE_COMMITTEE_ORGS = ['Cuórum de Élderes', 'Sociedad de Socorro'];
function isWelfareCommitteeMember(user){
  if(!user) return false;
  if(isObispadoLeader(user)) return true;
  if(user.role!=='leader' || !user.isPresident) return false;
  const org = orgById(user.organizationId);
  return !!org && WELFARE_COMMITTEE_ORGS.includes(org.name);
}
function canSeeWelfareTab(){ return isWelfareCommitteeMember(currentUser); }
// Punto 4 (ampliación) — con quién se puede agendar una entrevista, según
// el Manual General: un hombre adulto con Cuórum de Élderes o con el
// Obispado; una mujer adulta con Sociedad de Socorro o con el Obispado; un
// joven o una joven solo con el Obispado (el Obispo y sus consejeros pueden
// entrevistar a cualquiera, sin restricción).
function computeAge(birthDate){
  if(!birthDate) return null;
  const b = new Date(`${birthDate}T00:00:00`);
  if(Number.isNaN(b.getTime())) return null;
  const now = new Date();
  let age = now.getFullYear() - b.getFullYear();
  const monthDiff = now.getMonth() - b.getMonth();
  if(monthDiff < 0 || (monthDiff===0 && now.getDate() < b.getDate())) age--;
  return age;
}
function isAdultUser(user){
  const age = computeAge(user?.birthDate);
  return age !== null && age >= 18;
}
// true = puede agendarse con esta organización; false = no corresponde;
// null = todavía no se puede determinar porque a `user` le falta el perfil
// (fecha de nacimiento y/o sexo).
function interviewEligibility(orgName, user){
  if(orgName === 'Obispado') return true;
  if(orgName !== 'Cuórum de Élderes' && orgName !== 'Sociedad de Socorro') return true;
  if(!user?.birthDate || !user?.sex) return null;
  if(orgName === 'Cuórum de Élderes') return user.sex === 'M' && isAdultUser(user);
  return user.sex === 'F' && isAdultUser(user); // Sociedad de Socorro
}
// Punto 4 (ampliación): ¿la fecha/hora propuesta cae dentro de alguna
// ventana semanal declarada por el líder? Ver la misma función en db.js.
function interviewAvailabilityMatches(windows, dateStr, startTime){
  if(!Array.isArray(windows) || !windows.length) return false;
  if(!dateStr || !startTime) return false;
  const d = new Date(`${dateStr}T00:00:00`);
  if(Number.isNaN(d.getTime())) return false;
  const weekday = d.getDay();
  return windows.some((w)=>Number(w.weekday)===weekday && startTime>=w.startTime && startTime<w.endTime);
}
// Punto 30: el Secretario de Finanzas tiene, DENTRO del módulo Presupuesto,
// la misma amplitud que un líder de Obispado (todas las categorías) — igual
// que hasFullBudgetAccess() en server/routes/budget.js.
function hasFullBudgetAccess(user){
  return isObispadoLeader(user) || user.role==='financial_clerk';
}
function canOperateOnBudgetCategory(cat){
  const u = currentUser;
  if(!u) return false;
  if(u.role==='admin') return true;
  if(u.role==='financial_clerk') return true;
  if(u.role!=='leader') return false;
  if(cat.categoryType==='organization') return Number(cat.organizationId)===Number(u.organizationId);
  return isObispadoLeader(u);
}
function categoryRefsEqual(a,b){
  if(a.categoryType !== b.categoryType) return false;
  if(a.categoryType==='organization') return Number(a.organizationId)===Number(b.organizationId);
  return Number(a.budgetCategoryId)===Number(b.budgetCategoryId);
}
function allCategoryRefs(){
  return [
    ...DB.organizations.map((o)=>({ categoryType:'organization', organizationId:o.id, budgetCategoryId:null })),
    ...DB.budgetCategories.map((c)=>({ categoryType:'custom', organizationId:null, budgetCategoryId:c.id })),
  ];
}
function withCategoryInfo(ref){
  if(ref.categoryType==='organization'){
    const org = orgById(ref.organizationId);
    return { categoryType:'organization', organizationId:ref.organizationId, budgetCategoryId:null, categoryName: org?.name||'(organización eliminada)', categoryColor: org?.color||'#999999' };
  }
  const cat = DB.budgetCategories.find((c)=>c.id===Number(ref.budgetCategoryId));
  return { categoryType:'custom', organizationId:null, budgetCategoryId:ref.budgetCategoryId, categoryName: cat?.name||'(categoría eliminada)', categoryColor:'#8b6fd6' };
}
function withExpenseInfo(e){
  const event = e.eventId ? DB.events.find((ev)=>ev.id===Number(e.eventId)) : null;
  const registeredByUser = DB.users.find((u)=>u.id===Number(e.registeredBy));
  return { ...e, eventTitle: event?event.title:null, registeredByName: registeredByUser?registeredByUser.name:'' };
}
function budgetSummaryFor(quarter, ref){
  const alloc = DB.budgetAllocations.find((a)=>a.quarter===quarter && categoryRefsEqual(a, ref));
  const expenses = DB.budgetExpenses.filter((e)=>e.quarter===quarter && categoryRefsEqual(e, ref)).sort((a,b)=>(b.date+String(b.id)).localeCompare(a.date+String(a.id)));
  const spent = expenses.reduce((s,e)=>s+Number(e.amount||0),0);
  const assigned = alloc ? Number(alloc.amount) : 0;
  return { ...withCategoryInfo(ref), assigned, spent, balance: assigned-spent, hasAllocation: !!alloc, expenses: expenses.map(withExpenseInfo) };
}
function budgetQuartersData(){
  const set = new Set([currentQuarter()]);
  DB.budgetAllocations.forEach((a)=>set.add(a.quarter));
  DB.budgetExpenses.forEach((e)=>set.add(e.quarter));
  return { quarters: [...set].sort().reverse(), currentQuarter: currentQuarter() };
}
function setBudgetAllocation(quarter, ref, amount){
  if(!hasFullBudgetAccess(currentUser)) throw new Error('Solo el líder de Obispado (o el Secretario de Finanzas) puede asignar presupuesto');
  if(quarter !== currentQuarter()) throw new Error('Solo se puede asignar presupuesto para el trimestre actual');
  const existing = DB.budgetAllocations.find((a)=>a.quarter===quarter && categoryRefsEqual(a, ref));
  if(existing){ existing.amount = amount; }
  else { DB.budgetAllocations.push({ id: nextId('budgetAllocations'), quarter, categoryType: ref.categoryType, organizationId: ref.organizationId, budgetCategoryId: ref.budgetCategoryId, amount, setBy: currentUser.id }); }
}
function addBudgetExpense(ref, { amount, description, date, eventId }){
  if(!canOperateOnBudgetCategory(ref)) throw new Error('No tienes permiso para registrar gastos en esta categoría');
  // Punto 12 (Manual General 20.2.6): un líder común ya no registra el
  // gasto directo — primero debe pasar por "Solicitar aprobación de
  // gasto" para que el Obispado lo apruebe. Este camino directo queda
  // solo para el Obispado/Admin (pedirse aprobación a sí mismos no
  // aportaría nada).
  if(!hasFullBudgetAccess(currentUser)) throw new Error('Los gastos requieren aprobación previa del Obispado — usa "Solicitar aprobación de gasto" en vez de registrar el gasto directo');
  if(!description || !date) throw new Error('Faltan campos requeridos (descripción, fecha)');
  if(!(amount > 0)) throw new Error('Monto inválido');
  const quarter = quarterOf(date);
  if(quarter !== currentQuarter()) throw new Error('Solo se pueden registrar gastos del trimestre actual (fecha dentro del trimestre en curso)');
  DB.budgetExpenses.push({ id: nextId('budgetExpenses'), quarter, categoryType: ref.categoryType, organizationId: ref.organizationId, budgetCategoryId: ref.budgetCategoryId, amount, description, date, eventId: eventId||null, registeredBy: currentUser.id });
}

// Punto 12 — Solicitud de aprobación de gasto: cualquier gasto de un líder
// común pasa primero por acá (antes de gastar, como pide el Manual General
// 20.2.6), en vez de registrarse directo. El Obispado/Admin la aprueba o
// la rechaza más abajo. Aplica a TODOS los gastos, sin un monto mínimo.
function withExpenseRequestInfo(r){
  const event = r.eventId ? DB.events.find((e)=>e.id===Number(r.eventId)) : null;
  const requestedByUser = DB.users.find((u)=>u.id===Number(r.requestedBy));
  const decidedByUser = r.decidedBy ? DB.users.find((u)=>u.id===Number(r.decidedBy)) : null;
  return { ...withCategoryInfo({ categoryType:r.categoryType, organizationId:r.organizationId, budgetCategoryId:r.budgetCategoryId }), ...r,
    eventTitle: event ? event.title : null, requestedByName: requestedByUser?requestedByUser.name:'', decidedByName: decidedByUser?decidedByUser.name:null };
}
function expenseRequestsForCurrentUser(){
  const items = hasFullBudgetAccess(currentUser) ? DB.budgetExpenseRequests : DB.budgetExpenseRequests.filter((r)=>Number(r.requestedBy)===Number(currentUser.id));
  return items.map(withExpenseRequestInfo).sort((a,b)=>b.createdAt.localeCompare(a.createdAt));
}
function requestBudgetExpense(ref, { amount, description, date, eventId }){
  if(!canOperateOnBudgetCategory(ref)) throw new Error('No tienes permiso para solicitar gastos en esta categoría');
  if(!description || !date) throw new Error('Faltan campos requeridos (descripción, fecha)');
  if(!(amount > 0)) throw new Error('Monto inválido');
  const r = { id: nextId('budgetExpenseRequests'), categoryType: ref.categoryType, organizationId: ref.organizationId, budgetCategoryId: ref.budgetCategoryId, amount, description, date, eventId: eventId||null, requestedBy: currentUser.id, createdAt: new Date().toISOString(), status:'pending', decidedBy:null, decidedAt:null, decisionComment:'', resultingExpenseId:null };
  DB.budgetExpenseRequests.push(r);
  return r;
}
function approveBudgetExpenseRequest(id, comment){
  if(!hasFullBudgetAccess(currentUser)) throw new Error('Solo el Obispado, el Administrador, o el Secretario de Finanzas pueden aprobar solicitudes de gasto');
  const r = DB.budgetExpenseRequests.find((x)=>x.id===id);
  if(!r) throw new Error('Solicitud no encontrada');
  if(r.status!=='pending') throw new Error('Esta solicitud ya fue decidida');
  // Se revalida contra el trimestre actual — puede haber pasado tiempo
  // entre que se pidió y que se aprueba.
  const quarter = quarterOf(r.date);
  if(quarter !== currentQuarter()) throw new Error('La fecha del gasto ya no cae dentro del trimestre actual — pide que se solicite de nuevo con una fecha vigente');
  const now = new Date().toISOString();
  const e = { id: nextId('budgetExpenses'), quarter, categoryType: r.categoryType, organizationId: r.organizationId, budgetCategoryId: r.budgetCategoryId, amount: r.amount, description: r.description, date: r.date, eventId: r.eventId, registeredBy: r.requestedBy };
  DB.budgetExpenses.push(e);
  Object.assign(r, { status:'approved', decidedBy: currentUser.id, decidedAt: now, decisionComment: String(comment||'').trim(), resultingExpenseId: e.id });
}
function rejectBudgetExpenseRequest(id, comment){
  if(!hasFullBudgetAccess(currentUser)) throw new Error('Solo el Obispado, el Administrador, o el Secretario de Finanzas pueden rechazar solicitudes de gasto');
  const r = DB.budgetExpenseRequests.find((x)=>x.id===id);
  if(!r) throw new Error('Solicitud no encontrada');
  if(r.status!=='pending') throw new Error('Esta solicitud ya fue decidida');
  Object.assign(r, { status:'rejected', decidedBy: currentUser.id, decidedAt: new Date().toISOString(), decisionComment: String(comment||'').trim() });
}
function withdrawBudgetExpenseRequest(id){
  const r = DB.budgetExpenseRequests.find((x)=>x.id===id);
  if(!r) throw new Error('Solicitud no encontrada');
  if(Number(r.requestedBy)!==Number(currentUser.id) && currentUser.role!=='admin') throw new Error('Solo quien la solicitó (o un Administrador) puede retirarla');
  if(r.status!=='pending') throw new Error('Solo se puede retirar una solicitud todavía pendiente');
  DB.budgetExpenseRequests = DB.budgetExpenseRequests.filter((x)=>x.id!==id);
}
function updateBudgetExpense(id, patch){
  const e = DB.budgetExpenses.find((x)=>x.id===id);
  if(!e) throw new Error('Gasto no encontrado');
  if(!canOperateOnBudgetCategory(e)) throw new Error('No tienes permiso para editar este gasto');
  if(e.quarter !== currentQuarter()) throw new Error('Los gastos de trimestres anteriores quedan como historial y no se pueden editar');
  const newDate = patch.date ?? e.date;
  if(quarterOf(newDate) !== currentQuarter()) throw new Error('La fecha debe seguir dentro del trimestre actual');
  if(!(patch.amount > 0)) throw new Error('Monto inválido');
  Object.assign(e, { description: patch.description ?? e.description, date: newDate, amount: patch.amount, eventId: patch.eventId !== undefined ? patch.eventId : e.eventId });
}
function deleteBudgetExpense(id){
  const e = DB.budgetExpenses.find((x)=>x.id===id);
  if(!e) throw new Error('Gasto no encontrado');
  if(!canOperateOnBudgetCategory(e)) throw new Error('No tienes permiso para eliminar este gasto');
  if(e.quarter !== currentQuarter()) throw new Error('Los gastos de trimestres anteriores quedan como historial y no se pueden eliminar');
  DB.budgetExpenses = DB.budgetExpenses.filter((x)=>x.id!==id);
}
function createBudgetCategory(name){
  if(!hasFullBudgetAccess(currentUser)) throw new Error('Solo el líder de Obispado (o el Secretario de Finanzas) puede crear categorías de presupuesto');
  name = String(name||'').trim();
  if(!name) throw new Error('Falta el nombre de la categoría');
  if(DB.budgetCategories.some((c)=>c.name.toLowerCase()===name.toLowerCase())) throw new Error('Ya existe una categoría con ese nombre');
  const cat = { id: nextId('budgetCategories'), name, createdBy: currentUser.id };
  DB.budgetCategories.push(cat);
  return cat;
}

function renderBudgetView(){
  const container = document.getElementById('view-root');
  const quartersData = budgetQuartersData();
  if(!state.budgetQuarter || !quartersData.quarters.includes(state.budgetQuarter)) state.budgetQuarter = quartersData.currentQuarter;
  const quarter = state.budgetQuarter;
  const isCurrentQuarter = quarter === quartersData.currentQuarter;
  const isObispado = hasFullBudgetAccess(currentUser);
  const refs = isObispado ? allCategoryRefs() : [{ categoryType:'organization', organizationId: currentUser.organizationId, budgetCategoryId: null }];
  const categories = refs.map((ref)=>budgetSummaryFor(quarter, ref));

  // Punto 12: para el Obispado/Admin, la bandeja de solicitudes de gasto
  // pendientes de aprobar; para cualquier otro líder, el estado de las
  // solicitudes que él mismo ha hecho.
  const expenseRequests = expenseRequestsForCurrentUser();
  const pendingRequests = expenseRequests.filter((r)=>r.status==='pending');
  const decidedRequests = expenseRequests.filter((r)=>r.status!=='pending');

  container.innerHTML = `
    <div class="section-header">
      <div>
        <h2>Presupuesto</h2>
        <p>${isObispado ? 'Asigna el presupuesto trimestral de cada organización (incluida Obispado) y registra tus propios gastos o los de actividades de todo el Barrio.' : 'Presupuesto asignado a tu organización para este trimestre, y registro de tus gastos.'}</p>
      </div>
      <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
        <select id="budget-quarter-select">
          ${quartersData.quarters.map((q)=>`<option value="${q}" ${q===quarter?'selected':''}>${esc(quarterLabelClient(q))}${q===quartersData.currentQuarter?' (actual)':''}</option>`).join('')}
        </select>
        ${categories.length ? `
        <button class="btn btn-secondary btn-sm" id="budget-export-csv" title="Exportar a CSV">⬇️ CSV</button>
        <button class="btn btn-secondary btn-sm" id="budget-export-pdf" title="Imprimir / Descargar PDF">🖨️ PDF</button>` : ''}
        ${isObispado ? `<button class="btn btn-secondary" id="budget-new-category">+ Nueva categoría</button>` : ''}
      </div>
    </div>
    ${!isCurrentQuarter ? `<div class="hint-box">Estás viendo un trimestre anterior, a modo de historial de consulta — no se puede editar. Para agregar asignaciones o gastos, vuelve al trimestre actual con el selector de arriba.</div>` : ''}
    <div class="card-list" id="budget-cats">
      ${categories.length ? categories.map((cat)=>budgetCategoryCardHtml(cat, isCurrentQuarter, isObispado)).join('') : emptyStateHtml('Todavía no hay categorías de presupuesto', (isObispado && isCurrentQuarter) ? { id:'budget-empty-new', label:'+ Crear la primera' } : null)}
    </div>
    ${isObispado ? `
      <div style="margin:24px 0 8px;">
        <h3 style="font-size:14px; color:var(--celeste-darker); margin-bottom:8px;">📋 Solicitudes de gasto pendientes de aprobación${pendingRequests.length ? ` (${pendingRequests.length})` : ''}</h3>
        <div class="card-list">
          ${pendingRequests.length ? pendingRequests.map((r)=>expenseRequestRowHtml(r, { showActions:true })).join('') : '<div class="empty-state">No hay solicitudes pendientes</div>'}
        </div>
        ${decidedRequests.length ? `
        <button type="button" class="btn btn-secondary btn-sm" id="exp-req-history-toggle" style="margin-top:10px;">
          ${state.expenseRequestsHistoryOpen ? '▲ Ocultar historial' : `📜 Ver historial (${decidedRequests.length} solicitud${decidedRequests.length===1?'':'es'} decidida${decidedRequests.length===1?'':'s'})`}
        </button>
        <div class="card-list" style="margin-top:10px;">${state.expenseRequestsHistoryOpen ? decidedRequests.map((r)=>expenseRequestRowHtml(r, {})).join('') : ''}</div>` : ''}
      </div>
    ` : (expenseRequests.length ? `
      <div style="margin:24px 0 8px;">
        <h3 style="font-size:14px; color:var(--celeste-darker); margin-bottom:8px;">📋 Mis solicitudes de gasto</h3>
        <div class="card-list">${expenseRequests.map((r)=>expenseRequestRowHtml(r, { showWithdraw: r.status==='pending' && isCurrentQuarter })).join('')}</div>
      </div>
    ` : '')}`;

  document.getElementById('budget-quarter-select').addEventListener('change', (e)=>{ state.budgetQuarter = e.target.value; renderBudgetView(); });
  if(isObispado) document.getElementById('budget-new-category').addEventListener('click', ()=>openBudgetCategoryModal());
  const budgetCsvBtn = document.getElementById('budget-export-csv');
  const budgetPdfBtn = document.getElementById('budget-export-pdf');
  if(budgetCsvBtn) budgetCsvBtn.addEventListener('click', ()=>{
    downloadCsv(`presupuesto-${quarter}.csv`, ['Categoría','Asignado','Gastado','Saldo'],
      categories.map((c)=>[c.categoryName, c.assigned, c.spent, c.balance]));
  });
  if(budgetPdfBtn) budgetPdfBtn.addEventListener('click', ()=>{
    printReport(`Presupuesto — ${quarterLabelClient(quarter)}`, `Generado ${fmtDateHuman(toISODate(new Date()))}`,
      ['Categoría','Asignado','Gastado','Saldo'],
      categories.map((c)=>[c.categoryName, fmtMoney(c.assigned), fmtMoney(c.spent), fmtMoney(c.balance)]));
  });
  wireEmptyStateCta('budget-empty-new', ()=>openBudgetCategoryModal());
  wireBudgetCategoryCards(categories, isCurrentQuarter, isObispado);
  wireExpenseRequestActions();
  const expReqHistoryToggle = document.getElementById('exp-req-history-toggle');
  if(expReqHistoryToggle) expReqHistoryToggle.addEventListener('click', ()=>{ state.expenseRequestsHistoryOpen = !state.expenseRequestsHistoryOpen; renderBudgetView(); });
}

function budgetCategoryCardHtml(cat, isCurrentQuarter, isObispado){
  const canAllocate = isObispado && isCurrentQuarter;
  const canExpense = canOperateOnBudgetCategory(cat) && isCurrentQuarter;
  const balanceColor = cat.balance < 0 ? 'var(--danger)' : 'inherit';
  return `
    <div class="budget-card" data-cat-type="${cat.categoryType}" data-org-id="${cat.organizationId||''}" data-cat-id="${cat.budgetCategoryId||''}">
      <div class="budget-card-head">
        <div class="budget-card-name">
          <span style="display:inline-block;width:11px;height:11px;border-radius:50%;background:${cat.categoryColor};"></span>
          <strong style="font-size:15px;">${esc(cat.categoryName)}</strong>
        </div>
        <div class="budget-figures">
          <div><span class="bf-label">Asignado</span><strong>${fmtMoney(cat.assigned)}</strong></div>
          <div><span class="bf-label">Gastado</span><strong>${fmtMoney(cat.spent)}</strong></div>
          <div><span class="bf-label">Saldo</span><strong style="color:${balanceColor};">${fmtMoney(cat.balance)}</strong></div>
        </div>
      </div>
      ${canAllocate ? `
        <div class="budget-alloc-row">
          <input type="number" min="0" step="1" class="budget-alloc-input" value="${cat.assigned}" />
          <button type="button" class="btn btn-secondary btn-sm budget-alloc-save">Guardar asignación</button>
        </div>` : ''}
      <div class="budget-actions-row">
        <button type="button" class="btn btn-ghost btn-sm budget-toggle-expenses">${cat.expenses.length ? `Ver gastos (${cat.expenses.length})` : 'Sin gastos registrados'}</button>
        ${canExpense ? (isObispado
          ? `<button type="button" class="btn btn-primary btn-sm budget-add-expense">+ Registrar gasto</button>`
          // Punto 12: un líder común no registra el gasto directo — primero
          // pide aprobación al Obispado (Manual General 20.2.6).
          : `<button type="button" class="btn btn-primary btn-sm budget-request-expense">📋 Solicitar aprobación de gasto</button>`) : ''}
      </div>
      <div class="budget-expenses-list" style="display:none;">
        ${cat.expenses.length ? cat.expenses.map((e)=>budgetExpenseRowHtml(e, canExpense)).join('') : '<div class="empty-state" style="padding:8px;">Sin gastos registrados</div>'}
      </div>
    </div>`;
}
function budgetExpenseRowHtml(e, canEdit){
  return `
    <div class="budget-expense-row" data-expense-id="${e.id}">
      <div>
        <div>${esc(e.description)}${e.eventTitle ? ` · <span style="color:var(--celeste-dark);">🔗 ${esc(e.eventTitle)}</span>` : ''}</div>
        <div style="color:var(--ink-soft); font-size:12px;">${esc(fmtDateHuman(e.date))}${e.registeredByName ? ' · '+esc(e.registeredByName) : ''}</div>
      </div>
      <div style="display:flex; align-items:center; gap:10px;">
        <strong>${fmtMoney(e.amount)}</strong>
        ${canEdit ? `<button type="button" class="btn btn-ghost btn-sm budget-edit-expense" title="Editar">${icon('edit')}</button><button type="button" class="btn btn-ghost btn-sm budget-delete-expense" title="Eliminar">${icon('trash')}</button>` : ''}
      </div>
    </div>`;
}
function wireBudgetCategoryCards(categories){
  document.querySelectorAll('#budget-cats > .budget-card').forEach((card, idx)=>{
    const cat = categories[idx];
    card.querySelector('.budget-toggle-expenses')?.addEventListener('click', ()=>{
      const list = card.querySelector('.budget-expenses-list');
      list.style.display = list.style.display==='none' ? '' : 'none';
    });
    const allocInput = card.querySelector('.budget-alloc-input');
    const allocSaveBtn = card.querySelector('.budget-alloc-save');
    if(allocSaveBtn){
      allocSaveBtn.addEventListener('click', ()=>{
        const amount = Number(allocInput.value);
        if(!Number.isFinite(amount) || amount<0){ toast('Monto inválido','error'); return; }
        try { setBudgetAllocation(state.budgetQuarter, cat, amount); toast('Asignación guardada'); renderBudgetView(); }
        catch(e){ toast(e.message,'error'); }
      });
    }
    card.querySelector('.budget-add-expense')?.addEventListener('click', ()=>openBudgetExpenseModal(cat));

function openBudgetExpenseModal(cat, existing=null){

    ? DB.events.filter((ev)=>Number(ev.organizationId)===Number(cat.organizationId))

  const modalRoot = document.getElementById('modal-root');
  modalRoot.innerHTML = `<div class="modal-backdrop" id="be-modal-backdrop"><div class="modal">

    </div></div></div>`;

  document.getElementById('be-modal-backdrop').addEventListener('click', (e)=>{ if(e.target.id==='be-modal-backdrop') beGuardedClose(); });

    try { deleteBudgetExpense(existing.id); closeModal(); toast('Gasto eliminado'); renderBudgetView(); }
    catch(e){ toast(e.message,'error'); }
  });
  const form = document.getElementById('be-form');
  document.getElementById('be-save').addEventListener('click', ()=>{
    if(!form.reportValidity()) return;
    const fd = new FormData(form);
    const body = Object.fromEntries(fd.entries());
    const amount = Number(body.amount);
    const eventId = body.eventId ? Number(body.eventId) : null;
    try {
      if(isEdit) updateBudgetExpense(existing.id, { description: body.description, date: body.date, amount, eventId });
      else addBudgetExpense(cat, { amount, description: body.description, date: body.date, eventId });
      closeModal();
      toast(isEdit?'Gasto actualizado':'Gasto registrado');
      renderBudgetView();
    } catch(e){ document.getElementById('be-error').innerHTML = `<div class="error-msg">${esc(e.message)}</div>`; }
  });

  content.innerHTML = `
    <div class="hint-box" style="margin-bottom:14px;">

      <br/><br/><em>Nota de este demo: al no haber un servidor real, "Guardar y sincronizar" y "Sincronizar ahora" no descargan nada de verdad — solo muestran cómo se vería.</em>

    <form id="stake-config-form" style="max-width:560px; margin-top:14px;">

      <div class="field"><label>Nombre a mostrar</label><input type="text" name="displayName" placeholder="Ej: Estaca Colina Chile" value="${esc(sc.displayName||'')}" /></div>
      <div class="field">
        <label>Palabras que NO restringen (una por línea)</label>
        <textarea name="nonBlockingKeywords" rows="5" placeholder="entrevista&#10;presidencia de estaca&#10;sumo consejo">${esc(keywordsText)}</textarea>
        <div style="font-size:12px; color:var(--ink-soft); margin-top:4px;">Si el título de una actividad de Estaca contiene alguna de estas palabras (sin importar mayúsculas o tildes), NO bloquea nada — es informativa.</div>

      <div class="field">
        <label style="display:flex; align-items:center; gap:8px; font-weight:600;">

        </label>

      </div>
    </form>
    <div style="display:flex; gap:8px;">
      <button class="btn btn-primary" id="stake-config-save">Guardar y sincronizar</button>

// ==================================================================
// ---------------- Reuniones y Asignaciones ----------------
// ==================================================================
// Los 3 llamamientos de apoyo al Obispado (Punto 28/29/30) también pueden
// recibir un compromiso directo desde un acta — no son "líder", pero sí
// asisten a las reuniones del Obispado y son una mayordomía válida a la que
// asignar algo.
const STAFF_ROLES = ['executive_secretary', 'ward_clerk', 'financial_clerk'];
function assignableUsersFor(user){
  // El Secretario de Barrio arma las actas de Consejo de Barrio, donde
  // participan TODAS las organizaciones — así que, igual que un líder de
  // Obispado, debe poder repartir compromisos entre cualquier presidencia
  // del Barrio, no solo entre el propio Obispado.
  const privileged = isObispadoLeader(user) || user.role==='ward_clerk';
  const pool = privileged
    ? DB.users.filter((u)=>u.role==='leader' || u.role==='admin' || STAFF_ROLES.includes(u.role))
    : DB.users.filter((u)=>u.role==='leader' && Number(u.organizationId)===Number(user.organizationId));
  return pool.map((u)=>({ id:u.id, name:u.name, role:u.role, organizationId:u.organizationId })).sort((a,b)=>a.name.localeCompare(b.name,'es'));
}
function findMeetingWithCommitment(commitmentId){
  for(const m of DB.meetings){
    const c = (m.commitments||[]).find((x)=>x.id===commitmentId);
    if(c) return { meeting:m, commitment:c };
  }
  return null;
}
// Punto 9 — actas y compromisos confidenciales: un acta completa (o un
// compromiso puntual) puede marcarse confidencial. Solo Obispado/Admin,
// quien creó el acta y (para un compromiso) su propio responsable ven el
// contenido completo — el resto lo ve redactado. Sin `meeting` (como en
// myAssignments, donde el compromiso siempre es el tuyo propio) nunca se
// redacta.
function canSeeMeetingFullContent(meeting){
  if (!meeting.confidential) return true;
  if (isObispadoLeader(currentUser)) return true;
  return Number(currentUser.id) === Number(meeting.createdBy);
}
function commitmentVisibleFully(meeting, c){
  if (!meeting) return true;
  if (isObispadoLeader(currentUser)) return true;
  if (Number(currentUser.id) === Number(meeting.createdBy)) return true;
  if (Number(currentUser.id) === Number(c.assignedToUserId)) return true;
  return !meeting.confidential && !c.confidential;
}
function withCommitmentInfo(c, meeting){
  const isOverdue = c.status==='pending' && !!c.dueDate && c.dueDate < todayISO(0);
  const u = DB.users.find((x)=>x.id===Number(c.assignedToUserId));
  const visible = commitmentVisibleFully(meeting, c);
  return {
    ...c, assignedToName: u ? u.name : '(usuario eliminado)', isOverdue, displayStatus: c.status==='pending' ? (isOverdue?'overdue':'pending') : c.status,
    description: visible ? c.description : '(Compromiso confidencial)',
    completionComment: visible ? c.completionComment : '',
    redacted: !visible,
  };
}
function withMeetingInfo(m){
  const org = orgById(m.organizationId);
  const creator = DB.users.find((u)=>u.id===Number(m.createdBy));
  const fullContent = canSeeMeetingFullContent(m);
  return {
    ...m, organizationName: org?.name || (m.organizationId?'':'Administración'), createdByName: creator?creator.name:'(usuario eliminado)',
    commitments:(m.commitments||[]).map((c)=>withCommitmentInfo(c, m)),
    contentRedacted: !fullContent,
    agendaItems: fullContent ? (m.agendaItems||[]) : (m.agendaItems||[]).map((a)=>({ ...a, topic:'(Tema confidencial)', presenter:'', notes:'', necesidad:'', analisis:'', acuerdo:'', seguimiento:'', quienNecesita:'', queSeHara:'', quienLoHara:'' })),
  };
}
// Punto 8/10: fecha de la última acta de un tipo dado (cualquier status).
function lastMeetingDateOfType(type){
  const dates = DB.meetings.filter((m)=>m.type===type).map((m)=>m.date).sort();
  return dates.length ? dates[dates.length-1] : null;
}
function canEditMeeting(user, meeting){ return user.role==='admin' || Number(user.id)===Number(meeting.createdBy); }
// Panel personal "Mis Asignaciones": solo compromisos que siguen pendientes
// — los completados ya no hace falta revisarlos, y los que quedaron "no
// cumplida" al archivar el acta ya no son accionables.
function myAssignments(user){
  const mine = [];
  for(const m of DB.meetings){
    for(const c of (m.commitments||[])){
      if(Number(c.assignedToUserId)!==Number(user.id)) continue;
      if(c.status!=='pending') continue;
      mine.push({ ...withCommitmentInfo(c), meetingId:m.id, meetingTitle:m.title });
    }
  }
  return mine.sort((a,b)=>a.dueDate.localeCompare(b.dueDate));
}

function wireAssignmentBulkBar(){
  const bulkBar = document.getElementById('assign-bulk-bar');
  if(!bulkBar) return;
  const bulkCount = document.getElementById('assign-bulk-count');
  const updateBulkBar = () => {
    const checked = document.querySelectorAll('.assignment-select-cb:checked');
    bulkBar.style.display = checked.length ? 'flex' : 'none';
    if(bulkCount) bulkCount.textContent = `${checked.length} seleccionado${checked.length===1?'':'s'}`;
  };
  document.querySelectorAll('.assignment-select-cb').forEach((cb)=>cb.addEventListener('change', updateBulkBar));
  document.getElementById('assign-bulk-clear').addEventListener('click', ()=>{
    document.querySelectorAll('.assignment-select-cb:checked').forEach((cb)=>{ cb.checked = false; });
    updateBulkBar();
  });
  document.getElementById('assign-bulk-complete').addEventListener('click', async ()=>{
    const ids = Array.from(document.querySelectorAll('.assignment-select-cb:checked'))
      .map((cb)=>Number(cb.closest('.assignment-card').dataset.id));
    if(!ids.length) return;
    if(!(await confirmModal(`¿Marcar ${ids.length} compromiso${ids.length===1?'':'s'} como completado${ids.length===1?'':'s'}?`, { title:'Completar seleccionados', confirmText:'Completar' }))) return;
    let okCount = 0;
    for(const id of ids){
      const found = findMeetingWithCommitment(id);
      if(found){
        Object.assign(found.commitment, { status:'completed', completedAt:new Date().toISOString(), completionComment:'' });
        okCount++;
      }
    }
    if(okCount) toast(`${okCount} compromiso${okCount===1?'':'s'} completado${okCount===1?'':'s'}`);
    renderMyAssignments();
  });
}

function wireAssignmentCards(){
  wireAssignmentBulkBar();
  document.querySelectorAll('.assignment-card').forEach((card)=>{
    const id = Number(card.dataset.id);
    const form = card.querySelector('.assignment-complete-form');
    card.querySelector('.assignment-complete-toggle').addEventListener('click', ()=>{ form.style.display = form.style.display==='none' ? '' : 'none'; });
    card.querySelector('.assignment-complete-save').addEventListener('click', ()=>{
      const found = findMeetingWithCommitment(id);
      if(!found){ toast('Compromiso no encontrado', 'error'); return; }
      const comment = card.querySelector('.assignment-comment').value.trim();
      Object.assign(found.commitment, { status:'completed', completedAt:new Date().toISOString(), completionComment:comment });
      toast('Compromiso completado');
      renderMyAssignments();
    });
  });
}

function renderMeetingsManage(){
  const content = document.getElementById('meetings-content');
  // Visibilidad de las actas: por ahora, cada organización ve solo las
  // suyas — igual que en Entrevistas — salvo el líder de Obispado (o el
  // Administrador), que ve las actas de todas las organizaciones. Esto no
  // afecta "Mis Asignaciones" (myAssignments): los compromisos que te
  // asignaron desde el acta de otra organización siguen apareciendo ahí.
  const visible = isObispadoLeader(currentUser)
    ? DB.meetings
    : DB.meetings.filter((m)=>Number(m.organizationId)===Number(currentUser.organizationId));
  const meetings = visible.map(withMeetingInfo).sort((a,b)=>(b.date+String(b.id)).localeCompare(a.date+String(a.id)));
  const active = meetings.filter((m)=>m.status==='active');
  const archived = meetings.filter((m)=>m.status==='archived');
  content.innerHTML = `
    <div style="display:flex; justify-content:flex-end; margin-bottom:12px;"><button class="btn btn-primary" id="meeting-new">+ Nueva acta</button></div>
    <div class="card-list">${active.length ? active.map(meetingCardHtml).join('') : emptyStateHtml('No hay actas activas', { id:'meeting-empty-new', label:'+ Crear la primera' })}</div>
    ${archived.length ? `
      <div style="margin-top:22px;">
        <h3 style="font-size:14px; color:var(--celeste-darker); margin-bottom:8px;">📁 Reuniones Pasadas</h3>
        <div class="card-list">${archived.map(meetingCardHtml).join('')}</div>
      </div>` : ''}`;
  document.getElementById('meeting-new').addEventListener('click', openMeetingModal);
  wireEmptyStateCta('meeting-empty-new', openMeetingModal);
  wireMeetingCards(meetings);
}

const MEETING_TYPE_LABELS = { general:'', consejo_barrio:'⛪ Consejo de Barrio', coordinacion_ministracion:'🤝 Coordinación de Ministración' };
function meetingCardHtml(m){
  const done = m.commitments.filter((c)=>c.status==='completed').length;
  const total = m.commitments.length;
  const typeLabel = MEETING_TYPE_LABELS[m.type] || '';
  return `
    <div class="list-card meeting-card" data-id="${m.id}" style="cursor:pointer;">
      <div class="lc-main">
        <div class="lc-title">${m.confidential?icon('lock')+' ':''}${esc(m.title)}${typeLabel?` <span style="font-weight:400; font-size:12px; color:var(--celeste-dark);">· ${typeLabel}</span>`:''}${m.status==='archived'?' <span style="font-weight:400; font-size:12px; color:var(--ink-soft);">(archivada)</span>':''}</div>
        <div class="lc-sub">${esc(m.organizationName)} · ${esc(fmtDateHuman(m.date))} · ${m.contentRedacted ? 'contenido confidencial' : `${done}/${total} compromiso${total===1?'':'s'} completado${total===1?'':'s'}`}</div>
      </div>
    </div>`;
}

function wireMeetingCards(meetings){
  document.querySelectorAll('.meeting-card').forEach((card)=>{
    card.addEventListener('click', ()=>{
      const raw = DB.meetings.find((x)=>x.id===Number(card.dataset.id));
      if(raw) openMeetingDetailModal(withMeetingInfo(raw));
    });
  });
}

function commitmentStatusPillHtml(c){
  const map = { pending:['status-amber','Pendiente'], overdue:['status-red','Atrasado'], completed:['status-green','Completado'], not_fulfilled:['status-gray','No cumplida'] };
  const [cls,label] = map[c.displayStatus] || ['status-gray', c.status];
  return `<span class="status-pill ${cls}">${label}</span>`;
}

function openMeetingModal(){
  const assignable = assignableUsersFor(currentUser);
  if(!assignable.length){ toast('No hay líderes disponibles para asignar compromisos todavía', 'error'); return; }
  const commitmentRowHtml = () => `
    <div class="commitment-row">
      <div class="field" style="margin-bottom:8px;"><label>Compromiso</label><input type="text" class="cr-desc" required placeholder="Ej: Coordinar transporte" /></div>
      <div class="two-col">
        <div class="field"><label>Responsable</label><select class="cr-assignee" required>
          <option value="" disabled selected>Elegir…</option>
          ${assignable.map((u)=>`<option value="${u.id}">${esc(u.name)}${u.role==='admin'?' (Administrador)':''}</option>`).join('')}
        </select></div>
        <div class="field"><label>Fecha límite / verificación</label><input type="date" class="cr-due" required /></div>
      </div>
      <button type="button" class="btn btn-ghost btn-sm cr-remove">${icon('trash')} Quitar compromiso</button>
    </div>`;
  // Punto 7: un tema de agenda es solo un título + quién lo presenta — las
  // notas/decisión se completan durante o después de la reunión, desde el
  // detalle del acta.
  const agendaRowHtml = () => `
    <div class="commitment-row">
      <div class="two-col">
        <div class="field" style="margin-bottom:0;"><label>Tema</label><input type="text" class="ar-topic" required placeholder="Ej: Presupuesto de actividades de agosto" /></div>
        <div class="field" style="margin-bottom:0;"><label>Quién lo presenta (opcional)</label><input type="text" class="ar-presenter" placeholder="Ej: Roberto Fuentes" /></div>
      </div>
      <button type="button" class="btn btn-ghost btn-sm ar-remove">${icon('trash')} Quitar tema</button>
    </div>`;
  // Punto 8: "Consejo de Barrio" y "Coordinación de Ministración" quedan
  // reservados al Obispado — un líder común solo puede crear actas
  // "generales" (ej. de su propia presidencia). Punto 29: el Secretario de
  // Barrio también puede registrar estos dos tipos.
  const isObispadoTier = isObispadoLeader(currentUser) || currentUser.role==='ward_clerk';
  const typeOptionsHtml = isObispadoTier ? `
    <div class="field"><label>Tipo de acta</label><select name="type" id="mt-type">
      <option value="general">General (ej. presidencia de una organización)</option>
      <option value="consejo_barrio">Consejo de Barrio</option>
      <option value="coordinacion_ministracion">Coordinación de Ministración (trimestral)</option>
    </select></div>` : '';
  const modalRoot = document.getElementById('modal-root');
  modalRoot.innerHTML = `<div class="modal-backdrop" id="mt-modal-backdrop"><div class="modal" style="max-width:560px;">
    <div class="modal-header"><h3>Nueva acta</h3><button class="modal-close" id="mt-modal-close">×</button></div>
    <div class="modal-body">
      <div id="mt-error"></div>
      <form id="mt-form">
        <div class="field"><label>Título del acta</label><input type="text" name="title" required placeholder="Ej: Consejo de Barrio" /></div>
        <div class="field"><label>Fecha de la reunión</label><input type="date" name="date" required value="${toISODate(new Date())}" /></div>
        ${typeOptionsHtml}
        <div class="field">
          <label style="display:flex; align-items:center; gap:8px; font-weight:600;"><input type="checkbox" name="confidential" style="width:auto;" /> Acta confidencial</label>
          <div class="hint-box" style="margin-top:6px;">Solo el Obispado/Administrador (y quien la creó) van a poder ver los temas y compromisos — el resto la ve en la lista, pero sin el contenido.</div>
        </div>
        <div class="field"><label>Agenda — temas a tratar (opcional, se puede armar antes de la reunión)</label>
          <div id="mt-agenda"></div>
          <button type="button" class="btn btn-secondary btn-sm" id="mt-add-agenda">+ Agregar tema</button>
        </div>
        <div class="field"><label>Compromisos (opcional — también se pueden agregar después)</label>
          <div id="mt-commitments"></div>
          <button type="button" class="btn btn-secondary btn-sm" id="mt-add-commitment">+ Agregar compromiso</button>
        </div>
      </form>
    </div>
    <div class="modal-footer"><div></div><div style="display:flex; gap:8px;"><button class="btn btn-secondary" id="mt-cancel">Cancelar</button><button class="btn btn-primary" id="mt-save">Crear acta</button></div></div>
  </div></div>`;
  const agendaBox = document.getElementById('mt-agenda');
  const addAgendaRow = () => {
    agendaBox.insertAdjacentHTML('beforeend', agendaRowHtml());
    agendaBox.lastElementChild.querySelector('.ar-remove').addEventListener('click', (e)=>e.target.closest('.commitment-row').remove());
  };
  document.getElementById('mt-add-agenda').addEventListener('click', addAgendaRow);
  const commitmentsBox = document.getElementById('mt-commitments');
  const addRow = () => {
    commitmentsBox.insertAdjacentHTML('beforeend', commitmentRowHtml());
    commitmentsBox.lastElementChild.querySelector('.cr-remove').addEventListener('click', (e)=>e.target.closest('.commitment-row').remove());
  };
  document.getElementById('mt-add-commitment').addEventListener('click', addRow);
  addRow();
  const mtGuardedClose = wireUnsavedChangesGuard(document.getElementById('mt-form'));
  document.getElementById('mt-modal-close').addEventListener('click', mtGuardedClose);
  document.getElementById('mt-cancel').addEventListener('click', mtGuardedClose);
  document.getElementById('mt-modal-backdrop').addEventListener('click',(e)=>{ if(e.target.id==='mt-modal-backdrop') mtGuardedClose(); });
  document.getElementById('mt-save').addEventListener('click', ()=>{
    const form = document.getElementById('mt-form');
    if(!form.reportValidity()) return;
    const fd = new FormData(form);
    const rows = Array.from(document.querySelectorAll('#mt-commitments .commitment-row'));
    const assignableIds = new Set(assignable.map((u)=>u.id));
    for(const row of rows){
      const desc = row.querySelector('.cr-desc').value.trim();
      if(!desc) continue;
      const assignedId = Number(row.querySelector('.cr-assignee').value);
      if(!assignableIds.has(assignedId)){ document.getElementById('mt-error').innerHTML = '<div class="error-msg">El responsable elegido no es válido</div>'; return; }
    }
    const commitments = rows.map((row)=>({
      description: row.querySelector('.cr-desc').value.trim(),
      assignedToUserId: Number(row.querySelector('.cr-assignee').value),
      dueDate: row.querySelector('.cr-due').value,
    })).filter((c)=>c.description);
    const agendaItems = Array.from(document.querySelectorAll('#mt-agenda .commitment-row')).map((row)=>({
      topic: row.querySelector('.ar-topic').value.trim(),
      presenter: row.querySelector('.ar-presenter').value.trim(),
    })).filter((a)=>a.topic);
    const type = isObispadoTier ? (fd.get('type') || 'general') : 'general';
    const now = new Date().toISOString();
    const m = {
      id: nextId('meetings'), title: fd.get('title'), date: fd.get('date'),
      organizationId: currentUser.organizationId || null, status:'active',
      createdBy: currentUser.id, createdAt: now, archivedAt: null,
      type, confidential: !!fd.get('confidential'),
      agendaItems: agendaItems.map((a)=>({ id: nextId('agendaItems'), topic:a.topic, presenter:a.presenter, notes:'', necesidad:'', analisis:'', acuerdo:'', seguimiento:'', quienNecesita:'', queSeHara:'', quienLoHara:'' })),
      commitments: commitments.map((c)=>({ id: nextId('commitments'), ...c, status:'pending', completedAt:null, completionComment:'', confidential:false })),
    };
    DB.meetings.push(m);
    closeModal(); toast('Acta creada'); renderMeetingsManage();
  });
}

// Punto 16: en Consejo de Barrio, un tema de agenda sigue el patrón de
// consejo del Manual General (necesidad → análisis → acuerdo →
// seguimiento) en vez de una nota libre.
// Punto 64: Coordinación de Ministración usa su PROPIO patrón de 3 campos
// (quién necesita ayuda → qué se hará → quién lo hará), distinto del de
// Consejo de Barrio.
function agendaPatternFor(type){
  if(type==='consejo_barrio') return 'consejo';
  if(type==='coordinacion_ministracion') return 'ministracion';
  return null;
}
function isCouncilMeetingType(type){ return agendaPatternFor(type)!==null; }

function openMeetingDetailModal(m){
  const canEdit = (currentUser.role==='admin' || Number(currentUser.id)===Number(m.createdBy)) && m.status==='active';
  const typeLabel = MEETING_TYPE_LABELS[m.type] || '';
  const agendaPattern = agendaPatternFor(m.type);

    <div class="modal-header"><h3>${esc(m.title)}</h3><button class="modal-close" id="md-modal-close">×</button></div>
    <div class="modal-body">
      <div class="hint-box" style="margin-top:0;">${esc(m.organizationName)} · ${esc(fmtDateHuman(m.date))} · Creada por ${esc(m.createdByName)}${m.status==='archived'?' · 📁 Archivada':''}${typeLabel?` · ${typeLabel}`:''}${m.confidential?' · 🔒 Confidencial':''}</div>
      ${m.contentRedacted ? `<div class="empty-state">🔒 Esta acta es confidencial — solo el Obispado, el Administrador o quien la creó pueden ver su contenido.</div>` : `
      <div id="md-agenda">
        ${m.agendaItems && m.agendaItems.length ? `
          <div style="font-weight:600; font-size:13px; color:var(--celeste-darker); margin-bottom:6px;">📋 Agenda</div>
          ${m.agendaItems.map((a)=>{
            if(agendaPattern==='consejo'){
              const councilFields = [['🧩 Necesidad',a.necesidad],['🔎 Análisis',a.analisis],['✅ Acuerdo',a.acuerdo],['👣 Seguimiento',a.seguimiento]].filter(([,v])=>v);
              return `
            <div class="commitment-detail-row" data-agenda-id="${a.id}">
              <div style="font-weight:600; font-size:13.5px;">${esc(a.topic)}${a.presenter?` <span style="font-weight:400; font-size:12px; color:var(--ink-soft);">— ${esc(a.presenter)}</span>`:''}</div>
              ${councilFields.length ? councilFields.map(([label,v])=>`<div style="font-size:12.5px; color:var(--ink-soft); margin-top:4px;"><strong>${label}:</strong> ${esc(v)}</div>`).join('') : (canEdit ? `<div style="font-size:12px; color:var(--ink-soft); margin-top:4px; font-style:italic;">Sin necesidad/análisis/acuerdo/seguimiento todavía</div>` : '')}

            </div>`;

              <div style="font-weight:600; font-size:13.5px;">${esc(a.topic)}${a.presenter?` <span style="font-weight:400; font-size:12px; color:var(--ink-soft);">— ${esc(a.presenter)}</span>`:''}</div>
              ${ministeringFields.length ? ministeringFields.map(([label,v])=>`<div style="font-size:12.5px; color:var(--ink-soft); margin-top:4px;"><strong>${label}:</strong> ${esc(v)}</div>`).join('') : (canEdit ? `<div style="font-size:12px; color:var(--ink-soft); margin-top:4px; font-style:italic;">Sin quién/qué/quién todavía</div>` : '')}
              ${canEdit ? `<button type="button" class="btn btn-ghost btn-sm agenda-edit-notes" style="margin-top:4px;">📝 ${ministeringFields.length?'Editar':'Completar'} seguimiento de ministración</button>` : ''}
            </div>`;
            }
            return `
            <div class="commitment-detail-row" data-agenda-id="${a.id}">
              <div style="font-weight:600; font-size:13.5px;">${esc(a.topic)}${a.presenter?` <span style="font-weight:400; font-size:12px; color:var(--ink-soft);">— ${esc(a.presenter)}</span>`:''}</div>

              ${canEdit ? `<button type="button" class="btn btn-ghost btn-sm agenda-edit-notes" style="margin-top:4px;">📝 ${a.notes?'Editar':'Agregar'} notas</button>` : ''}

      <div><button class="btn btn-secondary" id="md-close">Cerrar</button></div>
    </div>

  document.getElementById('md-modal-close').addEventListener('click', closeModal);

  document.getElementById('md-modal-backdrop').addEventListener('click',(e)=>{ if(e.target.id==='md-modal-backdrop') closeModal(); });
  if(!m.contentRedacted) wireEmptyStateCta('md-empty-add', ()=>openAddCommitmentModal(m));
  if(canEdit){
    document.getElementById('md-toggle-confidential').addEventListener('click', ()=>{
      const raw = DB.meetings.find((x)=>x.id===m.id);
      raw.confidential = !raw.confidential;
      toast(raw.confidential ? 'Acta marcada confidencial' : 'Acta ya no es confidencial');
      openMeetingDetailModal(withMeetingInfo(raw));
      renderMeetingsManage();
    });
    const addAgendaBtn = document.getElementById('md-add-agenda');
    if(addAgendaBtn) addAgendaBtn.addEventListener('click', ()=>openAddAgendaItemModal(m));
    document.querySelectorAll('.agenda-edit-notes').forEach((btn)=>{
      btn.addEventListener('click', ()=>{
        const row = btn.closest('[data-agenda-id]');
        const itemId = Number(row.dataset.agendaId);
        const item = m.agendaItems.find((a)=>a.id===itemId);
        openEditAgendaNotesModal(m, item);
      });
    });
    const addCommitmentBtn = document.getElementById('md-add-commitment');
    if(addCommitmentBtn) addCommitmentBtn.addEventListener('click', ()=>openAddCommitmentModal(m));
    document.getElementById('md-archive').addEventListener('click', async ()=>{
      if(!(await confirmModal('¿Verificar y archivar esta acta? Los compromisos que sigan pendientes quedarán documentados como "no cumplida" y ya no aparecerán en "Mis Asignaciones" de nadie.', { title:'Verificar y archivar', confirmText:'Verificar y archivar' }))) return;
      const raw = DB.meetings.find((x)=>x.id===m.id);
      raw.status = 'archived';
      raw.archivedAt = new Date().toISOString();
      raw.commitments.forEach((c)=>{ if(c.status==='pending') c.status='not_fulfilled'; });
      closeModal(); toast('Acta archivada'); renderMeetingsManage();
    });
  }
}

function openEditAgendaNotesModal(m, item){

  const modalRoot = document.getElementById('modal-root');
  // Punto 16: en Consejo de Barrio se pide el patrón de consejo del Manual
  // General en vez de una nota libre. Punto 64: Coordinación de
  // Ministración pide su propio patrón de 3 campos.
  const bodyHtml = agendaPattern==='consejo' ? `
      <div class="hint-box" style="margin-top:0;">Patrón de consejo del Manual General: qué necesidad se detectó, qué se analizó, qué se acordó, y cómo se le hará seguimiento.</div>

      <div class="field"><label>🔎 Análisis</label><textarea name="analisis" rows="2">${esc(item.analisis||'')}</textarea></div>
      <div class="field"><label>✅ Acuerdo</label><textarea name="acuerdo" rows="2">${esc(item.acuerdo||'')}</textarea></div>
      <div class="field"><label>👣 Seguimiento</label><textarea name="seguimiento" rows="2">${esc(item.seguimiento||'')}</textarea></div>
  ` : agendaPattern==='ministracion' ? `
      <div class="hint-box" style="margin-top:0;">Patrón de Coordinación de Ministración: quién necesita ayuda, qué se hará, y quién lo hará.</div>

const WELFARE_CATEGORY_LABELS = { alimento:'🍞 Alimento', vivienda:'🏠 Vivienda', empleo:'💼 Empleo', otro:'📋 Otro' };

  });
  document.getElementById('wf-save').addEventListener('click', ()=>{

function findOrCreateFamily(rawName){
  const name = String(rawName||'').trim();
  const norm = normalizeSearchText(name);
  let family = DB.families.find((f)=>normalizeSearchText(f.name)===norm);
  if(!family){ family = { id: nextId('families'), name, createdAt: new Date().toISOString() }; DB.families.push(family); }
  return family;
}
function familyStats(familyId){
  const done = DB.cleaningShifts.filter((s)=>s.familyId===familyId && s.status==='done');
  return { timesDone: done.length, lastDoneDate: done.length ? done.map((s)=>s.date).sort().slice(-1)[0] : null };
}
function withShiftInfo(shift){
  const family = DB.families.find((f)=>f.id===Number(shift.familyId));
  return { ...shift, familyName: family?.name || shift.familyName || '(familia eliminada)', ...familyStats(Number(shift.familyId)) };
}
// Reutilizado por Rachas y Logros para el ranking "Familia con más aseo
// cumplido" — `range` es opcional ({start,end} ISO, ambas inclusive); sin
// rango es el histórico completo ("Todo el tiempo").
function allFamiliesWithStats(range){
  const inRange = (date) => !range || (date >= range.start && date <= range.end);
  return DB.families
    .map((f) => {
      const done = DB.cleaningShifts.filter((s) => s.familyId === f.id && s.status === 'done' && inRange(s.date));
      return { familyId: f.id, familyName: f.name, timesDone: done.length, lastDoneDate: done.length ? done.map((s) => s.date).sort().slice(-1)[0] : null };
    })
    .filter((f) => f.timesDone > 0)
    .sort((a, b) => b.timesDone - a.timesDone);
}

function renderCleaningView(){
  const container = document.getElementById('assignments-content');
  const shifts = DB.cleaningShifts.map(withShiftInfo);
  // Un turno es una fecha (el sábado de aseo) con una o varias familias
  // asignadas ese mismo día — se agrupa acá por fecha para que el listado
  // muestre una tarjeta por sábado, no una fila por cada familia.
  const byDate = new Map();
  shifts.forEach((s)=>{ if(!byDate.has(s.date)) byDate.set(s.date, []); byDate.get(s.date).push(s); });
  const dates = [...byDate.keys()].sort((a,b)=>b.localeCompare(a));
  container.innerHTML = `
    <div class="section-header">
      <div><p>Cada turno puede tener una o varias familias asignadas</p></div>
      <div style="display:flex; gap:8px;">
        ${shifts.length ? `<button class="btn btn-secondary btn-sm" id="cs-export-csv" title="Exportar a CSV">⬇️ CSV</button>` : ''}
        <button class="btn btn-primary" id="cs-new">+ Nuevo turno</button>
      </div>
    </div>
    <div class="card-list">${dates.length ? dates.map((d)=>cleaningDateCardHtml(d, byDate.get(d))).join('') : emptyStateHtml('Todavía no hay turnos asignados', { id:'cs-empty-new', label:'+ Agregar el primero' })}</div>`;
  document.getElementById('cs-new').addEventListener('click', ()=>openCleaningShiftModal());
  wireEmptyStateCta('cs-empty-new', ()=>openCleaningShiftModal());
  const csCsvBtn = document.getElementById('cs-export-csv');
  if(csCsvBtn) csCsvBtn.addEventListener('click', ()=>{
    const statusLabel = { done:'Sí fue', not_done:'No fue' };
    downloadCsv('turnos-de-aseo.csv', ['Fecha','Familia','Estado'],
      shifts.map((s)=>[fmtDateHuman(s.date), s.familyName, statusLabel[s.status] || 'Por confirmar']));
  });
  wireCleaningShiftCards();
}

function cleaningStatusPillHtml(status){
  if(status==='done') return `<span class="status-pill status-green">✅ Sí fue</span>`;
  if(status==='not_done') return `<span class="status-pill status-red">❌ No fue</span>`;
  return `<span class="status-pill status-amber">Por confirmar</span>`;

function cleaningDateCardHtml(date, entries){

function cleaningFamilyRowHtml(s){

function wireCleaningShiftCards(){
  document.querySelectorAll('.cleaning-family-row').forEach((row)=>{
    const id = Number(row.dataset.id);
    row.querySelectorAll('.cs-mark').forEach((btn)=>{
      btn.addEventListener('click', ()=>{
        const shift = DB.cleaningShifts.find((s)=>s.id===id);
        if(!shift) return;
        shift.status = btn.dataset.status;
        shift.markedAt = new Date().toISOString();
        shift.markedBy = currentUser.id;
        toast('Turno actualizado');
        renderCleaningView();
      });
    });
    row.querySelector('.cs-remove').addEventListener('click', async ()=>{
      if(!(await confirmModal('¿Quitar esta familia del turno?', { title:'Quitar familia', confirmText:'Quitar', danger:true }))) return;
      DB.cleaningShifts = DB.cleaningShifts.filter((s)=>s.id!==id);
      toast('Familia quitada del turno');
      renderCleaningView();
    });
  });
  document.querySelectorAll('.cs-add-family').forEach((btn)=>{
    btn.addEventListener('click', ()=>openCleaningShiftModal(btn.dataset.date));
  });
  document.querySelectorAll('.cs-mark-all-done').forEach((btn)=>{
    btn.addEventListener('click', async ()=>{
      const card = btn.closest('.cleaning-date-card');
      const ids = Array.from(card.querySelectorAll('.cleaning-family-row')).map((r)=>Number(r.dataset.id));
      if(!ids.length) return;
      if(!(await confirmModal(`¿Marcar las ${ids.length} familias de este turno como "Sí fue"?`, { title:'Marcar turno completo', confirmText:'Marcar todas' }))) return;
      let okCount = 0;
      ids.forEach((id)=>{
        const shift = DB.cleaningShifts.find((s)=>s.id===id);
        if(shift){ shift.status='done'; shift.markedAt=new Date().toISOString(); shift.markedBy=currentUser.id; okCount++; }
      });
      toast(`Turno actualizado (${okCount}/${ids.length})`);
      renderCleaningView();
    });
  });
}

      const exact = families.find((f)=>normalizeSearchText(f.name)===q);
      showStatsFor(exact || { timesDone:0, lastDoneDate:null });
      if(!matches.length){ resultsBox.style.display='none'; resultsBox.innerHTML=''; return; }

      resultsBox.style.display = '';
      resultsBox.querySelectorAll('.ac-item').forEach((el)=>{
